name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The notes come from an Obsidian vault, where %% %% marks a private
      # note-to-self. The build strips them, but this repo is public while the
      # paper is under review, so fail loudly rather than publish one by
      # accident through a source file that slipped in unsanitized.
      - name: Check for unpublished comments in sources
        run: |
          if grep -rnE '%%|<!--' src/; then
            echo "::error::Private comment (%% or HTML) found in src/ — sanitize before pushing."
            exit 1
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
