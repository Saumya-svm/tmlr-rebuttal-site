7.1, 41.3]<\/td>\n<td align=\"right\">28.89 [20.3, 38.8]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-38B<\/td>\n<td align=\"right\">42.78 [36.89, 48.89]<\/td>\n<td align=\"right\">41.74 [36.89, 48.70]<\/td>\n<td align=\"right\">36.80 [33.9, 46.8]<\/td>\n<td align=\"right\">40.96 [32.5, 52.7]<\/td>\n<td align=\"right\">33.75 [31.9, 49.5]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-14B<\/td>\n<td align=\"right\">34.41 [31.50, 37.38]<\/td>\n<td align=\"right\">34.52 [31.39, 37.73]<\/td>\n<td align=\"right\">38.23 [35.7, 46.9]<\/td>\n<td align=\"right\">38.38 [31.0, 45.4]<\/td>\n<td align=\"right\">35.95 [34.0, 55.8]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td align=\"right\">40.48 [37.03, 43.47]<\/td>\n<td align=\"right\">39.98 [36.44, 43.35]<\/td>\n<td align=\"right\">41.16 [36.0, 49.2]<\/td>\n<td align=\"right\">42.86 [33.1, 47.8]<\/td>\n<td align=\"right\">33.17 [33.0, 49.4]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-38B<\/td>\n<td align=\"right\">44.31 [37.38, 50.20]<\/td>\n<td align=\"right\">43.24 [36.40, 49.67]<\/td>\n<td align=\"right\">40.95 [38.9, 51.3]<\/td>\n<td align=\"right\">46.69 [38.7, 53.7]<\/td>\n<td align=\"right\">32.25 [25.2, 53.6]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-14B<\/td>\n<td align=\"right\">37.17 [34.53, 40.05]<\/td>\n<td align=\"right\">36.37 [33.66, 39.45]<\/td>\n<td align=\"right\">33.24 [26.5, 41.6]<\/td>\n<td align=\"right\">33.94 [26.7, 43.4]<\/td>\n<td align=\"right\">27.95 [20.0, 44.4]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td align=\"right\">35.91 [33.24, 38.35]<\/td>\n<td align=\"right\">36.07 [33.09, 38.69]<\/td>\n<td align=\"right\">33.33 [30.4, 42.9]<\/td>\n<td align=\"right\">39.58 [30.2, 49.4]<\/td>\n<td align=\"right\">17.32 [14.2, 36.2]<\/td>\n<\/tr>\n<tr>\n<td>GLM-4.1V-9B-Thinking<\/td>\n<td align=\"right\">35.98 [32.91, 38.49]<\/td>\n<td align=\"right\">35.90 [32.73, 38.80]<\/td>\n<td align=\"right\">25.80 [19.7, 30.8]<\/td>\n<td align=\"right\">29.75 [18.2, 45.5]<\/td>\n<td align=\"right\">31.25 [0.0, 41.5]<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The NC intervals are systematically wider than the AB intervals, making the\ngreater uncertainty of the smaller counting split explicit.<\/p>\n<h3>Uncertainty of the numerical-counting results.<\/h3>\n<p>We thank the reviewer for raising the question of statistical reliability,\nparticularly for Numerical Counting (NC), where the evaluation set is smaller\nthan for Attribute Binding. We therefore additionally report confidence\nintervals for all pooled NC metrics: IMRA, LMRA, and GMRA. The values in\nbrackets denote the corresponding 95% confidence intervals.<\/p>\n<p>The resulting intervals make the uncertainty in the counting analysis\nexplicit. For example, Gemini-3.5-Flash-Low obtains an IMRA of\n61.50 [56.7, 69.6], LMRA of 59.77 [58.9, 76.9], and GMRA of\n59.51 [52.4, 68.1]. Across models, the NC intervals are generally wider than\nthe corresponding AB intervals, as expected from the smaller number of NC\nexamples.<\/p>\n<p>We will therefore report the NC point estimates together with their confidence\nintervals in the revised manuscript, so that differences in IMRA, LMRA, and\nGMRA can be interpreted together with the uncertainty arising from the\navailable counting data.<\/p>\n<p>The Numerical Counting split contains <strong>57 parent queries in total<\/strong>,\ncomprising <strong>18 parent queries from real images<\/strong> and <strong>39 parent queries from\nsynthetic images<\/strong>. We will report these counts alongside the NC results so\nthat the amount of independent support underlying LMRA and GMRA is explicit.<\/p>\n<h3>Uncertainty for the visual-prompting diagnostic.<\/h3>\n<p>Because visual prompting is evaluated on matched examples, we report the\npaired change in IACC and its 95% confidence interval.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> IACC<\/th>\n<th align=\"right\">95% CI of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Qwen3-VL-8B-Instruct<\/td>\n<td align=\"right\"><strong>+25.5<\/strong><\/td>\n<td align=\"right\">[19.84, 31.59]<\/td>\n<\/tr>\n<tr>\n<td>GLM-4.5V<\/td>\n<td align=\"right\"><strong>+18.5<\/strong><\/td>\n<td align=\"right\">[13.42, 23.96]<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-32B-Instruct<\/td>\n<td align=\"right\"><strong>+18.0<\/strong><\/td>\n<td align=\"right\">[13.85, 22.12]<\/td>\n<\/tr>\n<tr>\n<td>Qwen2.5-VL-32B-Instruct<\/td>\n<td align=\"right\"><strong>+22.5<\/strong><\/td>\n<td align=\"right\">[18.11, 26.98]<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-30B-A3B-Instruct<\/td>\n<td align=\"right\"><strong>+24.0<\/strong><\/td>\n<td align=\"right\">[16.20, 29.15]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-38B<\/td>\n<td align=\"right\"><strong>+10.8<\/strong><\/td>\n<td align=\"right\">[6.95, 14.97]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-38B<\/td>\n<td align=\"right\"><strong>+12.4<\/strong><\/td>\n<td align=\"right\">[8.04, 17.17]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-14B<\/td>\n<td align=\"right\"><strong>+13.2<\/strong><\/td>\n<td align=\"right\">[9.81, 17.01]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-14B<\/td>\n<td align=\"right\"><strong>+11.2<\/strong><\/td>\n<td align=\"right\">[7.09, 15.44]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td align=\"right\"><strong>+8.6<\/strong><\/td>\n<td align=\"right\">[5.29, 12.37]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td align=\"right\"><strong>+6.0<\/strong><\/td>\n<td align=\"right\">[3.87, 8.48]<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>All paired 95% confidence intervals exclude zero, showing that the positive\nvisual-prompting differences are consistently observed under the sampling\nprocedure.<\/p>\n<h3>Uncertainty for the reasoning-mode diagnostic (Table 4).<\/h3>\n<p>For Table 4, we report the paired difference between reasoning conditions. For Qwen models, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">T<\/mi><mi mathvariant=\"normal\">h<\/mi><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">n<\/mi><mi mathvariant=\"normal\">k<\/mi><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">n<\/mi><mi mathvariant=\"normal\">g<\/mi><\/mrow><mo>−<\/mo><mrow><mi mathvariant=\"normal\">I<\/mi><mi mathvariant=\"normal\">n<\/mi><mi mathvariant=\"normal\">s<\/mi><mi mathvariant=\"normal\">t<\/mi><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">u<\/mi><mi mathvariant=\"normal\">c<\/mi><mi mathvariant=\"normal\">t<\/mi><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">\\Delta=\\mathrm{Thinking}-\\mathrm{Instruct}<\/annotation><\/semantics><\/math><\/span>; for Gemini models, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">H<\/mi><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">g<\/mi><mi mathvariant=\"normal\">h<\/mi><mtext> <\/mtext><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">e<\/mi><mi mathvariant=\"normal\">a<\/mi><mi mathvariant=\"normal\">s<\/mi><mi mathvariant=\"normal\">o<\/mi><mi mathvariant=\"normal\">n<\/mi><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">n<\/mi><mi mathvariant=\"normal\">g<\/mi><\/mrow><mo>−<\/mo><mrow><mi mathvariant=\"normal\">L<\/mi><mi mathvariant=\"normal\">o<\/mi><mi mathvariant=\"normal\">w<\/mi><mtext> <\/mtext><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">e<\/mi><mi mathvariant=\"normal\">a<\/mi><mi mathvariant=\"normal\">s<\/mi><mi mathvariant=\"normal\">o<\/mi><mi mathvariant=\"normal\">n<\/mi><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">n<\/mi><mi mathvariant=\"normal\">g<\/mi><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">\\Delta=\\mathrm{High\\ reasoning}-\\mathrm{Low\\ reasoning}<\/annotation><\/semantics><\/math><\/span>. Bold entries denote differences whose 95% confidence interval excludes zero.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> IACC (95% CI)<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span> (95% CI)<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> IMRA (95% CI)<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> LMRA (95% CI)<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> GMRA (95% CI)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Q3-8B<\/td>\n<td align=\"right\"><strong>+5.2 [+0.8, +9.9]<\/strong><\/td>\n<td align=\"right\">+4.7 [-2.7, +12.1]<\/td>\n<td align=\"right\">+3.4 [-6.0, +13.5]<\/td>\n<td align=\"right\"><strong>+22.3 [+11.2, +36.2]<\/strong><\/td>\n<td align=\"right\">+5.9 [-4.4, +15.3]<\/td>\n<\/tr>\n<tr>\n<td>Q3-30B-A3B<\/td>\n<td align=\"right\">+1.8 [-0.9, +4.4]<\/td>\n<td align=\"right\"><strong>+5.0 [+1.9, +7.6]<\/strong><\/td>\n<td align=\"right\">—<\/td>\n<td align=\"right\">—<\/td>\n<td align=\"right\">—<\/td>\n<\/tr>\n<tr>\n<td>Q3-32B<\/td>\n<td align=\"right\">-0.1 [-4.4, +7.4]<\/td>\n<td align=\"right\">-2.5 [-9.5, +10.5]<\/td>\n<td align=\"right\">+2.5 [-8.9, +11.9]<\/td>\n<td align=\"right\">+2.8 [-10.4, +14.3]<\/td>\n<td align=\"right\">-6.2 [-23.1, +7.6]<\/td>\n<\/tr>\n<tr>\n<td>G3.1-Pro-Preview<\/td>\n<td align=\"right\">-0.6 [-2.5, +1.1]<\/td>\n<td align=\"right\">+0.1 [-2.4, +2.4]<\/td>\n<td align=\"right\">-4.8 [-8.6, +1.3]<\/td>\n<td align=\"right\">-5.9 [-12.4, +4.1]<\/td>\n<td align=\"right\">+1.2 [-10.7, +11.9]<\/td>\n<\/tr>\n<tr>\n<td>G3.5-Flash<\/td>\n<td align=\"right\"><strong>+3.6 [+0.6, +5.7]<\/strong><\/td>\n<td align=\"right\">-1.9 [-4.8, +0.4]<\/td>\n<td align=\"right\"><strong>+6.4 [+3.2, +10.6]<\/strong><\/td>\n<td align=\"right\"><strong>+13.3 [+9.3, +18.0]<\/strong><\/td>\n<td align=\"right\"><strong>+5.0 [+0.4, +12.3]<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>These intervals reinforce the manuscript&#39;s interpretation that test-time reasoning does not uniformly improve MIMO performance. Several nominal changes have intervals that include zero, while clear improvements occur only for particular model--metric combinations.<\/p>\n<hr>\n<h3>Uncertainty for the Chain-of-Thought diagnostic (Figure 8).<\/h3>\n<p>For Figure 8, we report paired changes relative to the same Base condition,<\/p>\n<p>[\n\\Delta_{\\mathrm{ZS-CoT}}=\\mathrm{ZS\\mbox{-}CoT}-\\mathrm{Base},\n]<\/p>\n<p>and<\/p>\n<p>[\n\\Delta_{\\mathrm{SC-CoT}}=\\mathrm{SC\\mbox{-}CoT}-\\mathrm{Base}.\n]<\/p>\n<p>Bold entries denote differences whose 95% confidence interval excludes zero.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> ZS-CoT vs. Base (95% CI)<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> SC-CoT vs. Base (95% CI)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>IVL3-14B<\/td>\n<td align=\"right\">-2.0 [-5.2, +1.5]<\/td>\n<td align=\"right\">+4.0 [-4.3, +9.6]<\/td>\n<\/tr>\n<tr>\n<td>IVL3-8B<\/td>\n<td align=\"right\">-1.0 [-4.0, +2.3]<\/td>\n<td align=\"right\">-1.0 [-5.1, +6.5]<\/td>\n<\/tr>\n<tr>\n<td>IVL3.5-14B<\/td>\n<td align=\"right\">+1.0 [-4.3, +5.4]<\/td>\n<td align=\"right\">+0.0 [-14.2, +9.1]<\/td>\n<\/tr>\n<tr>\n<td>IVL3.5-8B<\/td>\n<td align=\"right\"><strong>+7.0 [+4.3, +9.6]<\/strong><\/td>\n<td align=\"right\">+1.0 [-6.8, +6.3]<\/td>\n<\/tr>\n<tr>\n<td>QVL2.5-7B<\/td>\n<td align=\"right\">+1.0 [-3.9, +7.0]<\/td>\n<td align=\"right\">+2.0 [-13.8, +10.6]<\/td>\n<\/tr>\n<tr>\n<td>QVL2.5-32B<\/td>\n<td align=\"right\">+0.0 [-11.2, +8.7]<\/td>\n<td align=\"right\">-1.0 [-8.1, +4.2]<\/td>\n<\/tr>\n<tr>\n<td>QVL3-8B<\/td>\n<td align=\"right\">+0.0 [-9.0, +4.9]<\/td>\n<td align=\"right\">+0.0 [-12.4, +8.0]<\/td>\n<\/tr>\n<tr>\n<td>QVL3-32B<\/td>\n<td align=\"right\"><strong>-7.0 [-17.3, -1.4]<\/strong><\/td>\n<td align=\"right\"><strong>-11.0 [-15.3, -3.7]<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2 class=\"request\" id=\"r6-investigate-the-large-syntheticreal-gap-for-gemini-3x\"><span class=\"request-meta\"><span class=\"request-num\">R6<\/span><span class=\"chip chip-strengthening\">Strengthening<\/span><\/span><span class=\"request-title\">Investigate the large synthetic/real gap for Gemini-3.x<\/span><\/h2>\n\n<h3>Gemini-3.x synthetic--real gap.<\/h3>\n<p>We thank the reviewer for pointing out this anomaly. The synthetic images were generated using Gemini-2.5-Pro, and our existing self-preference analysis tests the generating model itself: on the synthetic split it obtains 47.7 AB <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">I<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{I}_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span> against 49.7 for GPT-5-medium, 47.9 for Q3-32B-Instruct and 45.1 for IVL3.5-241B-A28B, so the generator is mid-pack on its own images rather than uniquely advantaged. The unusually large synthetic gain is instead specific to Gemini-3.x, while several other evaluated models show much smaller gains, no gain, or even better performance on real images.<\/p>\n<p>We agree that the current experiments do not allow us to determine why Gemini-3.x performance is so strongly skewed toward the synthetic split. We therefore treat this result as an observed anomaly rather than attributing it to either genuine capability or a generator-specific effect. We will make this limitation explicit in the revised manuscript and clarify that the available self-preference control applies specifically to Gemini-2.5-Pro, the model used to generate the synthetic images.<\/p>\n","counts":{"critical":3,"total":6}},{"id":"02","title":"Reviewer 8nar — Metrics, Synthetic Bias, Uncertainty, Human Baseline, and Zooming","nav":"Reviewer 8nar","toc":[{"id":"r1-clarify-whether-group-accuracy-is-the-macro-average-in-eq-1-","num":"R1","tag":null,"kind":null,"title":"Clarify whether group accuracy is the macro average in Eq. (1) or the joint criterion in Sec. 3.2"},{"id":"r2-run-or-properly-scope-the-synthetic-self-preference-check-fo","num":"R2","tag":null,"kind":null,"title":"Run or properly scope the synthetic self-preference check for Gemini-3.5-Flash and Gemini-3.1-Pro-Preview"},{"id":"r3-report-repeated-runs-or-intervals-for-tables-2-and-4-and-fig","num":"R3","tag":null,"kind":null,"title":"Report repeated runs or intervals for Tables 2 and 4 and Figures 5 and 8"},{"id":"r4-report-the-number-of-parent-queries-per-split","num":"R4","tag":null,"kind":null,"title":"Report the number of parent queries per split"},{"id":"r5-explain-how-the-answering-filter-shapes-the-human-baseline","num":"R5","tag":null,"kind":null,"title":"Explain how the answering filter shapes the human baseline"},{"id":"r6-extend-the-zoom-study-to-at-least-one-strong-model","num":"R6","tag":null,"kind":null,"title":"Extend the zoom study to at least one strong model"}],"html":"<h2 class=\"request\" id=\"r1-clarify-whether-group-accuracy-is-the-macro-average-in-eq-1-\"><span class=\"request-meta\"><span class=\"request-num\">R1<\/span><\/span><span class=\"request-title\">Clarify whether group accuracy is the macro average in Eq. (1) or the joint criterion in Sec. 3.2<\/span><\/h2>\n\n<h3>Clarification of Group Accuracy (G_ACC)<\/h3>\n<p>We thank the reviewer for raising this point. We would like to clarify that <strong>G_ACC was not intended to be an all-or-nothing criterion<\/strong>. As explicitly defined in Eq. (1), for each target instance we first compute the fraction of its valid attribute questions answered correctly, and then average this quantity equally across target instances. Thus, an instance for which four out of five attributes are answered correctly contributes 0.8, not 0.<\/p>\n<p>Our use of the term <em>jointly<\/em> was intended to indicate that the valid attributes associated with the same target instance are evaluated together as a group, rather than pooling all attribute questions independently across the benchmark. This group-wise averaging also ensures that every target instance receives equal weight regardless of the number of valid attributes associated with it; consequently, an error has a larger effect on the score of an instance characterized by fewer attributes.<\/p>\n<p>We agree that the word <em>jointly<\/em> may be read as implying an all-attributes-correct criterion, although this is not what Eq. (1) computes. We will revise this wording in the manuscript to make the intended interpretation explicit. <strong>The metric definition and reported results remain unchanged.<\/strong><\/p>\n<hr>\n<h2 class=\"request\" id=\"r2-run-or-properly-scope-the-synthetic-self-preference-check-fo\"><span class=\"request-meta\"><span class=\"request-num\">R2<\/span><\/span><span class=\"request-title\">Run or properly scope the synthetic self-preference check for Gemini-3.5-Flash and Gemini-3.1-Pro-Preview<\/span><\/h2>\n\n<h3>Scope of the synthetic self-preference control<\/h3>\n<p>We thank the reviewer for this suggestion, and would like to first clarify what the existing control measures. The synthetic-image self-preference check reported in the appendix is a <strong>between-model comparison on the synthetic split<\/strong>, not a real-versus-synthetic comparison. Using the same prompt, answer-format constraints and decoding setup as the main evaluation, G2.5-Pro obtains <strong>47.7<\/strong> synthetic AB <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">I<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{I}_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span>, against <strong>49.7<\/strong> for GPT-5-medium, <strong>47.9<\/strong> for Q3-32B-Instruct and <strong>45.1<\/strong> for IVL3.5-241B-A28B.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Model<\/strong><\/th>\n<th align=\"right\"><strong>Syn. AB <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">I<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{I}_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span><\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>G2.5-Pro <em>(generator)<\/em><\/td>\n<td align=\"right\">47.7<\/td>\n<\/tr>\n<tr>\n<td>GPT-5-medium<\/td>\n<td align=\"right\">49.7<\/td>\n<\/tr>\n<tr>\n<td>Q3-32B-Instruct<\/td>\n<td align=\"right\">47.9<\/td>\n<\/tr>\n<tr>\n<td>IVL3.5-241B-A28B<\/td>\n<td align=\"right\">45.1<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The generating model is therefore mid-pack on its own images rather than uniquely dominant, and is outperformed by two of the three non-Gemini models compared. This is the sense in which we report no self-preference advantage: the synthetic split does not confer an artificial benefit on the model that produced it.<\/p>\n<p>We would also note that self-preference is defined only with respect to the <strong>generating<\/strong> model. Neither Gemini-3.5-Flash nor Gemini-3.1-Pro-Preview generated any MIMO-Bench image. Applying the same check to these models would therefore not test self-preference; it would test whether models within the Gemini family share an affinity for Gemini-generated images. That is a distinct hypothesis, and one the present control is not designed to isolate, since the control establishes its conclusion by comparing the generator against contemporaneous non-Gemini models rather than by comparing splits within a single model.<\/p>\n<p>We agree that the Gemini-3.x synthetic gain itself remains unexplained by our current experiments. We treat it as an <strong>observed anomaly<\/strong> rather than attributing it either to genuine capability or to a generator-specific effect, and we will state this explicitly as a limitation in the revised manuscript, together with the scope of the available control.<\/p>\n<hr>\n<h2 class=\"request\" id=\"r3-report-repeated-runs-or-intervals-for-tables-2-and-4-and-fig\"><span class=\"request-meta\"><span class=\"request-num\">R3<\/span><\/span><span class=\"request-title\">Report repeated runs or intervals for Tables 2 and 4 and Figures 5 and 8<\/span><\/h2>\n\n<h3>Statistical uncertainty for Table 2<\/h3>\n<p>We thank the reviewer for requesting uncertainty estimates for the main evaluation. We now report 95% confidence intervals alongside the Table 2 metrics, for both Attribute Binding (IACC and G_ACC) and Numerical Counting (IMRA, LMRA and GMRA).<\/p>\n<h4>Attribute Binding (AB)<\/h4>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>Variant<\/th>\n<th>Real IACC<\/th>\n<th>Real G_ACC<\/th>\n<th>Syn. IACC<\/th>\n<th>Syn. G_ACC<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>API-accessed MLLMs<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Gemini-3.x<\/td>\n<td>3.5 Flash High<\/td>\n<td>54.58 [49.64, 60.14]<\/td>\n<td>54.89 [49.90, 60.99]<\/td>\n<td>68.24 [63.90, 73.24]<\/td>\n<td>67.91 [63.41, 73.31]<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>3.5 Flash Low<\/td>\n<td>45.5 [41.54, 50.99]<\/td>\n<td>44.8 [40.72, 50.92]<\/td>\n<td>73.0 [68.13, 79.39]<\/td>\n<td>75.6 [70.61, 82.25]<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>3.1 Pro Preview High<\/td>\n<td>48.29 [44.52, 53.87]<\/td>\n<td>47.30 [42.47, 54.65]<\/td>\n<td>65.41 [61.40, 70.28]<\/td>\n<td>65.92 [61.32, 71.55]<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>3.1 Pro Preview Low<\/td>\n<td>46.5 [41.75, 52.78]<\/td>\n<td> : Visual Prompting<\/h4>\n<p>For the visual-prompting experiment, we report uncertainty directly on the paired performance difference,<\/p>\n<p>[\n\\Delta = \\mathrm{IACC}<em>{\\mathrm{Visual\\ Prompting}} - \\mathrm{IACC}<\/em>{\\mathrm{Without\\ Visual\\ Prompting}}.\n]<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> IACC<\/th>\n<th align=\"right\">95% CI of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Qwen3-VL-8B-Instruct<\/td>\n<td align=\"right\"><strong>+25.5<\/strong><\/td>\n<td align=\"right\">[19.84, 31.59]<\/td>\n<\/tr>\n<tr>\n<td>GLM-4.5V<\/td>\n<td align=\"right\"><strong>+18.5<\/strong><\/td>\n<td align=\"right\">[13.42, 23.96]<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-32B-Instruct<\/td>\n<td align=\"right\"><strong>+18.0<\/strong><\/td>\n<td align=\"right\">[13.85, 22.12]<\/td>\n<\/tr>\n<tr>\n<td>Qwen2.5-VL-32B-Instruct<\/td>\n<td align=\"right\"><strong>+22.5<\/strong><\/td>\n<td align=\"right\">[18.11, 26.98]<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-30B-A3B-Instruct<\/td>\n<td align=\"right\"><strong>+24.0<\/strong><\/td>\n<td align=\"right\">[16.20, 29.15]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-38B<\/td>\n<td align=\"right\"><strong>+10.8<\/strong><\/td>\n<td align=\"right\">[6.95, 14.97]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-38B<\/td>\n<td align=\"right\"><strong>+12.4<\/strong><\/td>\n<td align=\"right\">[8.04, 17.17]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-14B<\/td>\n<td align=\"right\"><strong>+13.2<\/strong><\/td>\n<td align=\"right\">[9.81, 17.01]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-14B<\/td>\n<td align=\"right\"><strong>+11.2<\/strong><\/td>\n<td align=\"right\">[7.09, 15.44]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td align=\"right\"><strong>+8.6<\/strong><\/td>\n<td align=\"right\">[5.29, 12.37]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td align=\"right\"><strong>+6.0<\/strong><\/td>\n<td align=\"right\">[3.87, 8.48]<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The 95% confidence interval of the paired improvement excludes zero for all 11 evaluated models. Thus, although the magnitude of the gain varies across models, the positive effect of visual prompting is consistently observed across the evaluated models.<\/p>\n<hr>\n<h4>Confidence intervals for Table 4: Thinking vs. Non-Thinking<\/h4>\n<p>For Table 4, we report the paired difference between reasoning conditions. For Qwen models, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">T<\/mi><mi mathvariant=\"normal\">h<\/mi><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">n<\/mi><mi mathvariant=\"normal\">k<\/mi><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">n<\/mi><mi mathvariant=\"normal\">g<\/mi><\/mrow><mo>−<\/mo><mrow><mi mathvariant=\"normal\">I<\/mi><mi mathvariant=\"normal\">n<\/mi><mi mathvariant=\"normal\">s<\/mi><mi mathvariant=\"normal\">t<\/mi><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">u<\/mi><mi mathvariant=\"normal\">c<\/mi><mi mathvariant=\"normal\">t<\/mi><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">\\Delta=\\mathrm{Thinking}-\\mathrm{Instruct}<\/annotation><\/semantics><\/math><\/span>; for Gemini models, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">H<\/mi><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">g<\/mi><mi mathvariant=\"normal\">h<\/mi><mtext> <\/mtext><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">e<\/mi><mi mathvariant=\"normal\">a<\/mi><mi mathvariant=\"normal\">s<\/mi><mi mathvariant=\"normal\">o<\/mi><mi mathvariant=\"normal\">n<\/mi><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">n<\/mi><mi mathvariant=\"normal\">g<\/mi><\/mrow><mo>−<\/mo><mrow><mi mathvariant=\"normal\">L<\/mi><mi mathvariant=\"normal\">o<\/mi><mi mathvariant=\"normal\">w<\/mi><mtext> <\/mtext><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">e<\/mi><mi mathvariant=\"normal\">a<\/mi><mi mathvariant=\"normal\">s<\/mi><mi mathvariant=\"normal\">o<\/mi><mi mathvariant=\"normal\">n<\/mi><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">n<\/mi><mi mathvariant=\"normal\">g<\/mi><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">\\Delta=\\mathrm{High\\ reasoning}-\\mathrm{Low\\ reasoning}<\/annotation><\/semantics><\/math><\/span>. Bold entries denote differences whose 95% confidence interval excludes zero.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> IACC (95% CI)<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span> (95% CI)<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> IMRA (95% CI)<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> LMRA (95% CI)<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> GMRA (95% CI)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Q3-8B<\/td>\n<td align=\"right\"><strong>+5.2 [+0.8, +9.9]<\/strong><\/td>\n<td align=\"right\">+4.7 [-2.7, +12.1]<\/td>\n<td align=\"right\">+3.4 [-6.0, +13.5]<\/td>\n<td align=\"right\"><strong>+22.3 [+11.2, +36.2]<\/strong><\/td>\n<td align=\"right\">+5.9 [-4.4, +15.3]<\/td>\n<\/tr>\n<tr>\n<td>Q3-30B-A3B<\/td>\n<td align=\"right\">+1.8 [-0.9, +4.4]<\/td>\n<td align=\"right\"><strong>+5.0 [+1.9, +7.6]<\/strong><\/td>\n<td align=\"right\">—<\/td>\n<td align=\"right\">—<\/td>\n<td align=\"right\">—<\/td>\n<\/tr>\n<tr>\n<td>Q3-32B<\/td>\n<td align=\"right\">-0.1 [-4.4, +7.4]<\/td>\n<td align=\"right\">-2.5 [-9.5, +10.5]<\/td>\n<td align=\"right\">+2.5 [-8.9, +11.9]<\/td>\n<td align=\"right\">+2.8 [-10.4, +14.3]<\/td>\n<td align=\"right\">-6.2 [-23.1, +7.6]<\/td>\n<\/tr>\n<tr>\n<td>G3.1-Pro-Preview<\/td>\n<td align=\"right\">-0.6 [-2.5, +1.1]<\/td>\n<td align=\"right\">+0.1 [-2.4, +2.4]<\/td>\n<td align=\"right\">-4.8 [-8.6, +1.3]<\/td>\n<td align=\"right\">-5.9 [-12.4, +4.1]<\/td>\n<td align=\"right\">+1.2 [-10.7, +11.9]<\/td>\n<\/tr>\n<tr>\n<td>G3.5-Flash<\/td>\n<td align=\"right\"><strong>+3.6 [+0.6, +5.7]<\/strong><\/td>\n<td align=\"right\">-1.9 [-4.8, +0.4]<\/td>\n<td align=\"right\"><strong>+6.4 [+3.2, +10.6]<\/strong><\/td>\n<td align=\"right\"><strong>+13.3 [+9.3, +18.0]<\/strong><\/td>\n<td align=\"right\"><strong>+5.0 [+0.4, +12.3]<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>These intervals reinforce the manuscript&#39;s interpretation that test-time reasoning does not uniformly improve MIMO performance. Several nominal changes have intervals that include zero, while clear improvements occur only for particular model--metric combinations.<\/p>\n<hr>\n<h4>Confidence intervals for Figure 8: Chain-of-Thought Prompting<\/h4>\n<p>For Figure 8, we report paired changes relative to the same Base condition,<\/p>\n<p>[\n\\Delta_{\\mathrm{ZS-CoT}}=\\mathrm{ZS\\mbox{-}CoT}-\\mathrm{Base},\n]<\/p>\n<p>and<\/p>\n<p>[\n\\Delta_{\\mathrm{SC-CoT}}=\\mathrm{SC\\mbox{-}CoT}-\\mathrm{Base}.\n]<\/p>\n<p>Bold entries denote differences whose 95% confidence interval excludes zero.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> ZS-CoT vs. Base (95% CI)<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> SC-CoT vs. Base (95% CI)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>IVL3-14B<\/td>\n<td align=\"right\">-2.0 [-5.2, +1.5]<\/td>\n<td align=\"right\">+4.0 [-4.3, +9.6]<\/td>\n<\/tr>\n<tr>\n<td>IVL3-8B<\/td>\n<td align=\"right\">-1.0 [-4.0, +2.3]<\/td>\n<td align=\"right\">-1.0 [-5.1, +6.5]<\/td>\n<\/tr>\n<tr>\n<td>IVL3.5-14B<\/td>\n<td align=\"right\">+1.0 [-4.3, +5.4]<\/td>\n<td align=\"right\">+0.0 [-14.2, +9.1]<\/td>\n<\/tr>\n<tr>\n<td>IVL3.5-8B<\/td>\n<td align=\"right\"><strong>+7.0 [+4.3, +9.6]<\/strong><\/td>\n<td align=\"right\">+1.0 [-6.8, +6.3]<\/td>\n<\/tr>\n<tr>\n<td>QVL2.5-7B<\/td>\n<td align=\"right\">+1.0 [-3.9, +7.0]<\/td>\n<td align=\"right\">+2.0 [-13.8, +10.6]<\/td>\n<\/tr>\n<tr>\n<td>QVL2.5-32B<\/td>\n<td align=\"right\">+0.0 [-11.2, +8.7]<\/td>\n<td align=\"right\">-1.0 [-8.1, +4.2]<\/td>\n<\/tr>\n<tr>\n<td>QVL3-8B<\/td>\n<td align=\"right\">+0.0 [-9.0, +4.9]<\/td>\n<td align=\"right\">+0.0 [-12.4, +8.0]<\/td>\n<\/tr>\n<tr>\n<td>QVL3-32B<\/td>\n<td align=\"right\"><strong>-7.0 [-17.3, -1.4]<\/strong><\/td>\n<td align=\"right\"><strong>-11.0 [-15.3, -3.7]<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2 class=\"request\" id=\"r4-report-the-number-of-parent-queries-per-split\"><span class=\"request-meta\"><span class=\"request-num\">R4<\/span><\/span><span class=\"request-title\">Report the number of parent queries per split<\/span><\/h2>\n\n<h3>Parent-query counts<\/h3>\n<p>The Numerical Counting split contains <strong>57 parent queries in total<\/strong>, comprising <strong>39 synthetic parent queries<\/strong> and <strong>18 real parent queries<\/strong>.<\/p>\n<p>We will explicitly report the number of parent queries underlying each split so that the amount of independent support behind the corresponding question-level statistics is clear.<\/p>\n<h2 class=\"request\" id=\"r5-explain-how-the-answering-filter-shapes-the-human-baseline\"><span class=\"request-meta\"><span class=\"request-num\">R5<\/span><\/span><span class=\"request-title\">Explain how the answering filter shapes the human baseline<\/span><\/h2>\n\n<h3>Human baseline and question filtering<\/h3>\n<p>We would like to clarify an important distinction between the benchmark filtering process and the human baseline.<\/p>\n<p>During benchmark construction, <em>answerable<\/em> does not mean that an annotator found a question easy or answered it correctly. Candidate questions are discarded only when the queried attribute or object is not physically present, not clearly visible, or is ambiguous in the image. As stated in Sec. 3.3, annotators were explicitly instructed to discard questions only on these grounds rather than arbitrarily. This filtering is necessary to ensure that the answer is actually recoverable from the visual input.<\/p>\n<p><strong>Difficulty is not a filtering criterion.<\/strong> A question may therefore remain highly challenging because of dense same-category instances or a complex referring expression while still being visually answerable.<\/p>\n<p>The human baseline is a separate measurement performed after benchmark construction. As stated in the footnote on Page 7 and in the appendix, it was measured using seven participants who were not involved in annotating MIMO-Bench, each solving 30 groups for AB and 20 groups for NC. Humans and models are evaluated on the same retained questions.<\/p>\n<p>Thus, filtering establishes that the benchmark questions are visually answerable and unambiguous; it does not determine the human accuracy. The reported human–model gap is an independently measured performance gap on the same benchmark.<\/p>\n<h2 class=\"request\" id=\"r6-extend-the-zoom-study-to-at-least-one-strong-model\"><span class=\"request-meta\"><span class=\"request-num\">R6<\/span><\/span><span class=\"request-title\">Extend the zoom study to at least one strong model<\/span><\/h2>\n\n<h3>Extension of the zooming analysis<\/h3>\n<p>We have also extended the relevant-region extraction (zooming) analysis to <strong>Qwen3-VL-32B<\/strong>, addressing the limitation that the original Table 5 contained only models of 14B parameters or smaller.<\/p>\n<p>The new localization-quality analysis includes Qwen3-VL-32B alongside the original models. For Qwen3-VL-32B, the full-image baseline is <strong>47.5%<\/strong>, while final-answer accuracy across predicted-crop IoU bins is <strong>41.2%, 45.5%, 49.0%, and 52.9%<\/strong> for IoU ranges 0–25%, 25–50%, 50–75%, and 75–100%, respectively. Its externally supplied MIMO-Crop512 result is <strong>48.9%<\/strong>.<\/p>\n<p>These results also support the broader observation from our new diagnostic analysis that successful localization is associated with improved downstream performance: for Qwen3-VL-32B, the highest-IoU predicted regions reach 52.9%, compared with the 47.5% full-image baseline.<\/p>\n","counts":{"critical":0,"total":6}},{"id":"03","title":"Reviewer z6WX — Synthetic Gap, Region Extraction, Localization, and Related Work","nav":"Reviewer z6WX","toc":[{"id":"r1-explain-the-gemini-3x-synthetic-ab-anomaly-and-establish-the","num":"R1","tag":null,"kind":null,"title":"Explain the Gemini-3.x synthetic-AB anomaly and establish the reliability of count-conditioned results"},{"id":"r2-separate-localization-quality-from-crop-resolution-effects-a","num":"R2","tag":null,"kind":null,"title":"Separate localization quality from crop-resolution effects and test significance on the 800-sample subset"},{"id":"r3-explain-why-the-localize-and-reason-task-was-dropped-and-out","num":"R3","tag":null,"kind":null,"title":"Explain why the localize-and-reason task was dropped and outline it as a future direction"},{"id":"r4-discuss-connections-to-internal-grounding-and-visual-attenti","num":"R4","tag":null,"kind":null,"title":"Discuss connections to internal grounding and visual-attention mechanisms in LVLMs"}],"html":"<h2 class=\"request\" id=\"r1-explain-the-gemini-3x-synthetic-ab-anomaly-and-establish-the\"><span class=\"request-meta\"><span class=\"request-num\">R1<\/span><\/span><span class=\"request-title\">Explain the Gemini-3.x synthetic-AB anomaly and establish the reliability of count-conditioned results<\/span><\/h2>\n\n<h3>Gemini-3.x synthetic–real gap and counting reliability<\/h3>\n<p>We thank the reviewer for pointing out the unusually large synthetic–real gap for Gemini-3.x. The synthetic images in MIMO-Bench were generated using <strong>Gemini-2.5-Pro<\/strong>, and our existing self-preference analysis evaluates the generating model against contemporaneous non-Gemini models on the synthetic split. G2.5-Pro obtains 47.7 AB <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">I<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{I}_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span> there, against 49.7 for GPT-5-medium, 47.9 for Q3-32B-Instruct and 45.1 for IVL3.5-241B-A28B; the generator is therefore mid-pack on its own images rather than uniquely advantaged.<\/p>\n<p>The unusually large synthetic gain is instead observed for <strong>Gemini-3.x<\/strong>, which consists of different models accessed through different API endpoints. We therefore do not interpret the current result as evidence of direct self-preference by the model that generated the images.<\/p>\n<p>At the same time, our current experiments do not allow us to determine why Gemini-3.x performance is so strongly skewed toward the synthetic split. We therefore treat this as an <strong>observed anomaly<\/strong>, rather than attributing it either to genuine capability or to a generator-specific effect. We will make this limitation explicit in the revised manuscript and clarify that the available self-preference control applies specifically to Gemini-2.5-Pro, the model used to generate the synthetic images.<\/p>\n<p><strong>[To be added: per-ground-truth sample frequencies for the numerical-counting analysis and the corresponding uncertainty/reliability discussion.]<\/strong><\/p>\n<hr>\n<h2 class=\"request\" id=\"r2-separate-localization-quality-from-crop-resolution-effects-a\"><span class=\"request-meta\"><span class=\"request-num\">R2<\/span><\/span><span class=\"request-title\">Separate localization quality from crop-resolution effects and test significance on the 800-sample subset<\/span><\/h2>\n\n<h3>Relevant-region extraction: localization quality and cropping controls<\/h3>\n<p>The aim of the relevant-region extraction experiment was primarily to test whether even a deliberately naive mechanism for adaptively narrowing the visual input can improve performance in the MIMO setting. We agree, however, that the original presentation did not sufficiently distinguish better localization from the other changes introduced by cropping, such as target enlargement, distractor reduction, and an additional inference call.<\/p>\n<p>To characterize this more directly, we analyze all valid regions produced by the relevant-region extraction procedure. Across <strong>23,109 predicted crops<\/strong>, the mean crop size is approximately <strong>459 × 479 pixels<\/strong> (232,227 px²), corresponding to <strong>12.43%<\/strong> of the original image area.<\/p>\n<p>We further compute the IoU between each model-proposed crop and the ground-truth target box and condition final-answer accuracy on this localization quality. We also compare against <strong>MIMO-Crop512<\/strong>, in which a relevant local crop is constructed externally from the benchmark annotations rather than being proposed by the evaluated MLLM.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Model<\/strong><\/th>\n<th align=\"right\"><strong>Base<\/strong><\/th>\n<th align=\"right\"><strong>0–25<\/strong><\/th>\n<th align=\"right\"><strong>25–50<\/strong><\/th>\n<th align=\"right\"><strong>50–75<\/strong><\/th>\n<th align=\"right\"><strong>75–100<\/strong><\/th>\n<th align=\"right\"><strong>MIMO-Crop512<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>InternVL3-14B<\/td>\n<td align=\"right\">37.2<\/td>\n<td align=\"right\">48.8<\/td>\n<td align=\"right\">51.6<\/td>\n<td align=\"right\">56.5<\/td>\n<td align=\"right\">52.0<\/td>\n<td align=\"right\">50.7<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td align=\"right\">35.9<\/td>\n<td align=\"right\">35.4<\/td>\n<td align=\"right\">44.9<\/td>\n<td align=\"right\">51.5<\/td>\n<td align=\"right\">51.0<\/td>\n<td align=\"right\">46.8<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td align=\"right\">40.5<\/td>\n<td align=\"right\">37.2<\/td>\n<td align=\"right\">42.7<\/td>\n<td align=\"right\">36.4<\/td>\n<td align=\"right\">45.8<\/td>\n<td align=\"right\">50.7<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-32B<\/td>\n<td align=\"right\">47.5<\/td>\n<td align=\"right\">41.2<\/td>\n<td align=\"right\">45.5<\/td>\n<td align=\"right\">49.0<\/td>\n<td align=\"right\">52.9<\/td>\n<td align=\"right\">48.9<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-8B<\/td>\n<td align=\"right\">40.3<\/td>\n<td align=\"right\">39.3<\/td>\n<td align=\"right\">45.5<\/td>\n<td align=\"right\">39.0<\/td>\n<td align=\"right\">50.8<\/td>\n<td align=\"right\">44.4<\/td>\n<\/tr>\n<tr>\n<td>Qwen2.5-VL-7B<\/td>\n<td align=\"right\">35.8<\/td>\n<td align=\"right\">29.7<\/td>\n<td align=\"right\">40.5<\/td>\n<td align=\"right\">28.6<\/td>\n<td align=\"right\">39.2<\/td>\n<td align=\"right\">47.6<\/td>\n<\/tr>\n<tr>\n<td><strong>Mean<\/strong><\/td>\n<td align=\"right\"><strong>39.5<\/strong><\/td>\n<td align=\"right\"><strong>38.6<\/strong><\/td>\n<td align=\"right\"><strong>45.1<\/strong><\/td>\n<td align=\"right\"><strong>43.5<\/strong><\/td>\n<td align=\"right\"><strong>48.6<\/strong><\/td>\n<td align=\"right\"><strong>48.2<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><em>Final-answer accuracy conditioned on predicted-crop IoU with the ground-truth target box, together with the full-image baseline and the externally constructed MIMO-Crop512 condition.<\/em><\/p>\n<p>Very poorly localized predicted crops (0–25% IoU) obtain <strong>38.6%<\/strong> mean accuracy, at or slightly below the <strong>39.5%<\/strong> full-image baseline, despite still receiving the additional inference call and crop/re-query operation. In contrast, highly overlapping model-selected crops (75–100% IoU) reach <strong>48.6%<\/strong>, closely matching the <strong>48.2%<\/strong> accuracy obtained with MIMO-Crop512.<\/p>\n<p>The relationship is not strictly monotonic at intermediate IoUs because the useful region for a compositional referring expression can extend beyond the target box itself and include referenced neighboring objects. We therefore treat IoU as a localization-quality proxy rather than a complete measure of crop usefulness.<\/p>\n<p>These results do not isolate localization, rescaling, distractor reduction, and the additional inference call as independent causal factors. Rather, they support the more limited proof-of-concept conclusion that when the model succeeds in selecting a target-relevant region, downstream performance approaches that obtained when a relevant crop is externally supplied.<\/p>\n<p>We will revise the manuscript accordingly. We do not present the current method as a complete iterative visual-search mechanism: the paper introduces it as a <strong>small exploratory study<\/strong>, calls it <strong>naive relevant-region extraction<\/strong>, and describes it as <strong>naive single-pass narrowing<\/strong>. Here, “dynamic visual access” refers only to the fact that the visual input used for the final answer is determined by the model&#39;s preceding inference, rather than being a single fixed visual input.<\/p>\n<h4>Fixed and random crops, and a two-pass control.<\/h4>\n<p>To further separate model-driven region selection from generic cropping, rescaling, and the additional inference call, we evaluate fixed and random 512/1024 crops and a two-pass no-crop control on the same 200 examples across six models. Fixed crops use the same centered window for every image, whereas random crops place a reproducibly sampled window of the same size independently of the model.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Control<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> vs. Base<\/th>\n<th align=\"right\">Target visible<\/th>\n<th align=\"right\">Target absent<\/th>\n<th align=\"right\">Visibility <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Fixed 1024<\/td>\n<td align=\"right\">+1.0<\/td>\n<td align=\"right\">49.7<\/td>\n<td align=\"right\">34.1<\/td>\n<td align=\"right\"><strong>+15.6<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Random 1024<\/td>\n<td align=\"right\">+0.8<\/td>\n<td align=\"right\">53.5<\/td>\n<td align=\"right\">31.9<\/td>\n<td align=\"right\"><strong>+21.6<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Fixed 512<\/td>\n<td align=\"right\">-5.3<\/td>\n<td align=\"right\">58.3<\/td>\n<td align=\"right\">33.2<\/td>\n<td align=\"right\"><strong>+25.1<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Random 512<\/td>\n<td align=\"right\">-8.7<\/td>\n<td align=\"right\">49.0<\/td>\n<td align=\"right\">31.3<\/td>\n<td align=\"right\"><strong>+17.7<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>At 1024 resolution, fixed and random cropping is essentially unchanged from the full-image baseline, while the smaller 512 crops reduce accuracy because they much more frequently remove the queried target. Conditioning on target visibility makes the effect clearer: accuracy is higher when the target remains visible in all four crop conditions, with pooled differences of 15.6--25.1 points; the direction is positive for all 24 model-by-condition comparisons. When the target is absent, accuracy falls to approximately 31--34%, close to the benchmark majority-answer baseline.<\/p>\n<p>We additionally test whether the additional inference call itself explains the gain. In this control the two-turn procedure is kept exactly as in relevant-region extraction: the first turn still asks the model, in text, for a plausible region containing the target, and the second turn passes the model its own predicted region together with the <strong>unmodified<\/strong> image rather than the crop. The region-proposal turn and the extra inference call are therefore held constant, and only the change of visual input is removed.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Qwen2.5-VL-7B<\/td>\n<td align=\"right\">+1.0<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-8B<\/td>\n<td align=\"right\">+1.5<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td align=\"right\">+2.0<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td align=\"right\">+1.1<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-14B<\/td>\n<td align=\"right\">-1.5<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-14B<\/td>\n<td align=\"right\">+3.5<\/td>\n<\/tr>\n<tr>\n<td><strong>Mean<\/strong><\/td>\n<td align=\"right\"><strong>+1.3<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The two-pass no-crop control therefore yields only a small mean improvement of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>+<\/mo><mn>1.3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">+1.3<\/annotation><\/semantics><\/math><\/span> points, and no model gains more than <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>+<\/mo><mn>3.5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">+3.5<\/annotation><\/semantics><\/math><\/span>. Together with the MIMO-Crop and predicted-region IoU analyses above, these controls indicate that generic cropping/rescaling or simply querying the model twice does not explain the relevant-region gains. The benefit is associated with successfully retaining target-relevant visual information, rather than with cropping or an additional inference call alone.<\/p>\n<p>The 512-versus-1024 comparison directly addresses the resolution question:\nthe resolution change introduced by cropping does not by itself produce the\nobserved gains, since non-model-driven crops at either resolution leave mean\naccuracy at or below the full-image baseline.<\/p>\n<h4>Uncertainty for the 800-sample subset analyses<\/h4>\n<p>We additionally report uncertainty for the intervention and prompting experiments performed on the 800-sample MIMO-Bench subset. Because the compared conditions are evaluated on matched examples, we report the <strong>paired change<\/strong> between conditions together with its <strong>95% confidence interval<\/strong>, preserving the same-example pairing in the resampling procedure.<\/p>\n<h5>Visual prompting<\/h5>\n<p>For visual prompting, we evaluate<\/p>\n<h1>[\n\\Delta_{\\mathrm{VP}}<\/h1>\n<h2>\\mathrm{IACC}_{\\mathrm{with\\ visual\\ prompting}}<\/h2>\n<p>\\mathrm{IACC}_{\\mathrm{without\\ visual\\ prompting}}.\n]<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> IACC<\/th>\n<th align=\"right\">95% CI of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Qwen3-VL-8B-Instruct<\/td>\n<td align=\"right\"><strong>+25.5<\/strong><\/td>\n<td align=\"right\">[19.84, 31.59]<\/td>\n<\/tr>\n<tr>\n<td>GLM-4.5V<\/td>\n<td align=\"right\"><strong>+18.5<\/strong><\/td>\n<td align=\"right\">[13.42, 23.96]<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-32B-Instruct<\/td>\n<td align=\"right\"><strong>+18.0<\/strong><\/td>\n<td align=\"right\">[13.85, 22.12]<\/td>\n<\/tr>\n<tr>\n<td>Qwen2.5-VL-32B-Instruct<\/td>\n<td align=\"right\"><strong>+22.5<\/strong><\/td>\n<td align=\"right\">[18.11, 26.98]<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-30B-A3B-Instruct<\/td>\n<td align=\"right\"><strong>+24.0<\/strong><\/td>\n<td align=\"right\">[16.20, 29.15]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-38B<\/td>\n<td align=\"right\"><strong>+10.8<\/strong><\/td>\n<td align=\"right\">[6.95, 14.97]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-38B<\/td>\n<td align=\"right\"><strong>+12.4<\/strong><\/td>\n<td align=\"right\">[8.04, 17.17]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-14B<\/td>\n<td align=\"right\"><strong>+13.2<\/strong><\/td>\n<td align=\"right\">[9.81, 17.01]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-14B<\/td>\n<td align=\"right\"><strong>+11.2<\/strong><\/td>\n<td align=\"right\">[7.09, 15.44]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td align=\"right\"><strong>+8.6<\/strong><\/td>\n<td align=\"right\">[5.29, 12.37]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td align=\"right\"><strong>+6.0<\/strong><\/td>\n<td align=\"right\">[3.87, 8.48]<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The paired 95% confidence interval excludes zero for all eleven evaluated models. Thus, although the magnitude of the gain varies substantially across models, the positive change under visual prompting is consistently observed across the evaluated models.<\/p>\n<h5>Thinking/reasoning<\/h5>\n<p>For the thinking/reasoning comparison, we similarly report paired changes between the Thinking and Instruct variants for Qwen models, and between High- and Low-reasoning-effort settings for Gemini models.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Model<\/strong><\/th>\n<th align=\"right\"><strong>Δ IACC (95% CI)<\/strong><\/th>\n<th align=\"right\"><strong>Δ GACC (95% CI)<\/strong><\/th>\n<th align=\"right\"><strong>Δ IMRA (95% CI)<\/strong><\/th>\n<th align=\"right\"><strong>Δ LMRA (95% CI)<\/strong><\/th>\n<th align=\"right\"><strong>Δ GMRA (95% CI)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Qwen3-VL-8B<\/td>\n<td align=\"right\"><strong>+5.2 [+0.8, +9.9]<\/strong><\/td>\n<td align=\"right\">+4.7 [-2.7, +12.1]<\/td>\n<td align=\"right\">+3.4 [-6.0, +13.5]<\/td>\n<td align=\"right\"><strong>+22.3 [+11.2, +36.2]<\/strong><\/td>\n<td align=\"right\">+5.9 [-4.4, +15.3]<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-30B-A3B<\/td>\n<td align=\"right\">+1.8 [-0.9, +4.4]<\/td>\n<td align=\"right\"><strong>+5.0 [+1.9, +7.6]<\/strong><\/td>\n<td align=\"right\">—<\/td>\n<td align=\"right\">—<\/td>\n<td align=\"right\">—<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-32B<\/td>\n<td align=\"right\">-0.1 [-4.4, +7.4]<\/td>\n<td align=\"right\">-2.5 [-9.5, +10.5]<\/td>\n<td align=\"right\">+2.5 [-8.9, +11.9]<\/td>\n<td align=\"right\">+2.8 [-10.4, +14.3]<\/td>\n<td align=\"right\">-6.2 [-23.1, +7.6]<\/td>\n<\/tr>\n<tr>\n<td>Gemini-3.1-Pro-Preview<\/td>\n<td align=\"right\">-0.6 [-2.5, +1.1]<\/td>\n<td align=\"right\">+0.1 [-2.4, +2.4]<\/td>\n<td align=\"right\">-4.8 [-8.6, +1.3]<\/td>\n<td align=\"right\">-5.9 [-12.4, +4.1]<\/td>\n<td align=\"right\">+1.2 [-10.7, +11.9]<\/td>\n<\/tr>\n<tr>\n<td>Gemini-3.5-Flash<\/td>\n<td align=\"right\"><strong>+3.6 [+0.6, +5.7]<\/strong><\/td>\n<td align=\"right\">-1.9 [-4.8, +0.4]<\/td>\n<td align=\"right\"><strong>+6.4 [+3.2, +10.6]<\/strong><\/td>\n<td align=\"right\"><strong>+13.3 [+9.3, +18.0]<\/strong><\/td>\n<td align=\"right\"><strong>+5.0 [+0.4, +12.3]<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Bold entries denote differences whose 95% confidence interval excludes zero. These intervals reinforce the manuscript&#39;s interpretation that test-time reasoning does not uniformly improve MIMO performance. Several nominal changes have intervals that include zero, while clear improvements occur only for particular model–metric combinations.<\/p>\n<h5>Chain-of-Thought prompting<\/h5>\n<p>For Chain-of-Thought prompting, we report the paired changes relative to the same Base condition,<\/p>\n<h1>[\n\\Delta_{\\mathrm{ZS-CoT}}<\/h1>\n<h2>\\mathrm{ZS\\mbox{-}CoT}<\/h2>\n<p>\\mathrm{Base},\n]<\/p>\n<p>and<\/p>\n<h1>[\n\\Delta_{\\mathrm{SC-CoT}}<\/h1>\n<h2>\\mathrm{SC\\mbox{-}CoT}<\/h2>\n<p>\\mathrm{Base}.\n]<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Model<\/strong><\/th>\n<th align=\"right\"><strong>Δ ZS-CoT vs. Base (95% CI)<\/strong><\/th>\n<th align=\"right\"><strong>Δ SC-CoT vs. Base (95% CI)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>IVL3-14B<\/td>\n<td align=\"right\">-2.0 [-5.2, +1.5]<\/td>\n<td align=\"right\">+4.0 [-4.3, +9.6]<\/td>\n<\/tr>\n<tr>\n<td>IVL3-8B<\/td>\n<td align=\"right\">-1.0 [-4.0, +2.3]<\/td>\n<td align=\"right\">-1.0 [-5.1, +6.5]<\/td>\n<\/tr>\n<tr>\n<td>IVL3.5-14B<\/td>\n<td align=\"right\">+1.0 [-4.3, +5.4]<\/td>\n<td align=\"right\">+0.0 [-14.2, +9.1]<\/td>\n<\/tr>\n<tr>\n<td>IVL3.5-8B<\/td>\n<td align=\"right\"><strong>+7.0 [+4.3, +9.6]<\/strong><\/td>\n<td align=\"right\">+1.0 [-6.8, +6.3]<\/td>\n<\/tr>\n<tr>\n<td>QVL2.5-7B<\/td>\n<td align=\"right\">+1.0 [-3.9, +7.0]<\/td>\n<td align=\"right\">+2.0 [-13.8, +10.6]<\/td>\n<\/tr>\n<tr>\n<td>QVL2.5-32B<\/td>\n<td align=\"right\">+0.0 [-11.2, +8.7]<\/td>\n<td align=\"right\">-1.0 [-8.1, +4.2]<\/td>\n<\/tr>\n<tr>\n<td>QVL3-8B<\/td>\n<td align=\"right\">+0.0 [-9.0, +4.9]<\/td>\n<td align=\"right\">+0.0 [-12.4, +8.0]<\/td>\n<\/tr>\n<tr>\n<td>QVL3-32B<\/td>\n<td align=\"right\"><strong>-7.0 [-17.3, -1.4]<\/strong><\/td>\n<td align=\"right\"><strong>-11.0 [-15.3, -3.7]<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The uncertainty analysis strengthens our original conclusion that CoT does not reliably improve MIMO performance. Most paired differences have 95% confidence intervals that include zero. The only clear positive effect is ZS-CoT for IVL3.5-8B, while QVL3-32B shows a clear degradation under both ZS-CoT and SC-CoT. Thus, neither Zero-Shot nor Self-Consistency CoT provides a consistent improvement across the evaluated models.<\/p>\n<p>We will add these uncertainty estimates to the revised manuscript so that the conclusions drawn from the smaller subset analyses are accompanied by their corresponding statistical uncertainty.<\/p>\n<hr>\n<h2 class=\"request\" id=\"r3-explain-why-the-localize-and-reason-task-was-dropped-and-out\"><span class=\"request-meta\"><span class=\"request-num\">R3<\/span><\/span><span class=\"request-title\">Explain why the localize-and-reason task was dropped and outline it as a future direction<\/span><\/h2>\n\n<h3>Why the localize-and-reason task was not retained<\/h3>\n<p>We had initially explored a separate localize-and-reason formulation, but did not retain it as a benchmark task because we could not identify a localization interface that provided both a reliable and neutral intermediate evaluation.<\/p>\n<p>Coordinate prediction preserves the original visual input, but introduces an additional requirement for precise spatial-coordinate generation. In our new grounding evaluation, coordinate-based localization is substantially weaker than candidate-based grounding, suggesting that the resulting score reflects not only referring-expression understanding but also the model&#39;s ability to express that localization through precise coordinates.<\/p>\n<p>Candidate-box localization provides a much cleaner discrete decision, but requires adding candidate markers to the image, thereby modifying the original visual input and changing the task itself.<\/p>\n<p>Our new grounding analysis makes this dependence on the localization interface explicit. Measured grounding accuracy differs substantially between the two formulations, preventing us from treating either one as a format-independent numerical estimate of the model&#39;s underlying grounding ability.<\/p>\n<p>This was the primary reason for not making localization a mandatory intermediate stage of MIMO-Bench. Attribute Binding has a naturally defined answer format, whereas a localization readout necessarily introduces an additional interface choice. We agree that developing more reliable grounding readouts and localize-and-reason formulations is an important future direction, and we will clarify this motivation in the revised manuscript.<\/p>\n<hr>\n<h2 class=\"request\" id=\"r4-discuss-connections-to-internal-grounding-and-visual-attenti\"><span class=\"request-meta\"><span class=\"request-num\">R4<\/span><\/span><span class=\"request-title\">Discuss connections to internal grounding and visual-attention mechanisms in LVLMs<\/span><\/h2>\n\n<h3>Connection to internal attention and grounding mechanisms.<\/h3>\n<p>We thank the reviewer for highlighting this relevant line of work. We agree that our visual-prompting results connect naturally to recent studies investigating the internal vision--language mechanisms underlying visual grounding and hallucination. Our experiments approach the problem from a complementary, behavioral perspective: rather than inspecting or modifying internal attention/neuron dynamics, we intervene on the model&#39;s visual input by explicitly marking the target or restricting the relevant region, and measure the resulting change in MIMO performance. The consistent gains under these interventions suggest that improving target selection/grounding is an important direction, while our experiments do not identify the particular internal mechanism responsible for these gains. We will add the suggested works to the Related Work/Discussion and explicitly position internal attention analysis and attention-guided intervention as a promising direction for studying why MLLMs fail under dense same-category distractors.<\/p>\n","counts":{"critical":0,"total":4}},{"id":"04","title":"Reviewer MJZs — Benchmark Positioning, Grounding, Controls, and Dataset Statistics","nav":"Reviewer MJZs","toc":[{"id":"r1-strengthen-the-related-work-discussion-and-benchmark-positio","num":"R1","tag":null,"kind":null,"title":"Strengthen the related-work discussion and benchmark positioning"},{"id":"r2-provide-stronger-evidence-for-the-limitations-of-existing-be","num":"R2","tag":null,"kind":null,"title":"Provide stronger evidence for the limitations of existing benchmarks"},{"id":"r3-distinguish-grounding-failures-from-attribute-binding-failur","num":"R3","tag":null,"kind":null,"title":"Distinguish grounding failures from attribute-binding failures more clearly"},{"id":"r4-strengthen-controls-for-the-diagnostic-experiments-or-weaken","num":"R4","tag":null,"kind":null,"title":"Strengthen controls for the diagnostic experiments or weaken the corresponding claims"},{"id":"r5-report-basic-dataset-statistics","num":"R5","tag":null,"kind":null,"title":"Report basic dataset statistics"}],"html":"<h2 class=\"request\" id=\"r1-strengthen-the-related-work-discussion-and-benchmark-positio\"><span class=\"request-meta\"><span class=\"request-num\">R1<\/span><\/span><span class=\"request-title\">Strengthen the related-work discussion and benchmark positioning<\/span><\/h2>\n\n<h3>Relation to referring-expression and grounding tasks.<\/h3>\n<p>We thank the reviewer for highlighting this missing connection. We have expanded the related-work discussion to cover Referring Expression Comprehension (REC), phrase grounding, referring segmentation, Described Object Detection (DOD), and Referring Expression Instance Retrieval (REIR). We agree that fine-grained referring expressions, relational descriptions, and disambiguation among visually similar candidates are not unique to MIMO-Bench.<\/p>\n<p>The distinction lies primarily in <em>what is evaluated<\/em>. REC evaluates localization of a referred instance; phrase grounding evaluates phrase–region correspondence; referring segmentation predicts the referred region at pixel level; DOD predicts all objects satisfying a description, including zero- and multi-instance cases; and REIR extends referring expressions to retrieval and localization across an image gallery. MIMO-Bench instead evaluates two visual-reasoning tasks---attribute binding and numerical counting---under the MIMO setting. In attribute binding, a referring expression specifies the instance about which a separate attribute is queried. In numerical counting, it specifies the group whose cardinality must be estimated. Thus, referring expressions are part of the problem formulation, while localization, segmentation, detection, or retrieval are not the benchmark outputs. MIMO-Bench further treats dense repeated-instance structure across object categories as the scene regime in which these reasoning tasks are evaluated. This positioning is summarized below.<\/p>\n<p><strong>Positioning MIMO-Bench relative to referring-expression and grounding tasks.<\/strong><\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Task<\/strong><\/th>\n<th><strong>Loc.<\/strong><\/th>\n<th><strong>Multi-target<\/strong><\/th>\n<th><strong>MIMO<\/strong><\/th>\n<th><strong>AB<\/strong><\/th>\n<th><strong>NC<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>REC<\/td>\n<td>✓<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<\/tr>\n<tr>\n<td>Phrase Grounding<\/td>\n<td>✓<\/td>\n<td>✓<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<\/tr>\n<tr>\n<td>Ref. Segmentation<\/td>\n<td>✓<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<\/tr>\n<tr>\n<td>DOD<\/td>\n<td>✓<\/td>\n<td>✓<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<\/tr>\n<tr>\n<td>REIR<\/td>\n<td>✓<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<\/tr>\n<tr>\n<td><strong>MIMO-Bench<\/strong><\/td>\n<td>×<\/td>\n<td>✓<\/td>\n<td>✓<\/td>\n<td>✓<\/td>\n<td>✓<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Positioning MIMO-Bench.<\/strong> Distractor count reports the mean number of SAM3-based distractor instances per target prompt.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Lineage<\/strong><\/th>\n<th><strong>Benchmark(s)<\/strong><\/th>\n<th><strong>Real/Syn<\/strong><\/th>\n<th><strong>Template<\/strong><\/th>\n<th><strong>Comp. REs<\/strong><\/th>\n<th><strong>Image Res.<\/strong><\/th>\n<th><strong>Distractor<\/strong><\/th>\n<th align=\"right\"><strong>Mean Distractors<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Compositional<\/td>\n<td>CLEVR<\/td>\n<td>×/✓<\/td>\n<td>✓<\/td>\n<td>✓<\/td>\n<td>×/✓<\/td>\n<td>×<\/td>\n<td align=\"right\">--<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>GQA<\/td>\n<td>✓/×<\/td>\n<td>✓<\/td>\n<td>✓<\/td>\n<td>×/✓<\/td>\n<td>×<\/td>\n<td align=\"right\">1.67<\/td>\n<\/tr>\n<tr>\n<td>Vision-centric (general)<\/td>\n<td>MMStar, NaturalBench, VQAv2<\/td>\n<td>✓/×<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>×/✓<\/td>\n<td>×<\/td>\n<td align=\"right\">2.49 / -- / 1.46<\/td>\n<\/tr>\n<tr>\n<td>Visual difficulty<\/td>\n<td>V*Bench<\/td>\n<td>✓/×<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>✓/×<\/td>\n<td>~<\/td>\n<td align=\"right\">0.12<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>HR-Bench, MME-RealWorld<\/td>\n<td>✓/×<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>✓/×<\/td>\n<td>~<\/td>\n<td align=\"right\">2.01 / 6.54<\/td>\n<\/tr>\n<tr>\n<td><strong>Ours<\/strong><\/td>\n<td><strong>MIMO-Bench<\/strong><\/td>\n<td>✓/✓<\/td>\n<td>✓<\/td>\n<td>✓<\/td>\n<td>✓/✓<\/td>\n<td>✓<\/td>\n<td align=\"right\"><strong>47.7<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2 class=\"request\" id=\"r2-provide-stronger-evidence-for-the-limitations-of-existing-be\"><span class=\"request-meta\"><span class=\"request-num\">R2<\/span><\/span><span class=\"request-title\">Provide stronger evidence for the limitations of existing benchmarks<\/span><\/h2>\n\n<p>We thank the reviewer for asking for direct quantitative evidence rather than an\nillustrative comparison. We compare MIMO-Bench against existing benchmarks along\ntwo measurable axes: same-category distractor density, and the compositional\nstructure of the referring expressions.<\/p>\n<p><strong>Same-category distractor density.<\/strong> The positioning table above reports the\nmean number of SAM3-based distractor instances per target prompt. MIMO-Bench\naverages <strong>47.7<\/strong> same-category distractors per target, against <strong>0.12--6.54<\/strong>\nfor every other benchmark considered. Dense same-category structure is therefore\nnot simply more frequent in MIMO-Bench; it is present at a different order of\nmagnitude.<\/p>\n<p><strong>Compositional structure of referring expressions.<\/strong> We parse each referring\nexpression with the same benchmark-agnostic schema used for MIMO-Bench and\ndecompose it into attribute/action bindings (CAO), inter-object relations, and\nplain objects; the number of visual subtasks is their sum.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Benchmark<\/strong><\/th>\n<th align=\"right\"><strong>Objects<\/strong><\/th>\n<th align=\"right\"><strong>CAO<\/strong><\/th>\n<th align=\"right\"><strong>Relations<\/strong><\/th>\n<th align=\"right\"><strong># Subtasks<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>CLEVR<\/td>\n<td align=\"right\">2.50<\/td>\n<td align=\"right\">3.50<\/td>\n<td align=\"right\">1.20<\/td>\n<td align=\"right\">7.20<\/td>\n<\/tr>\n<tr>\n<td>GQA<\/td>\n<td align=\"right\">2.24<\/td>\n<td align=\"right\">0.42<\/td>\n<td align=\"right\">0.43<\/td>\n<td align=\"right\">3.10<\/td>\n<\/tr>\n<tr>\n<td>MMStar<\/td>\n<td align=\"right\">3.36<\/td>\n<td align=\"right\">0.08<\/td>\n<td align=\"right\">0.46<\/td>\n<td align=\"right\">3.90<\/td>\n<\/tr>\n<tr>\n<td>NaturalBench<\/td>\n<td align=\"right\">1.87<\/td>\n<td align=\"right\">0.53<\/td>\n<td align=\"right\">0.30<\/td>\n<td align=\"right\">2.70<\/td>\n<\/tr>\n<tr>\n<td>VQAv2<\/td>\n<td align=\"right\">1.76<\/td>\n<td align=\"right\">0.35<\/td>\n<td align=\"right\">0.49<\/td>\n<td align=\"right\">2.60<\/td>\n<\/tr>\n<tr>\n<td>V*Bench<\/td>\n<td align=\"right\">1.92<\/td>\n<td align=\"right\">0.07<\/td>\n<td align=\"right\">0.40<\/td>\n<td align=\"right\">2.40<\/td>\n<\/tr>\n<tr>\n<td>HR-Bench<\/td>\n<td align=\"right\">2.92<\/td>\n<td align=\"right\">0.44<\/td>\n<td align=\"right\">1.34<\/td>\n<td align=\"right\">4.70<\/td>\n<\/tr>\n<tr>\n<td>MME-RealWorld<\/td>\n<td align=\"right\">2.70<\/td>\n<td align=\"right\">0.25<\/td>\n<td align=\"right\">0.95<\/td>\n<td align=\"right\">3.90<\/td>\n<\/tr>\n<tr>\n<td><strong>MIMO-Bench<\/strong><\/td>\n<td align=\"right\"><strong>4.01<\/strong><\/td>\n<td align=\"right\"><strong>2.33<\/strong><\/td>\n<td align=\"right\"><strong>3.23<\/strong><\/td>\n<td align=\"right\"><strong>9.56<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><em>Mean per-expression decomposition under a common parsing schema. Totals\ncorrespond to the mean subtask counts reported in Table 1 of the main paper.<\/em><\/p>\n<p>The decomposition localizes where the difference lies. MIMO-Bench references the\nlargest number of objects per expression (4.01 against 3.36 for the next\nhighest), but object count alone is not what separates it: several benchmarks\nreach comparable values. Attribute/action binding is also not unique to\nMIMO-Bench, and indeed CLEVR is higher on this axis (3.50 against 2.33),\nreflecting its synthetic, attribute-exhaustive construction.<\/p>\n<p>The axis on which MIMO-Bench separates decisively is <strong>cross-object relational\nstructure<\/strong>. MIMO-Bench expressions contain <strong>3.23<\/strong> inter-object relations on\naverage, against a maximum of <strong>1.34<\/strong> across all other benchmarks, a factor of\n<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2.4<\/mn><mo>×<\/mo><\/mrow><annotation encoding=\"application/x-tex\">2.4\\times<\/annotation><\/semantics><\/math><\/span> over the next highest and more than <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2.7<\/mn><mo>×<\/mo><\/mrow><annotation encoding=\"application/x-tex\">2.7\\times<\/annotation><\/semantics><\/math><\/span> the mean of the\nremaining benchmarks. This is precisely the property the reviewer identifies:\nresolving a MIMO-Bench referring expression requires reasoning over relations\n<em>between<\/em> multiple objects rather than recognizing attributes of a single\nreferent in isolation.<\/p>\n<p>Taken together, the two axes support the motivation the reviewer asked us to\nsubstantiate. Existing benchmarks are not merely lower on a single difficulty\nscale; they occupy a different regime, with roughly an order of magnitude fewer\nsame-category distractors and a fraction of the cross-object relational\ncomposition. This also clarifies the distinction from REC-style evaluation\nraised in R1: the additional difficulty in MIMO-Bench comes from relational\ndisambiguation among dense same-category instances, not from expression length\nalone.<\/p>\n<h2 class=\"request\" id=\"r3-distinguish-grounding-failures-from-attribute-binding-failur\"><span class=\"request-meta\"><span class=\"request-num\">R3<\/span><\/span><span class=\"request-title\">Distinguish grounding failures from attribute-binding failures more clearly<\/span><\/h2>\n\n<h3>Separating grounding from Attribute Binding.<\/h3>\n<p>We agree with the reviewer that the original submission relied too strongly on final AB accuracy and visual prompting to distinguish failures in RE grounding from failures after the target has been identified. In the revision, we add an explicit grounding evaluation on the same examples and directly relate grounding success to the corresponding AB answer.<\/p>\n<p><strong>Two explicit grounding formulations.<\/strong><\/p>\n<p>A practical difficulty is that, unlike AB---which has a fixed multiple-choice output in MIMO-Bench---localization has no unique evaluation interface that is neutral with respect to the original task. We therefore evaluate two complementary formulations over the full evaluation set.<\/p>\n<p>In the first, <em>box-choice grounding<\/em>, four candidate instances are marked and the model selects the candidate described by the original RE. This gives a well-defined discrete localization decision, but the candidate boxes modify the visual input. In the second, <em>coordinate grounding<\/em>, the original image is left unchanged and the model predicts the target coordinates from the RE. This avoids visual overlays, but additionally requires spatial-coordinate generation.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Model<\/strong><\/th>\n<th><strong>Grounding<\/strong><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi mathvariant=\"bold\">G<\/mi><mo>+<\/mo><\/msup><msup><mi mathvariant=\"bold\">A<\/mi><mo>+<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{G^+A^+}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi mathvariant=\"bold\">G<\/mi><mo>+<\/mo><\/msup><msup><mi mathvariant=\"bold\">A<\/mi><mo>−<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{G^+A^-}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi mathvariant=\"bold\">G<\/mi><mo>−<\/mo><\/msup><msup><mi mathvariant=\"bold\">A<\/mi><mo>+<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{G^-A^+}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi mathvariant=\"bold\">G<\/mi><mo>−<\/mo><\/msup><msup><mi mathvariant=\"bold\">A<\/mi><mo>−<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{G^-A^-}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><strong>G-Acc.<\/strong><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"bold\">P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi mathvariant=\"bold\">A<\/mi><mo>+<\/mo><\/msup><mo>∣<\/mo><msup><mi mathvariant=\"bold\">G<\/mi><mo>+<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{P(A^+\\mid G^+)}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"bold\">P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi mathvariant=\"bold\">A<\/mi><mo>+<\/mo><\/msup><mo>∣<\/mo><msup><mi mathvariant=\"bold\">G<\/mi><mo>−<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{P(A^+\\mid G^-)}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"bold\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\boldsymbol{\\Delta}<\/annotation><\/semantics><\/math><\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Qwen3-VL-8B<\/td>\n<td>Box-choice<\/td>\n<td align=\"right\">36.9<\/td>\n<td align=\"right\">29.6<\/td>\n<td align=\"right\">15.6<\/td>\n<td align=\"right\">18.0<\/td>\n<td align=\"right\">66.5<\/td>\n<td align=\"right\">55.5<\/td>\n<td align=\"right\">46.4<\/td>\n<td align=\"right\">+9.1<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Coordinates<\/td>\n<td align=\"right\">15.9<\/td>\n<td align=\"right\">10.6<\/td>\n<td align=\"right\">32.4<\/td>\n<td align=\"right\">41.1<\/td>\n<td align=\"right\">26.5<\/td>\n<td align=\"right\">59.9<\/td>\n<td align=\"right\">44.1<\/td>\n<td align=\"right\">+15.8<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-14B<\/td>\n<td>Box-choice<\/td>\n<td align=\"right\">30.7<\/td>\n<td align=\"right\">18.9<\/td>\n<td align=\"right\">27.9<\/td>\n<td align=\"right\">22.5<\/td>\n<td
