.5]<\/td>\n<td align=\"right\">42.80 [37.9, 56.1]<\/td>\n<td align=\"right\">35.67 [30.8, 53.2]<\/td>\n<\/tr>\n<tr>\n<td>Qwen2.5-VL-32B-Instruct<\/td>\n<td align=\"right\">39.34 [35.57, 43.51]<\/td>\n<td align=\"right\">38.28 [34.35, 42.63]<\/td>\n<td align=\"right\">37.34 [33.3, 48.7]<\/td>\n<td align=\"right\">35.61 [30.8, 48.1]<\/td>\n<td align=\"right\">40.11 [32.1, 55.4]<\/td>\n<\/tr>\n<tr>\n<td>Qwen2.5-VL-7B-Instruct<\/td>\n<td align=\"right\">35.80 [32.01, 39.20]<\/td>\n<td align=\"right\">34.90 [31.38, 37.97]<\/td>\n<td align=\"right\">31.43 [27.3, 41.8]<\/td>\n<td align=\"right\">32.19 [27.1, 41.3]<\/td>\n<td align=\"right\">28.89 [20.3, 38.8]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-38B<\/td>\n<td align=\"right\">42.78 [36.89, 48.89]<\/td>\n<td align=\"right\">41.74 [36.89, 48.70]<\/td>\n<td align=\"right\">36.80 [33.9, 46.8]<\/td>\n<td align=\"right\">40.96 [32.5, 52.7]<\/td>\n<td align=\"right\">33.75 [31.9, 49.5]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-14B<\/td>\n<td align=\"right\">34.41 [31.50, 37.38]<\/td>\n<td align=\"right\">34.52 [31.39, 37.73]<\/td>\n<td align=\"right\">38.23 [35.7, 46.9]<\/td>\n<td align=\"right\">38.38 [31.0, 45.4]<\/td>\n<td align=\"right\">35.95 [34.0, 55.8]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td align=\"right\">40.48 [37.03, 43.47]<\/td>\n<td align=\"right\">39.98 [36.44, 43.35]<\/td>\n<td align=\"right\">41.16 [36.0, 49.2]<\/td>\n<td align=\"right\">42.86 [33.1, 47.8]<\/td>\n<td align=\"right\">33.17 [33.0, 49.4]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-38B<\/td>\n<td align=\"right\">44.31 [37.38, 50.20]<\/td>\n<td align=\"right\">43.24 [36.40, 49.67]<\/td>\n<td align=\"right\">40.95 [38.9, 51.3]<\/td>\n<td align=\"right\">46.69 [38.7, 53.7]<\/td>\n<td align=\"right\">32.25 [25.2, 53.6]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-14B<\/td>\n<td align=\"right\">37.17 [34.53, 40.05]<\/td>\n<td align=\"right\">36.37 [33.66, 39.45]<\/td>\n<td align=\"right\">33.24 [26.5, 41.6]<\/td>\n<td align=\"right\">33.94 [26.7, 43.4]<\/td>\n<td align=\"right\">27.95 [20.0, 44.4]<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td align=\"right\">35.91 [33.24, 38.35]<\/td>\n<td align=\"right\">36.07 [33.09, 38.69]<\/td>\n<td align=\"right\">33.33 [30.4, 42.9]<\/td>\n<td align=\"right\">39.58 [30.2, 49.4]<\/td>\n<td align=\"right\">17.32 [14.2, 36.2]<\/td>\n<\/tr>\n<tr>\n<td>GLM-4.1V-9B-Thinking<\/td>\n<td align=\"right\">35.98 [32.91, 38.49]<\/td>\n<td align=\"right\">35.90 [32.73, 38.80]<\/td>\n<td align=\"right\">25.80 [19.7, 30.8]<\/td>\n<td align=\"right\">29.75 [18.2, 45.5]<\/td>\n<td align=\"right\">31.25 [0.0, 41.5]<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>More generally, the NC intervals are often wider than those for AB, making\nexplicit the greater uncertainty associated with the smaller numerical-counting\nevaluation set. We will include these intervals with the corresponding pooled\nresults in the revised manuscript rather than presenting the point estimates\nalone.<\/p>\n<h3>Clustered bootstrap intervals and paired significance analyses<\/h3>\n<p>We agree that question-level resampling is not the appropriate unit for MIMO-Bench,\nsince questions sharing an image, a target object, or a parent count query are not\nindependent. We have therefore recomputed our comparisons using clustering at the\nlevels the reviewer identifies.<\/p>\n<p>Confidence intervals use a nonparametric percentile bootstrap with <strong>20,000\nreplicates<\/strong>, resampled at the following units:<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Task<\/strong><\/th>\n<th><strong>Metric<\/strong><\/th>\n<th><strong>Resampling unit<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Attribute Binding<\/td>\n<td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">I<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{I}_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span><\/td>\n<td>image cluster (question outcomes paired within image)<\/td>\n<\/tr>\n<tr>\n<td>Attribute Binding<\/td>\n<td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span><\/td>\n<td>object group, aggregating questions within (image, object, referring expression)<\/td>\n<\/tr>\n<tr>\n<td>Numerical Counting<\/td>\n<td>global vs.\\ localized MRA<\/td>\n<td>parent group, held together within its image cluster<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Paired significance uses two-sided sign-flip randomization tests, with condition\nlabels exchanged jointly within the corresponding image, object, or parent-group\nunit, and Benjamini--Hochberg FDR correction applied separately within each family\nof model comparisons.<\/p>\n<p><strong>Visual prompting.<\/strong> The effect survives clustering and multiple-comparison\ncorrection for every evaluated model. All <strong>13<\/strong> models with consolidated\nper-question outputs show a positive image-clustered <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">I<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{I}_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span>\neffect after FDR correction (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q<\/mi><mo>≤<\/mo><mn>0.0312<\/mn><\/mrow><annotation encoding=\"application/x-tex\">q \\leq 0.0312<\/annotation><\/semantics><\/math><\/span>), and all <strong>14<\/strong> models with\nobject-group outputs show a positive <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span> effect\n(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q<\/mi><mo>≤<\/mo><mn>0.0202<\/mn><\/mrow><annotation encoding=\"application/x-tex\">q \\leq 0.0202<\/annotation><\/semantics><\/math><\/span>).<\/p>\n<p><strong>Global versus localized counting.<\/strong> This comparison is substantially weaker under\nparent-group clustering than the aggregate metrics suggest. Only\n<strong>Qwen3-VL-8B-Thinking<\/strong> remains significant after correction\n(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">Δ<\/mi><mrow><mi>G<\/mi><mo>−<\/mo><mi>L<\/mi><\/mrow><\/msub><mo>=<\/mo><mo>−<\/mo><mn>24.6<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\Delta_{G-L} = -24.6<\/annotation><\/semantics><\/math><\/span>, 95% CI <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">[<\/mo><mo>−<\/mo><mn>39.9<\/mn><mo separator=\"true\">,<\/mo><mo>−<\/mo><mn>12.8<\/mn><mo stretchy=\"false\">]<\/mo><\/mrow><annotation encoding=\"application/x-tex\">[-39.9, -12.8]<\/annotation><\/semantics><\/math><\/span>, paired <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>=<\/mo><mn>0.0020<\/mn><\/mrow><annotation encoding=\"application/x-tex\">p = 0.0020<\/annotation><\/semantics><\/math><\/span>,\nFDR <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q<\/mi><mo>=<\/mo><mn>0.0488<\/mn><\/mrow><annotation encoding=\"application/x-tex\">q = 0.0488<\/annotation><\/semantics><\/math><\/span>); no other model reaches <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q<\/mi><mo>&lt;<\/mo><mn>0.05<\/mn><\/mrow><annotation encoding=\"application/x-tex\">q &lt; 0.05<\/annotation><\/semantics><\/math><\/span>. We will report this\nexplicitly rather than presenting the global--local gap as a general finding, and\nwill describe it as a tendency observed at the aggregate level whose per-model\nevidence is established for a single model under paired testing.<\/p>\n<p><strong>Uncertainty for the human baseline.<\/strong> The human baseline was measured with\nseven participants who did not annotate MIMO-Bench, each solving 30 groups for\nAttribute Binding and 20 groups for Numerical Counting. Because participants\nanswer whole groups, we resample groups rather than individual questions when\nconstructing intervals. The resulting 95% confidence intervals for all reported\nhuman scores are:<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Metric<\/strong><\/th>\n<th align=\"right\"><strong>Human<\/strong><\/th>\n<th align=\"right\"><strong>95% CI<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Real <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">I<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{I}_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span><\/td>\n<td align=\"right\">89.3<\/td>\n<td align=\"right\">[81.7, 93.2]<\/td>\n<\/tr>\n<tr>\n<td>Real <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span><\/td>\n<td align=\"right\">86.7<\/td>\n<td align=\"right\">[83.2, 89.8]<\/td>\n<\/tr>\n<tr>\n<td>Syn. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">I<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{I}_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span><\/td>\n<td align=\"right\">85.7<\/td>\n<td align=\"right\">[77.1, 89.6]<\/td>\n<\/tr>\n<tr>\n<td>Syn. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span><\/td>\n<td align=\"right\">87.5<\/td>\n<td align=\"right\">[84.9, 90.1]<\/td>\n<\/tr>\n<tr>\n<td>Real <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">I<\/mi><mrow><mi mathvariant=\"normal\">M<\/mi><mi mathvariant=\"normal\">R<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{I}_{\\mathrm{MRA}}<\/annotation><\/semantics><\/math><\/span><\/td>\n<td align=\"right\">87.7<\/td>\n<td align=\"right\">[85.1, 88.2]<\/td>\n<\/tr>\n<tr>\n<td>Real <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">L<\/mi><mrow><mi mathvariant=\"normal\">M<\/mi><mi mathvariant=\"normal\">R<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{L}_{\\mathrm{MRA}}<\/annotation><\/semantics><\/math><\/span><\/td>\n<td align=\"right\">86.4<\/td>\n<td align=\"right\">[83.2, 88.5]<\/td>\n<\/tr>\n<tr>\n<td>Real <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">G<\/mi><mrow><mi mathvariant=\"normal\">M<\/mi><mi mathvariant=\"normal\">R<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{G}_{\\mathrm{MRA}}<\/annotation><\/semantics><\/math><\/span><\/td>\n<td align=\"right\">90.1<\/td>\n<td align=\"right\">[87.9, 92.6]<\/td>\n<\/tr>\n<tr>\n<td>Syn. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">I<\/mi><mrow><mi mathvariant=\"normal\">M<\/mi><mi mathvariant=\"normal\">R<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{I}_{\\mathrm{MRA}}<\/annotation><\/semantics><\/math><\/span><\/td>\n<td align=\"right\">89.6<\/td>\n<td align=\"right\">[86.9, 91.9]<\/td>\n<\/tr>\n<tr>\n<td>Syn. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">L<\/mi><mrow><mi mathvariant=\"normal\">M<\/mi><mi mathvariant=\"normal\">R<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{L}_{\\mathrm{MRA}}<\/annotation><\/semantics><\/math><\/span><\/td>\n<td align=\"right\">87.4<\/td>\n<td align=\"right\">[85.7, 90.2]<\/td>\n<\/tr>\n<tr>\n<td>Syn. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">G<\/mi><mrow><mi mathvariant=\"normal\">M<\/mi><mi mathvariant=\"normal\">R<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{G}_{\\mathrm{MRA}}<\/annotation><\/semantics><\/math><\/span><\/td>\n<td align=\"right\">92.0<\/td>\n<td align=\"right\">[90.1, 94.4]<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Within Attribute Binding, the intervals are wider for\n<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">I<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{I}_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span> than for <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span>, reflecting the\nsmaller number of independent groups underlying the instance-level scores. The\ncounting intervals are comparatively narrow because MRA is a bounded continuous\nscore rather than a binary outcome, so its group-level variance is lower even\nthough the counting split contains fewer groups.<\/p>\n<p>Importantly, the human--model gap is not sensitive to this uncertainty. The\nlowest human lower bound across all ten metrics is 77.1\n(synthetic <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">I<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{I}_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span>), which remains far above the\nstrongest model result on the corresponding split. The reported gap therefore\ndoes not depend on the precision of the human point estimates.<\/p>\n<h2 class=\"request\" id=\"r6-strengthen-the-synthetic-data-analysis\"><span class=\"request-meta\"><span class=\"request-num\">R6<\/span><\/span><span class=\"request-title\">Strengthen the synthetic-data analysis<\/span><\/h2>\n\n<h3>Synthetic-data analysis<\/h3>\n<p>We would be grateful for clarification on this request, so that we address the\nintended concern rather than a different one.<\/p>\n<p>The submission currently reports the following analyses concerning the synthetic\nsplit:<\/p>\n<ul>\n<li>a <strong>self-preference control<\/strong>, comparing the generating model against\ncontemporaneous non-Gemini models on the synthetic split (G2.5-Pro obtains\n47.7 synthetic AB <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"script\">I<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathcal{I}_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span>, against 49.7 for GPT-5-medium,\n47.9 for Q3-32B-Instruct and 45.1 for IVL3.5-241B-A28B), showing that the\ngenerator is not uniquely advantaged on its own images;<\/li>\n<li>a <strong>generator-selection comparison<\/strong> against Grok-4 and Flux, motivating the\nchoice of G2.5-Pro on grounds of scene coherence and prompt adherence; and<\/li>\n<li><strong>per-split reporting<\/strong> of every metric for real and synthetic images\nthroughout the main results, together with an explicit discussion of the\nanomalous Gemini-3.x synthetic gain.<\/li>\n<\/ul>\n<p>We are happy to extend this analysis in whichever direction the reviewer\nconsiders most useful --- for example, a broader self-preference comparison, a\nsystematic characterisation of the real--synthetic gap across all evaluated\nmodels, or additional validation of synthetic-image quality. Could the reviewer\nindicate which aspect of the synthetic-data analysis they would like\nstrengthened?<\/p>\n","counts":{"critical":0,"total":6}}];

const el = (tag, cls) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  return n;
};

function activeIndex() {
  const id = location.hash.startsWith("#/") ? location.hash.slice(2) : null;
  const i = DOCS.findIndex((d) => d.id === id);
  return i === -1 ? 0 : i;
}

function buildNav(active) {
  const nav = document.getElementById("nav");
  nav.textContent = "";
  DOCS.forEach((doc, i) => {
    const li = el("li");
    const a = el("a", "doc-link");
    a.href = "#/" + doc.id;
    if (i === active) a.setAttribute("aria-current", "true");
    const num = el("span", "doc-num");
    num.textContent = doc.id;
    const label = el("span");
    label.textContent = doc.nav;
    a.append(num, label);
    li.append(a);

    if (i === active && doc.toc.length) {
      const list = el("ul", "requests");
      for (const item of doc.toc) {
        const row = el("li");
        const link = el("a");
        link.href = "#" + item.id;
        const n = el("span", "n");
        n.textContent = item.num;
        const t = el("span");
        t.textContent = item.title;
        if (item.kind === "critical") {
          const dot = el("span", "dot");
          dot.title = "Critical";
          t.append(dot);
        }
        link.append(n, t);
        row.append(link);
        list.append(row);
      }
      li.append(list);
    }
    nav.append(li);
  });
}

function buildPager(active) {
  const pager = document.getElementById("pager");
  pager.textContent = "";
  const add = (doc, dir, cls) => {
    const a = el("a", cls);
    a.href = "#/" + doc.id;
    const d = el("span", "dir");
    d.textContent = dir;
    const t = el("span");
    t.textContent = doc.nav;
    a.append(d, t);
    pager.append(a);
  };
  if (active > 0) add(DOCS[active - 1], "Previous", "prev");
  if (active < DOCS.length - 1) add(DOCS[active + 1], "Next", "next");
}

function tally(doc) {
  if (!doc.counts.total) return "";
  const n = doc.counts.total;
  const crit = doc.counts.critical;
  const base = n + (n === 1 ? " requested change" : " requested changes");
  return crit ? base + " · " + crit + " marked critical" : base;
}

function render() {
  const i = activeIndex();
  const doc = DOCS[i];
  document.getElementById("doc-kicker").textContent =
    doc.id === "00" ? "Index" : "Response " + doc.id;
  document.getElementById("doc-title").textContent = doc.title;
  document.getElementById("doc-tally").textContent = tally(doc);
  document.getElementById("doc-body").innerHTML = doc.html;
  buildNav(i);
  buildPager(i);
  document.title = doc.nav + " — MIMO-Bench Rebuttal";
}

// "#/03" switches document; a bare "#r2-..." is in-page navigation.
let shown;
function route() {
  const id = location.hash.startsWith("#/") ? location.hash.slice(2) : shown;
  if (id === shown) return;
  shown = id;
  render();
  window.scrollTo(0, 0);
}

shown = DOCS[activeIndex()].id;
render();
addEventListener("hashchange", route);
</script>
