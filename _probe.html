 align=\"right\">49.6<\/td>\n<td align=\"right\">61.9<\/td>\n<td align=\"right\">55.3<\/td>\n<td align=\"right\">+6.5<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Coordinates<\/td>\n<td align=\"right\">7.7<\/td>\n<td align=\"right\">6.1<\/td>\n<td align=\"right\">48.2<\/td>\n<td align=\"right\">38.0<\/td>\n<td align=\"right\">13.8<\/td>\n<td align=\"right\">55.9<\/td>\n<td align=\"right\">55.9<\/td>\n<td align=\"right\">0.0<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-14B<\/td>\n<td>Box-choice<\/td>\n<td align=\"right\">26.3<\/td>\n<td align=\"right\">28.0<\/td>\n<td align=\"right\">17.5<\/td>\n<td align=\"right\">28.3<\/td>\n<td align=\"right\">54.3<\/td>\n<td align=\"right\">48.4<\/td>\n<td align=\"right\">38.2<\/td>\n<td align=\"right\">+10.3<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Coordinates<\/td>\n<td align=\"right\">7.1<\/td>\n<td align=\"right\">8.4<\/td>\n<td align=\"right\">34.0<\/td>\n<td align=\"right\">50.6<\/td>\n<td align=\"right\">15.4<\/td>\n<td align=\"right\">45.6<\/td>\n<td align=\"right\">40.2<\/td>\n<td align=\"right\">+5.5<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td>Box-choice<\/td>\n<td align=\"right\">27.2<\/td>\n<td align=\"right\">22.1<\/td>\n<td align=\"right\">24.9<\/td>\n<td align=\"right\">25.8<\/td>\n<td align=\"right\">49.3<\/td>\n<td align=\"right\">55.2<\/td>\n<td align=\"right\">49.2<\/td>\n<td align=\"right\">+6.0<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Coordinates<\/td>\n<td align=\"right\">5.2<\/td>\n<td align=\"right\">4.6<\/td>\n<td align=\"right\">42.9<\/td>\n<td align=\"right\">47.3<\/td>\n<td align=\"right\">9.8<\/td>\n<td align=\"right\">52.9<\/td>\n<td align=\"right\">47.6<\/td>\n<td align=\"right\">+5.3<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td>Box-choice<\/td>\n<td align=\"right\">21.0<\/td>\n<td align=\"right\">29.4<\/td>\n<td align=\"right\">17.2<\/td>\n<td align=\"right\">32.4<\/td>\n<td align=\"right\">50.4<\/td>\n<td align=\"right\">41.6<\/td>\n<td align=\"right\">34.7<\/td>\n<td align=\"right\">+6.9<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Coordinates<\/td>\n<td align=\"right\">7.0<\/td>\n<td align=\"right\">11.0<\/td>\n<td align=\"right\">28.9<\/td>\n<td align=\"right\">53.0<\/td>\n<td align=\"right\">18.1<\/td>\n<td align=\"right\">38.9<\/td>\n<td align=\"right\">35.3<\/td>\n<td align=\"right\">+3.6<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><em>Explicit RE-grounding outcomes and their correspondence with Attribute Binding (AB) answers on matched examples. Cells report the percentage of the evaluation set falling in each outcome. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>G<\/mi><mo>+<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">G^+<\/annotation><\/semantics><\/math><\/span>/<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>G<\/mi><mo>−<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">G^-<\/annotation><\/semantics><\/math><\/span> denote correct/incorrect grounding and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>A<\/mi><mo>+<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">A^+<\/annotation><\/semantics><\/math><\/span>/<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>A<\/mi><mo>−<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">A^-<\/annotation><\/semantics><\/math><\/span> correct/incorrect AB answers. G-Acc. denotes grounding accuracy and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><mo>=<\/mo><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi>A<\/mi><mo>+<\/mo><\/msup><mi mathvariant=\"normal\">∣<\/mi><msup><mi>G<\/mi><mo>+<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi>A<\/mi><mo>+<\/mo><\/msup><mi mathvariant=\"normal\">∣<\/mi><msup><mi>G<\/mi><mo>−<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">\\Delta=P(A^+|G^+)-P(A^+|G^-)<\/annotation><\/semantics><\/math><\/span>. All accuracies and conditional probabilities are percentages. Chance accuracy for box-choice grounding is 25%.<\/em><\/p>\n<p>The candidate-based evaluation gives a consistent result across models. Grounding accuracy is only 49.3--66.5%, showing directly that resolving the compositional RE to the intended target is itself challenging. Moreover, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi>A<\/mi><mo>+<\/mo><\/msup><mi mathvariant=\"normal\">∣<\/mi><msup><mi>G<\/mi><mo>+<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">P(A^+|G^+)<\/annotation><\/semantics><\/math><\/span> exceeds <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi>A<\/mi><mo>+<\/mo><\/msup><mi mathvariant=\"normal\">∣<\/mi><msup><mi>G<\/mi><mo>−<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">P(A^+|G^-)<\/annotation><\/semantics><\/math><\/span> for every model, by 6.0--10.3 percentage points. Thus, examples on which the model successfully grounds the RE are systematically more likely to receive a correct AB answer.<\/p>\n<p>At the same time, this analysis directly exposes the second failure regime requested by the reviewer. Even conditional on correct grounding, AB accuracy is only 41.6--61.9%; therefore a large fraction of examples are <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>G<\/mi><mo>+<\/mo><\/msup><msup><mi>A<\/mi><mo>−<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">G^+A^-<\/annotation><\/semantics><\/math><\/span>---the intended target is selected correctly, but the queried attribute is still answered incorrectly. We do not equate all <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>G<\/mi><mo>+<\/mo><\/msup><msup><mi>A<\/mi><mo>−<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">G^+A^-<\/annotation><\/semantics><\/math><\/span> cases with pure &quot;binding&quot; failures, since downstream errors may also reflect fine-grained recognition or component-level reasoning.<\/p>\n<p>Importantly, the coordinate evaluation cautions against interpreting any single localization output format as a clean intermediate variable. Coordinate grounding is substantially lower (9.8--26.5%) and its relationship with AB success is weaker and less uniform. This formulation preserves the original image but adds the burden of precise coordinate generation; conversely, box-choice grounding removes coordinate-generation difficulty but adds candidate overlays to the image. The disparity between the two therefore prevents us from claiming a format-independent numerical estimate of &quot;localization accuracy.&quot;<\/p>\n<p>This was the main reason we had not originally inserted localization as an explicit intermediate task: AB has a naturally defined answer format, whereas a localization readout necessarily requires choosing an additional interface. The new experiments make this ambiguity explicit rather than hiding it, and provide two complementary views of grounding.<\/p>\n<p><strong>What can we conclude about the dominant bottleneck?<\/strong><\/p>\n<p>The revised evidence does not support assigning one universally dominant stage. Candidate grounding itself remains substantially imperfect, and successful grounding consistently improves the probability of a correct AB answer. However, substantial AB errors remain among correctly grounded examples. Furthermore, the absolute grounding accuracy depends strongly on the localization interface. We therefore conclude that both RE-based target identification and downstream target-conditioned visual reasoning contribute to MIMO difficulty, rather than assigning a precise fraction of errors to either stage.<\/p>\n<p><strong>Visual prompting.<\/strong><\/p>\n<p>We accordingly revise visual prompting from a decomposition mechanism to a target-specification intervention. The original textual RE is replaced by a ground-truth visual cue on the target. The substantial IACC improvement under this condition remains informative: directly supplying the target makes the AB task considerably easier, providing complementary evidence that RE-based target identification is an important source of difficulty. However, the visual cue changes the input and itself has to be perceived and interpreted. We therefore no longer treat the standard--visual-prompting difference as a pure measure of grounding difficulty, nor the residual error as pure attribute binding.<\/p>\n<p>Finally, every RE in MIMO-Bench is associated with its annotated ground-truth target localization. We will release the corresponding target mask/bounding-box coordinates with the dataset so that future work can evaluate other grounding interfaces and localization metrics directly.<\/p>\n<h2 class=\"request\" id=\"r4-strengthen-controls-for-the-diagnostic-experiments-or-weaken\"><span class=\"request-meta\"><span class=\"request-num\">R4<\/span><\/span><span class=\"request-title\">Strengthen controls for the diagnostic experiments or weaken the corresponding claims<\/span><\/h2>\n\n<h3>Relevant-region extraction.<\/h3>\n<h4>Controls and interpretation of relevant-region extraction.<\/h4>\n<p>We thank the reviewer for raising this point. We agree that the original presentation did not make the relationship between our relevant-region extraction experiment and the existing cropping control sufficiently explicit, and we have performed an additional localization-quality analysis.<\/p>\n<h4>Comparison with ordinary cropping.<\/h4>\n<p>A non-model-driven cropping control is already included in our evaluation through <strong>MIMO-Crop<\/strong>. In MIMO-Crop, a local window is constructed around the ground-truth target using the benchmark annotations, independently of the evaluated MLLM, while retaining the objects required by the referring expression. Thus, MIMO-Crop tests the benefit of being externally provided a relevant local region, whereas relevant-region extraction tests whether the MLLM can <em>itself<\/em> identify such a useful region from the full image and question before being re-queried.<\/p>\n<p>To make this comparison more direct, we analyzed all valid regions produced during relevant-region extraction. Across 23,109 predicted crops, the mean crop size is approximately <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>459<\/mn><mo>×<\/mo><mn>479<\/mn><\/mrow><annotation encoding=\"application/x-tex\">459\\times479<\/annotation><\/semantics><\/math><\/span> pixels (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>232,227<\/mn><\/mrow><annotation encoding=\"application/x-tex\">232{,}227<\/annotation><\/semantics><\/math><\/span> px<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mrow><\/mrow><mn>2<\/mn><\/msup><\/mrow><annotation encoding=\"application/x-tex\">^2<\/annotation><\/semantics><\/math><\/span>), corresponding to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12.43<\/mn><mi mathvariant=\"normal\">%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">12.43\\%<\/annotation><\/semantics><\/math><\/span> of the original image area. This is close in spatial scale to our <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>512<\/mn><mo>×<\/mo><mn>512<\/mn><\/mrow><annotation encoding=\"application/x-tex\">512\\times512<\/annotation><\/semantics><\/math><\/span> MIMO-Crop condition, making MIMO-Crop<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow><\/mrow><mn>512<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">_{512}<\/annotation><\/semantics><\/math><\/span> a natural non-model-driven local-cropping comparison.<\/p>\n<h4>Quality of the model-proposed regions.<\/h4>\n<p>We additionally compute the IoU between each model-proposed crop and the ground-truth target box, and report final-answer accuracy conditioned on crop quality. We restrict the comparison below to InternVL models up to 14B and Qwen models up to 32B for which both analyses are available.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Model<\/strong><\/th>\n<th align=\"right\"><strong>Base<\/strong><\/th>\n<th align=\"right\"><strong>0--25<\/strong><\/th>\n<th align=\"right\"><strong>25--50<\/strong><\/th>\n<th align=\"right\"><strong>50--75<\/strong><\/th>\n<th align=\"right\"><strong>75--100<\/strong><\/th>\n<th align=\"right\"><strong>MIMO-Crop<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow><\/mrow><mn>512<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">_{512}<\/annotation><\/semantics><\/math><\/span><\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>InternVL3-14B<\/td>\n<td align=\"right\">37.2<\/td>\n<td align=\"right\">48.8<\/td>\n<td align=\"right\">51.6<\/td>\n<td align=\"right\">56.5<\/td>\n<td align=\"right\">52.0<\/td>\n<td align=\"right\">50.7<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td align=\"right\">35.9<\/td>\n<td align=\"right\">35.4<\/td>\n<td align=\"right\">44.9<\/td>\n<td align=\"right\">51.5<\/td>\n<td align=\"right\">51.0<\/td>\n<td align=\"right\">46.8<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td align=\"right\">40.5<\/td>\n<td align=\"right\">37.2<\/td>\n<td align=\"right\">42.7<\/td>\n<td align=\"right\">36.4<\/td>\n<td align=\"right\">45.8<\/td>\n<td align=\"right\">50.7<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-32B<\/td>\n<td align=\"right\">47.5<\/td>\n<td align=\"right\">41.2<\/td>\n<td align=\"right\">45.5<\/td>\n<td align=\"right\">49.0<\/td>\n<td align=\"right\">52.9<\/td>\n<td align=\"right\">48.9<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-8B<\/td>\n<td align=\"right\">40.3<\/td>\n<td align=\"right\">39.3<\/td>\n<td align=\"right\">45.5<\/td>\n<td align=\"right\">39.0<\/td>\n<td align=\"right\">50.8<\/td>\n<td align=\"right\">44.4<\/td>\n<\/tr>\n<tr>\n<td>Qwen2.5-VL-7B<\/td>\n<td align=\"right\">35.8<\/td>\n<td align=\"right\">29.7<\/td>\n<td align=\"right\">40.5<\/td>\n<td align=\"right\">28.6<\/td>\n<td align=\"right\">39.2<\/td>\n<td align=\"right\">47.6<\/td>\n<\/tr>\n<tr>\n<td><strong>Mean<\/strong><\/td>\n<td align=\"right\"><strong>39.5<\/strong><\/td>\n<td align=\"right\"><strong>38.6<\/strong><\/td>\n<td align=\"right\"><strong>45.1<\/strong><\/td>\n<td align=\"right\"><strong>43.5<\/strong><\/td>\n<td align=\"right\"><strong>48.6<\/strong><\/td>\n<td align=\"right\"><strong>48.2<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><em>Final-answer accuracy conditioned on the IoU of the model-proposed crop with the ground-truth target box, compared with the full-image baseline and the externally constructed MIMO-Crop<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow><\/mrow><mn>512<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">_{512}<\/annotation><\/semantics><\/math><\/span> condition.<\/em><\/p>\n<p>The resulting pattern is informative. Very poorly localized predicted crops (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">0<\/annotation><\/semantics><\/math><\/span>--<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>25<\/mn><mi mathvariant=\"normal\">%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">25\\%<\/annotation><\/semantics><\/math><\/span> IoU) obtain <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>38.6<\/mn><mi mathvariant=\"normal\">%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">38.6\\%<\/annotation><\/semantics><\/math><\/span> mean accuracy, at or slightly below the <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>39.5<\/mn><mi mathvariant=\"normal\">%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">39.5\\%<\/annotation><\/semantics><\/math><\/span> full-image baseline, despite still involving the additional inference call and crop/re-query operation. In contrast, when the model proposes a region with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>75<\/mn><\/mrow><annotation encoding=\"application/x-tex\">75<\/annotation><\/semantics><\/math><\/span>--<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100<\/mn><mi mathvariant=\"normal\">%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">100\\%<\/annotation><\/semantics><\/math><\/span> IoU, mean accuracy rises to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>48.6<\/mn><mi mathvariant=\"normal\">%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">48.6\\%<\/annotation><\/semantics><\/math><\/span>, approximately matching the <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>48.2<\/mn><mi mathvariant=\"normal\">%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">48.2\\%<\/annotation><\/semantics><\/math><\/span> obtained by MIMO-Crop<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow><\/mrow><mn>512<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">_{512}<\/annotation><\/semantics><\/math><\/span>.<\/p>\n<p>The relationship is not strictly monotonic at intermediate IoUs, which is expected because many MIMO referring expressions require contextual objects outside the target box itself. Nevertheless, the endpoints are informative: poorly localized crops largely remove the benefit, whereas well-localized model-selected regions recover approximately the performance obtained when a relevant crop is externally supplied.<\/p>\n<h4>Comparison with fixed and random crops, and a two-pass control.<\/h4>\n<p>To further separate model-driven region selection from generic cropping, rescaling, and the additional inference call, we evaluate fixed and random 512/1024 crops and a two-pass no-crop control on the same 200 examples across six models. Fixed crops use the same centered window for every image, whereas random crops place a reproducibly sampled window of the same size independently of the model.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Control<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> vs. Base<\/th>\n<th align=\"right\">Target visible<\/th>\n<th align=\"right\">Target absent<\/th>\n<th align=\"right\">Visibility <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Fixed 1024<\/td>\n<td align=\"right\">+1.0<\/td>\n<td align=\"right\">49.7<\/td>\n<td align=\"right\">34.1<\/td>\n<td align=\"right\"><strong>+15.6<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Random 1024<\/td>\n<td align=\"right\">+0.8<\/td>\n<td align=\"right\">53.5<\/td>\n<td align=\"right\">31.9<\/td>\n<td align=\"right\"><strong>+21.6<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Fixed 512<\/td>\n<td align=\"right\">-5.3<\/td>\n<td align=\"right\">58.3<\/td>\n<td align=\"right\">33.2<\/td>\n<td align=\"right\"><strong>+25.1<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Random 512<\/td>\n<td align=\"right\">-8.7<\/td>\n<td align=\"right\">49.0<\/td>\n<td align=\"right\">31.3<\/td>\n<td align=\"right\"><strong>+17.7<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>At 1024 resolution, fixed and random cropping is essentially unchanged from the full-image baseline, while the smaller 512 crops reduce accuracy because they much more frequently remove the queried target. Conditioning on target visibility makes the effect clearer: accuracy is higher when the target remains visible in all four crop conditions, with pooled differences of 15.6--25.1 points; the direction is positive for all 24 model-by-condition comparisons. When the target is absent, accuracy falls to approximately 31--34%, close to the benchmark majority-answer baseline.<\/p>\n<p>We additionally test whether the additional inference call itself explains the gain. In this control the two-turn procedure is kept exactly as in relevant-region extraction: the first turn still asks the model, in text, for a plausible region containing the target, and the second turn passes the model its own predicted region together with the <strong>unmodified<\/strong> image rather than the crop. The region-proposal turn and the extra inference call are therefore held constant, and only the change of visual input is removed.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Qwen2.5-VL-7B<\/td>\n<td align=\"right\">+1.0<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-8B<\/td>\n<td align=\"right\">+1.5<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td align=\"right\">+2.0<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td align=\"right\">+1.1<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-14B<\/td>\n<td align=\"right\">-1.5<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-14B<\/td>\n<td align=\"right\">+3.5<\/td>\n<\/tr>\n<tr>\n<td><strong>Mean<\/strong><\/td>\n<td align=\"right\"><strong>+1.3<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The two-pass no-crop control therefore yields only a small mean improvement of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>+<\/mo><mn>1.3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">+1.3<\/annotation><\/semantics><\/math><\/span> points, and no model gains more than <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>+<\/mo><mn>3.5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">+3.5<\/annotation><\/semantics><\/math><\/span>. Together with the MIMO-Crop and predicted-region IoU analyses above, these controls indicate that generic cropping/rescaling or simply querying the model twice does not explain the relevant-region gains. The benefit is associated with successfully retaining target-relevant visual information, rather than with cropping or an additional inference call alone.<\/p>\n<h4>Scope of the dynamic visual-access claim.<\/h4>\n<p>We would also like to clarify that we do not present the proposed procedure as a complete iterative visual-search system. In the manuscript, we explicitly introduce it as a &quot;small exploratory study&quot;, call the method <em>naive relevant-region extraction<\/em>, and describe it as &quot;naive single-pass narrowing&quot;. The purpose of this experiment is precisely to test, at a proof-of-concept level, whether departing from a single static visual input can benefit MIMO reasoning.<\/p>\n<p>Our use of &quot;dynamic visual access&quot; refers to this distinction: the visual input used for the final answer is adaptively determined by the model&#39;s first inference. The model first observes the full scene, predicts the region it considers sufficient for answering the question, and is then re-queried on that region. We agree that this one-step procedure is not itself a multi-step iterative visual-search mechanism; rather, our claim is that the success of even this deliberately naive one-step intervention provides evidence that adaptive visual re-access is a promising direction.<\/p>\n<p>This is also how the experiment is motivated in the manuscript. We discuss mechanisms such as Qwen3-VL&#39;s DeepStack and interleaved image--text reasoning only as motivation for repeated access to visual information, and explicitly state that we cannot verify that these mechanisms are responsible for the corresponding models&#39; performance.<\/p>\n<p>Taken together, MIMO-Crop and naive relevant-region extraction provide a simple proof-of-concept signal: externally providing a relevant local region helps, and when an untrained model itself succeeds in proposing such a region, its downstream performance approaches the externally supplied crop condition. We therefore view these results as motivation for future learned, potentially multi-step region-selection mechanisms that can adapt visual resolution and suppress irrelevant distractors, rather than as claiming that the present one-step procedure is already a complete iterative visual-search system.<\/p>\n<p>We will revise the manuscript to make this scope explicit and add the predicted-region size statistics, IoU-conditioned analysis, and comparison with MIMO-Crop<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow><\/mrow><mn>512<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">_{512}<\/annotation><\/semantics><\/math><\/span>.<\/p>\n<h3>Graying and distractor reduction.<\/h3>\n<h4>Clarification on graying and distractor reduction.<\/h4>\n<p>We agree that the graying experiment should not be interpreted as a clean causal intervention on distractor count alone, and we will revise the manuscript to make this scope explicit.<\/p>\n<p>More generally, in natural images there are different ways of reducing the effective burden of distractors, and these interventions can necessarily change other properties of the visual input. For example, cropping reduces the number of competing instances precisely by narrowing the visual search space, while simultaneously increasing the relative scale of the retained target. Graying achieves a related reduction through a different mechanism: the image dimensions are unchanged and, for a given model, the pre- and post-graying inputs contain the same number of visual tokens, while the visual information carried by regions outside the retained window is suppressed. This also increases the relative salience of the retained region. Thus, these associated changes are not all incidental artifacts; some are part of the mechanism through which the effective distractor burden is reduced.<\/p>\n<p>This interpretation is also consistent, at a high level, with selective visual attention in humans. During visual search, processing is preferentially allocated to task-relevant regions while competing peripheral information is de-emphasized, thereby reducing its effective influence on the task. We do not claim that graying or cropping reproduces the biological mechanism; rather, they are simple external analogues of the broader principle of spatially prioritizing relevant information while suppressing competing visual input.<\/p>\n<p>Accordingly, we do not use either intervention to estimate the isolated causal effect of distractor count. We revise our interpretation to the more limited empirical observation that reducing effective visual competition through different forms of spatial focusing can improve performance in MIMO scenes. A strict causal characterization of distractor count would require a separately controlled setting in which distractor instances can be independently added or removed while target appearance, scale, position, background, and scene structure are held fixed.<\/p>\n<p>The graying and relevant-region experiments should therefore be viewed as complementary interventions that reduce effective distractor burden through different channels, rather than as clean causal decompositions. The localization-quality and MIMO-Crop analyses reported above further characterize the relevant-region intervention without attributing its gain to any single factor.<\/p>\n<h2 class=\"request\" id=\"r5-report-basic-dataset-statistics\"><span class=\"request-meta\"><span class=\"request-num\">R5<\/span><\/span><span class=\"request-title\">Report basic dataset statistics<\/span><\/h2>\n\n<p>We thank the reviewer for this suggestion and agree that reporting only the\ntotal number of QA pairs makes image coverage and question reuse difficult to\nassess. We now report the underlying image statistics.<\/p>\n<p>MIMO-Bench is built from <strong>120 images in total: 60 real and 60 synthetic<\/strong>.\nImages are distributed across the two tasks, and the two task image sets are\nnot disjoint: some images are used only for attribute binding, some only for\nnumerical counting, and some are shared by both tasks. Question counts per\nimage therefore differ substantially between the two tasks, reflecting the\ndifferent granularity of the two annotations.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Task<\/strong><\/th>\n<th><strong>Images<\/strong><\/th>\n<th align=\"right\"><strong>Questions<\/strong><\/th>\n<th align=\"right\"><strong>Mean questions / image<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Attribute binding<\/td>\n<td>real + synthetic<\/td>\n<td align=\"right\">3,402<\/td>\n<td align=\"right\">~47<\/td>\n<\/tr>\n<tr>\n<td>Numerical counting<\/td>\n<td>real + synthetic<\/td>\n<td align=\"right\">400<\/td>\n<td align=\"right\">8<\/td>\n<\/tr>\n<tr>\n<td><strong>Total<\/strong><\/td>\n<td><strong>120<\/strong> (60 real, 60 syn.)<\/td>\n<td align=\"right\"><strong>3,802<\/strong><\/td>\n<td align=\"right\">--<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>For attribute binding, an image contributes on average <strong>47 questions<\/strong>,\nbecause each retained target instance in an image is queried for each of its\nvalid attributes, and MIMO images contain many same-category instances by\nconstruction. For numerical counting, an image contributes <strong>8 questions<\/strong>,\ncomprising the parent query for a target group together with its localized\nchild queries. The counting split contains <strong>57 parent queries<\/strong>, of which\n<strong>39 come from synthetic images<\/strong> and <strong>18 from real images<\/strong>.<\/p>\n<p>The high questions-per-image ratio for attribute binding is a direct\nconsequence of the MIMO setting rather than of question reuse: a single dense\nscene supports many distinct referring expressions, each resolving to a\ndifferent target instance, and each target instance supports several distinct\nattribute queries. We will report these statistics, together with the\nper-image question distribution, in the revised manuscript.<\/p>\n","counts":{"critical":0,"total":5}},{"id":"05","title":"Reviewer 2b3E — Grounding, Intervention Controls, Metrics, and Counting Consistency","nav":"Reviewer 2b3E","toc":[{"id":"r1-revise-or-strengthen-the-decomposition-of-localization-recog","num":"R1","tag":null,"kind":null,"title":"Revise or strengthen the decomposition of localization, recognition, and binding"},{"id":"r2-add-proper-controls-for-distractor-reduction-and-relevant-re","num":"R2","tag":null,"kind":null,"title":"Add proper controls for distractor reduction and relevant-region extraction"},{"id":"r3-correct-the-interpretation-of-and-add-strict-group-exact-mat","num":"R3","tag":null,"kind":null,"title":"Correct the interpretation of  and add strict group exact match"},{"id":"r4-evaluate-hierarchical-counting-consistency","num":"R4","tag":null,"kind":null,"title":"Evaluate hierarchical counting consistency"},{"id":"r5-add-uncertainty-estimates","num":"R5","tag":null,"kind":null,"title":"Add uncertainty estimates"},{"id":"r6-strengthen-the-synthetic-data-analysis","num":"R6","tag":null,"kind":null,"title":"Strengthen the synthetic-data analysis"}],"html":"<h2 class=\"request\" id=\"r1-revise-or-strengthen-the-decomposition-of-localization-recog\"><span class=\"request-meta\"><span class=\"request-num\">R1<\/span><\/span><span class=\"request-title\">Revise or strengthen the decomposition of localization, recognition, and binding<\/span><\/h2>\n\n<h3>Localization, recognition, and Attribute Binding<\/h3>\n<p>We agree with the reviewer that our original statement that<\/p>\n<p>“the residual error is AB itself, not localization” was too strong. We have<\/p>\n<p>removed this statement and no longer treat visual prompting as a clean<\/p>\n<p>localization--binding decomposition.<\/p>\n<p>Following the reviewer&#39;s suggestion to add a predicted-localization evaluation,<\/p>\n<p>we now explicitly evaluate whether the original RE can be grounded to its<\/p>\n<p>ground-truth target. Because explicit localization itself requires choosing an<\/p>\n<p>output interface, we report two complementary formulations on the full evaluation set<\/p>\n<p>matched AB instances.<\/p>\n<p>In <em>box-choice grounding<\/em>, the original RE is retained and four candidate<\/p>\n<p>instances are visually marked; the model selects the intended candidate. This<\/p>\n<p>provides a simple discrete grounding decision, but the boxes necessarily modify<\/p>\n<p>the visual input. In <em>coordinate grounding<\/em>, the image is left unchanged<\/p>\n<p>and the model predicts the target coordinates from the original RE. This avoids<\/p>\n<p>marker overlays but introduces the additional requirement of producing a<\/p>\n<p>precise spatial output.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Model<\/strong><\/th>\n<th><strong>Grounding<\/strong><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi mathvariant=\"bold\">G<\/mi><mo>+<\/mo><\/msup><msup><mi mathvariant=\"bold\">A<\/mi><mo>+<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{G^+A^+}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi mathvariant=\"bold\">G<\/mi><mo>+<\/mo><\/msup><msup><mi mathvariant=\"bold\">A<\/mi><mo>−<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{G^+A^-}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi mathvariant=\"bold\">G<\/mi><mo>−<\/mo><\/msup><msup><mi mathvariant=\"bold\">A<\/mi><mo>+<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{G^-A^+}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi mathvariant=\"bold\">G<\/mi><mo>−<\/mo><\/msup><msup><mi mathvariant=\"bold\">A<\/mi><mo>−<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{G^-A^-}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><strong>G-Acc.<\/strong><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"bold\">P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi mathvariant=\"bold\">A<\/mi><mo>+<\/mo><\/msup><mo>∣<\/mo><msup><mi mathvariant=\"bold\">G<\/mi><mo>+<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{P(A^+\\mid G^+)}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"bold\">P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi mathvariant=\"bold\">A<\/mi><mo>+<\/mo><\/msup><mo>∣<\/mo><msup><mi mathvariant=\"bold\">G<\/mi><mo>−<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{P(A^+\\mid G^-)}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"bold\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\boldsymbol{\\Delta}<\/annotation><\/semantics><\/math><\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Qwen3-VL-8B<\/td>\n<td>Box-choice<\/td>\n<td align=\"right\">36.9<\/td>\n<td align=\"right\">29.6<\/td>\n<td align=\"right\">15.6<\/td>\n<td align=\"right\">18.0<\/td>\n<td align=\"right\">66.5<\/td>\n<td align=\"right\">55.5<\/td>\n<td align=\"right\">46.4<\/td>\n<td align=\"right\">+9.1<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Coordinates<\/td>\n<td align=\"right\">15.9<\/td>\n<td align=\"right\">10.6<\/td>\n<td align=\"right\">32.4<\/td>\n<td align=\"right\">41.1<\/td>\n<td align=\"right\">26.5<\/td>\n<td align=\"right\">59.9<\/td>\n<td align=\"right\">44.1<\/td>\n<td align=\"right\">+15.8<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-14B<\/td>\n<td>Box-choice<\/td>\n<td align=\"right\">30.7<\/td>\n<td align=\"right\">18.9<\/td>\n<td align=\"right\">27.9<\/td>\n<td align=\"right\">22.5<\/td>\n<td align=\"right\">49.6<\/td>\n<td align=\"right\">61.9<\/td>\n<td align=\"right\">55.3<\/td>\n<td align=\"right\">+6.5<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Coordinates<\/td>\n<td align=\"right\">7.7<\/td>\n<td align=\"right\">6.1<\/td>\n<td align=\"right\">48.2<\/td>\n<td align=\"right\">38.0<\/td>\n<td align=\"right\">13.8<\/td>\n<td align=\"right\">55.9<\/td>\n<td align=\"right\">55.9<\/td>\n<td align=\"right\">0.0<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-14B<\/td>\n<td>Box-choice<\/td>\n<td align=\"right\">26.3<\/td>\n<td align=\"right\">28.0<\/td>\n<td align=\"right\">17.5<\/td>\n<td align=\"right\">28.3<\/td>\n<td align=\"right\">54.3<\/td>\n<td align=\"right\">48.4<\/td>\n<td align=\"right\">38.2<\/td>\n<td align=\"right\">+10.3<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Coordinates<\/td>\n<td align=\"right\">7.1<\/td>\n<td align=\"right\">8.4<\/td>\n<td align=\"right\">34.0<\/td>\n<td align=\"right\">50.6<\/td>\n<td align=\"right\">15.4<\/td>\n<td align=\"right\">45.6<\/td>\n<td align=\"right\">40.2<\/td>\n<td align=\"right\">+5.5<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td>Box-choice<\/td>\n<td align=\"right\">27.2<\/td>\n<td align=\"right\">22.1<\/td>\n<td align=\"right\">24.9<\/td>\n<td align=\"right\">25.8<\/td>\n<td align=\"right\">49.3<\/td>\n<td align=\"right\">55.2<\/td>\n<td align=\"right\">49.2<\/td>\n<td align=\"right\">+6.0<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Coordinates<\/td>\n<td align=\"right\">5.2<\/td>\n<td align=\"right\">4.6<\/td>\n<td align=\"right\">42.9<\/td>\n<td align=\"right\">47.3<\/td>\n<td align=\"right\">9.8<\/td>\n<td align=\"right\">52.9<\/td>\n<td align=\"right\">47.6<\/td>\n<td align=\"right\">+5.3<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td>Box-choice<\/td>\n<td align=\"right\">21.0<\/td>\n<td align=\"right\">29.4<\/td>\n<td align=\"right\">17.2<\/td>\n<td align=\"right\">32.4<\/td>\n<td align=\"right\">50.4<\/td>\n<td align=\"right\">41.6<\/td>\n<td align=\"right\">34.7<\/td>\n<td align=\"right\">+6.9<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Coordinates<\/td>\n<td align=\"right\">7.0<\/td>\n<td align=\"right\">11.0<\/td>\n<td align=\"right\">28.9<\/td>\n<td align=\"right\">53.0<\/td>\n<td align=\"right\">18.1<\/td>\n<td align=\"right\">38.9<\/td>\n<td align=\"right\">35.3<\/td>\n<td align=\"right\">+3.6<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><em>Explicit RE-grounding outcomes and their correspondence with Attribute Binding (AB) answers on matched examples. Cells report the percentage of the evaluation set falling in each outcome. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>G<\/mi><mo>+<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">G^+<\/annotation><\/semantics><\/math><\/span>/<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>G<\/mi><mo>−<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">G^-<\/annotation><\/semantics><\/math><\/span> denote correct/incorrect grounding and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>A<\/mi><mo>+<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">A^+<\/annotation><\/semantics><\/math><\/span>/<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>A<\/mi><mo>−<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">A^-<\/annotation><\/semantics><\/math><\/span> denote correct/incorrect AB answers. G-Acc. denotes grounding accuracy, and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><mo>=<\/mo><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi>A<\/mi><mo>+<\/mo><\/msup><mi mathvariant=\"normal\">∣<\/mi><msup><mi>G<\/mi><mo>+<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi>A<\/mi><mo>+<\/mo><\/msup><mi mathvariant=\"normal\">∣<\/mi><msup><mi>G<\/mi><mo>−<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">\\Delta=P(A^+|G^+)-P(A^+|G^-)<\/annotation><\/semantics><\/math><\/span>. All accuracies and conditional probabilities are percentages. Chance accuracy for box-choice grounding is 25%.<\/em><\/p>\n<p>The box-choice evaluation shows that RE grounding itself remains imperfect<\/p>\n<p>(49.3--66.5%). More importantly, it lets us directly separate grounding<\/p>\n<p>success from the AB outcome behaviorally. For every evaluated model,<\/p>\n<p>P(A^+|G^+) is higher than P(A^+|G^-), with gains of 6.0--10.3 points.<\/p>\n<p>However, even when the correct target is selected, AB accuracy remains only<\/p>\n<p>41.6--61.9%. Thus, successful grounding improves AB performance but does not<\/p>\n<p>solve the task.<\/p>\n<p>We agree with the reviewer that the remaining G^+A^- cases should not all<\/p>\n<p>be called binding failures. They can include fine-grained color, pattern,<\/p>\n<p>material, or component recognition; small or occluded components; component<\/p>\n<p>identification/localization; preprocessing or visual-token effects; as well as<\/p>\n<p>genuine cross-instance attribute misbinding.<\/p>\n<p>The coordinate results additionally make clear why a perfectly clean<\/p>\n<p>grounding--binding decomposition is difficult to obtain behaviorally.<\/p>\n<p>Coordinate localization, despite leaving the image unmodified, is much weaker<\/p>\n<p>(9.8--26.5%) and shows a less uniform relationship with AB success. This does<\/p>\n<p>not allow us to conclude simply that the model “cannot localize”: coordinate<\/p>\n<p>prediction couples RE grounding with precise spatial-output generation. The<\/p>\n<p>box-choice formulation avoids that requirement, but changes the image through<\/p>\n<p>candidate overlays. Thus, the localization measurement itself depends<\/p>\n<p>substantially on its elicitation format.<\/p>\n<p>This format dependence motivated our original use of visual prompting rather<\/p>\n<p>than inserting a separate localization prediction stage into the benchmark:<\/p>\n<p>AB has a fixed task definition and answer format, whereas explicit localization<\/p>\n<p>requires an additional design choice with its own confounds. We agree that the<\/p>\n<p>original paper nevertheless over-interpreted visual prompting, and the revised<\/p>\n<p>paper now makes this limitation explicit and reports both localization probes.<\/p>\n<p><strong>Visual prompting is therefore reinterpreted as a ground-truth<\/strong><\/p>\n<p>**\ntarget-specification condition, not a binding-only condition.**<\/p>\n<p>It replaces the original compositional RE with a visual marker on the annotated<\/p>\n<p>target. The substantial IACC improvement shows that direct visual target<\/p>\n<p>specification removes a substantial part of the difficulty associated with<\/p>\n<p>RE-based target identification. However, because the marker itself modifies the<\/p>\n<p>image and must be perceived and interpreted, we do not claim that visual<\/p>\n<p>prompting constitutes perfect localization from the model&#39;s perspective, that<\/p>\n<p>its gain is a pure localization-error estimate, or that its residual error is<\/p>\n<p>pure AB/binding error.<\/p>\n<p>The revised analysis therefore uses complementary evidence rather than clean<\/p>\n<p>causal isolation: predicted-localization probes measure explicit RE grounding;<\/p>\n<p>matched grounding--AB outcomes expose both grounding failures and<\/p>\n<p>grounding-success/AB-failure cases; and visual prompting measures performance<\/p>\n<p>when the target is externally specified.<\/p>\n<p>Finally, the benchmark already contains the ground-truth localization associated<\/p>\n<p>with each target and referring expression. We will release these target<\/p>\n<p>mask/bounding-box coordinates with MIMO-Bench, allowing future work to evaluate<\/p>\n<p>alternative localization interfaces and metrics directly.<\/p>\n<hr>\n<h2 class=\"request\" id=\"r2-add-proper-controls-for-distractor-reduction-and-relevant-re\"><span class=\"request-meta\"><span class=\"request-num\">R2<\/span><\/span><span class=\"request-title\">Add proper controls for distractor reduction and relevant-region extraction<\/span><\/h2>\n\n<h3>Relevant-region extraction.<\/h3>\n<h3>Controls for relevant-region extraction<\/h3>\n<p>We agree that relevant-region extraction combines multiple changes, including<\/p>\n<p>region selection, target rescaling, distractor reduction, and an additional<\/p>\n<p>inference call. We therefore add a localization-quality analysis and compare<\/p>\n<p>the model-selected crops against an externally constructed cropping control.<\/p>\n<p>A non-model-driven cropping control is already included through<\/p>\n<p><strong>MIMO-Crop<\/strong>. In MIMO-Crop, a local window is constructed around the<\/p>\n<p>ground-truth target using benchmark annotations, independently of the evaluated<\/p>\n<p>MLLM, while retaining the objects required by the referring expression. Thus,<\/p>\n<p>MIMO-Crop tests the benefit of externally providing a relevant local region,<\/p>\n<p>whereas relevant-region extraction tests whether the model can itself identify<\/p>\n<p>such a region before being re-queried.<\/p>\n<p>Across <strong>23,109 valid predicted crops<\/strong>, the mean crop size is approximately<\/p>\n<p>459\\times479 pixels (232{,}227 px^2), corresponding to <strong>12.43%<\/strong><\/p>\n<p>of the original image area. This is close in spatial scale to our<\/p>\n<p>512\\times512 MIMO-Crop condition.<\/p>\n<p>We additionally compute the IoU between each model-proposed crop and the<\/p>\n<p>ground-truth target box and report final-answer accuracy conditioned on<\/p>\n<p>predicted-region quality.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Model<\/strong><\/th>\n<th align=\"right\"><strong>Base<\/strong><\/th>\n<th align=\"right\"><strong>0--25<\/strong><\/th>\n<th align=\"right\"><strong>25--50<\/strong><\/th>\n<th align=\"right\"><strong>50--75<\/strong><\/th>\n<th align=\"right\"><strong>75--100<\/strong><\/th>\n<th align=\"right\"><strong>MIMO-Crop<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow><\/mrow><mn>512<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">_{512}<\/annotation><\/semantics><\/math><\/span><\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>InternVL3-14B<\/td>\n<td align=\"right\">37.2<\/td>\n<td align=\"right\">48.8<\/td>\n<td align=\"right\">51.6<\/td>\n<td align=\"right\">56.5<\/td>\n<td align=\"right\">52.0<\/td>\n<td align=\"right\">50.7<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td align=\"right\">35.9<\/td>\n<td align=\"right\">35.4<\/td>\n<td align=\"right\">44.9<\/td>\n<td align=\"right\">51.5<\/td>\n<td align=\"right\">51.0<\/td>\n<td align=\"right\">46.8<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td align=\"right\">40.5<\/td>\n<td align=\"right\">37.2<\/td>\n<td align=\"right\">42.7<\/td>\n<td align=\"right\">36.4<\/td>\n<td align=\"right\">45.8<\/td>\n<td align=\"right\">50.7<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-32B<\/td>\n<td align=\"right\">47.5<\/td>\n<td align=\"right\">41.2<\/td>\n<td align=\"right\">45.5<\/td>\n<td align=\"right\">49.0<\/td>\n<td align=\"right\">52.9<\/td>\n<td align=\"right\">48.9<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-8B<\/td>\n<td align=\"right\">40.3<\/td>\n<td align=\"right\">39.3<\/td>\n<td align=\"right\">45.5<\/td>\n<td align=\"right\">39.0<\/td>\n<td align=\"right\">50.8<\/td>\n<td align=\"right\">44.4<\/td>\n<\/tr>\n<tr>\n<td>Qwen2.5-VL-7B<\/td>\n<td align=\"right\">35.8<\/td>\n<td align=\"right\">29.7<\/td>\n<td align=\"right\">40.5<\/td>\n<td align=\"right\">28.6<\/td>\n<td align=\"right\">39.2<\/td>\n<td align=\"right\">47.6<\/td>\n<\/tr>\n<tr>\n<td><strong>Mean<\/strong><\/td>\n<td align=\"right\"><strong>39.5<\/strong><\/td>\n<td align=\"right\"><strong>38.6<\/strong><\/td>\n<td align=\"right\"><strong>45.1<\/strong><\/td>\n<td align=\"right\"><strong>43.5<\/strong><\/td>\n<td align=\"right\"><strong>48.6<\/strong><\/td>\n<td align=\"right\"><strong>48.2<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><em>Final-answer accuracy conditioned on the IoU of the model-proposed crop with the ground-truth target box, compared with the full-image baseline and the externally constructed MIMO-Crop_{512} condition.<\/em><\/p>\n<p>Very poorly localized predicted crops (0--25% IoU) obtain 38.6% mean<\/p>\n<p>accuracy, at or slightly below the 39.5% full-image baseline, despite<\/p>\n<p>still involving the additional inference call and crop/re-query operation.<\/p>\n<p>In contrast, when the model proposes a region with 75--100% IoU, mean<\/p>\n<p>accuracy rises to 48.6%, approximately matching the 48.2% obtained by<\/p>\n<p>MIMO-Crop_{512}.<\/p>\n<p>The relationship is not strictly monotonic at intermediate IoUs because many<\/p>\n<p>MIMO referring expressions require contextual objects outside the target box<\/p>\n<p>itself. We therefore treat IoU as a proxy for localization quality rather<\/p>\n<p>than a complete measure of crop usefulness.<\/p>\n<p>These results do not isolate region selection, rescaling, distractor reduction,<\/p>\n<p>and the additional model call as independent causal factors. Rather, they<\/p>\n<p>support the more limited observation that when a model succeeds in proposing<\/p>\n<p>a target-relevant region, its downstream performance approaches the<\/p>\n<p>externally supplied cropping condition.<\/p>\n<h4>Fixed/random crop and two-pass controls<\/h4>\n<p>To further separate model-driven region selection from generic cropping,\nrescaling, and the additional inference call, we evaluate fixed and random\n512/1024 crops and a two-pass no-crop control on the same 200 examples across\nsix models. Fixed crops use the same centered window for every image, whereas\nrandom crops place a reproducibly sampled window of the same size independently\nof the model.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Control<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span> vs. Base<\/th>\n<th align=\"right\">Target visible<\/th>\n<th align=\"right\">Target absent<\/th>\n<th align=\"right\">Visibility <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Fixed 1024<\/td>\n<td align=\"right\">+1.0<\/td>\n<td align=\"right\">49.7<\/td>\n<td align=\"right\">34.1<\/td>\n<td align=\"right\"><strong>+15.6<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Random 1024<\/td>\n<td align=\"right\">+0.8<\/td>\n<td align=\"right\">53.5<\/td>\n<td align=\"right\">31.9<\/td>\n<td align=\"right\"><strong>+21.6<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Fixed 512<\/td>\n<td align=\"right\">-5.3<\/td>\n<td align=\"right\">58.3<\/td>\n<td align=\"right\">33.2<\/td>\n<td align=\"right\"><strong>+25.1<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Random 512<\/td>\n<td align=\"right\">-8.7<\/td>\n<td align=\"right\">49.0<\/td>\n<td align=\"right\">31.3<\/td>\n<td align=\"right\"><strong>+17.7<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>At 1024 resolution, fixed and random cropping is essentially unchanged from\nthe full-image baseline, while the smaller 512 crops reduce accuracy because\nthey much more frequently remove the queried target. Conditioning on target\nvisibility makes the effect clearer: accuracy is higher when the target remains\nvisible in all four crop conditions, with pooled differences of 15.6--25.1\npoints; the direction is positive for all 24 model-by-condition comparisons.\nWhen the target is absent, accuracy falls to approximately 31--34%, close to\nthe benchmark majority-answer baseline.<\/p>\n<p>We additionally test whether the additional inference call itself explains the gain. In this control the two-turn procedure is kept exactly as in relevant-region extraction: the first turn still asks the model, in text, for a plausible region containing the target, and the second turn passes the model its own predicted region together with the <strong>unmodified<\/strong> image rather than the crop. The region-proposal turn and the extra inference call are therefore held constant, and only the change of visual input is removed.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Qwen2.5-VL-7B<\/td>\n<td align=\"right\">+1.0<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-8B<\/td>\n<td align=\"right\">+1.5<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td align=\"right\">+2.0<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td align=\"right\">+1.1<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-14B<\/td>\n<td align=\"right\">-1.5<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-14B<\/td>\n<td align=\"right\">+3.5<\/td>\n<\/tr>\n<tr>\n<td><strong>Mean<\/strong><\/td>\n<td align=\"right\"><strong>+1.3<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The two-pass no-crop control therefore yields only a small mean improvement of\n<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>+<\/mo><mn>1.3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">+1.3<\/annotation><\/semantics><\/math><\/span> points, and no model gains more than <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>+<\/mo><mn>3.5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">+3.5<\/annotation><\/semantics><\/math><\/span>. Together\nwith the MIMO-Crop and predicted-region IoU analyses above, these controls\nindicate that generic cropping/rescaling or simply querying the model twice\ndoes not explain the relevant-region gains. The benefit is associated with\nsuccessfully retaining target-relevant visual information, rather than with\ncropping or an additional inference call alone.<\/p>\n<h3>Distractor reduction.<\/h3>\n<h3>Scope of the distractor-reduction interventions<\/h3>\n<p>We agree that the current natural-image interventions should not be<\/p>\n<p>presented as clean causal isolation of distractor count, and we will revise<\/p>\n<p>the corresponding claims.<\/p>\n<p>Our intention is instead to study whether reducing the effective influence<\/p>\n<p>of competing same-category instances is beneficial, while recognizing that<\/p>\n<p>there are multiple ways to achieve such reduction and that each mechanism<\/p>\n<p>can necessarily modify other properties of the input.<\/p>\n<p>In the graying experiment, the image dimensions and, for a given model, the<\/p>\n<p>number of visual tokens remain unchanged, while the visual information in<\/p>\n<p>regions outside the retained window is suppressed. This reduces the<\/p>\n<p>effective contribution of distractor-containing regions and simultaneously<\/p>\n<p>increases the relative salience of the retained region. In relevant-region<\/p>\n<p>extraction, distractor reduction is achieved differently: the model narrows<\/p>\n<p>the visual search space through cropping, which removes peripheral candidate<\/p>\n<p>objects while also changing the relative scale and resolution of the<\/p>\n<p>retained target. These coupled changes are partly constitutive of how the<\/p>\n<p>respective interventions reduce effective distractor burden, rather than<\/p>\n<p>being solely unintended artifacts.<\/p>\n<p>This broader principle also has a natural analogy to selective visual<\/p>\n<p>attention in humans. During visual search, relevant regions are prioritized<\/p>\n<p>while competing peripheral information receives less processing, thereby<\/p>\n<p>reducing its effective interference with the task. We do not claim that<\/p>\n<p>graying or cropping reproduces this biological mechanism; rather, these<\/p>\n<p>interventions provide simple external ways of realizing the same broad<\/p>\n<p>computational principle of prioritizing task-relevant visual information<\/p>\n<p>while suppressing competing input.<\/p>\n<p>We therefore narrow our claim from a causal effect of distractor count alone<\/p>\n<p>to the empirical observation that different forms of spatial focusing that<\/p>\n<p>reduce effective distractor burden can improve MIMO performance. A clean<\/p>\n<p>causal study of distractor count would require a separately controlled<\/p>\n<p>setting in which distractor instances can be independently added or removed<\/p>\n<p>while target appearance, scale, position, background, and other scene<\/p>\n<p>properties remain fixed.<\/p>\n<p>Accordingly, the revised manuscript will avoid describing the graying or<\/p>\n<p>relevant-region experiments as clean causal isolation. The additional<\/p>\n<p>relevant-region controls reported above separately characterize when<\/p>\n<p>model-driven narrowing is beneficial.<\/p>\n<p>We additionally test an alternative form of outside-region suppression using<\/p>\n<p>inpainting, which replaces the surrounding image content rather than masking it<\/p>\n<p>with grayscale pixels. This control tests whether the observed effect is<\/p>\n<p>specific to grayscale masking.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th align=\"right\">Strong inpainting<\/th>\n<th align=\"right\">1024 / little suppression<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Qwen2.5-VL-7B<\/td>\n<td align=\"right\">30.7<\/td>\n<td align=\"right\">30.4<\/td>\n<td align=\"right\">+0.3<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-8B<\/td>\n<td align=\"right\">39.2<\/td>\n<td align=\"right\">39.2<\/td>\n<td align=\"right\">0.0<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td align=\"right\">40.8<\/td>\n<td align=\"right\">39.7<\/td>\n<td align=\"right\">+1.1<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td align=\"right\">44.7<\/td>\n<td align=\"right\">44.0<\/td>\n<td align=\"right\">+0.7<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-14B<\/td>\n<td align=\"right\">54.5<\/td>\n<td align=\"right\">52.7<\/td>\n<td align=\"right\">+1.8<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-14B<\/td>\n<td align=\"right\">47.5<\/td>\n<td align=\"right\">48.2<\/td>\n<td align=\"right\">-0.7<\/td>\n<\/tr>\n<tr>\n<td><strong>Mean<\/strong><\/td>\n<td align=\"right\"><strong>42.9<\/strong><\/td>\n<td align=\"right\"><strong>42.4<\/strong><\/td>\n<td align=\"right\"><strong>+0.5<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Mean accuracy under strong inpainting is <strong>42.9%<\/strong>, compared with <strong>42.4%<\/strong>\nunder the corresponding 1024 / little-suppression setting, a difference of only\n<strong>+0.5 points<\/strong>. The control therefore does not reveal a large independent gain\nfrom outside-region suppression, but it does show that the behavior is not\nspecific to replacing the surrounding image with grayscale pixels. Because inpainting\nalso changes the visual input in its own way, we continue to interpret this\nresult as evidence that suppressing competing outside-region information can\nhelp, rather than as a clean causal estimate of distractor count alone. We do\nnot treat either graying or inpainting as a clean causal manipulation of\ndistractor count, since both modify the visual input in additional ways.<\/p>\n<h2 class=\"request\" id=\"r3-correct-the-interpretation-of-and-add-strict-group-exact-mat\"><span class=\"request-meta\"><span class=\"request-num\">R3<\/span><\/span><span class=\"request-title\">Correct the interpretation of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span> and add strict group exact match<\/span><\/h2>\n\n<h3>Clarification of Group Accuracy (G_{\\mathrm{ACC}})<\/h3>\n<p>We thank the reviewer for raising this point. We would like to clarify that<\/p>\n<p>G_{\\mathrm{ACC}} was not intended to be an all-or-nothing criterion.<\/p>\n<p>As explicitly defined in Eq. (1), for each target instance we first compute<\/p>\n<p>the fraction of its valid attribute questions answered correctly, and then<\/p>\n<p>average this quantity equally across target instances. Thus, an instance for<\/p>\n<p>which four out of five attributes are answered correctly contributes 0.8,<\/p>\n<p>not 0.<\/p>\n<p>Our use of the term “jointly” was intended to indicate that the valid<\/p>\n<p>attributes associated with the same target instance are evaluated together<\/p>\n<p>as a group, rather than pooling all attribute questions independently across<\/p>\n<p>the benchmark. This group-wise averaging also ensures that every target<\/p>\n<p>instance receives equal weight regardless of the number of valid attributes<\/p>\n<p>associated with it; consequently, an error has a larger effect on the score<\/p>\n<p>of an instance characterized by fewer attributes.<\/p>\n<p>We agree that the word “jointly” may be read as implying an<\/p>\n<p>all-attributes-correct criterion, although this is not what Eq. (1) computes.<\/p>\n<p>We will revise this wording in the manuscript to make the intended<\/p>\n<p>interpretation explicit. The metric definition and reported results remain<\/p>\n<p>unchanged.<\/p>\n<h3>Group Accuracy and strict group exact match<\/h3>\n<p>We thank the reviewer for suggesting an all-attributes-correct complement to<\/p>\n<p>G_{\\mathrm{ACC}}. As clarified above, the existing G_{\\mathrm{ACC}} is<\/p>\n<p>not an all-or-nothing metric: it first computes the fraction of valid<\/p>\n<p>attributes answered correctly for each target instance and then averages<\/p>\n<p>equally across instances.<\/p>\n<p>To additionally capture the stricter criterion suggested by the reviewer, we<\/p>\n<p>now report <strong>Exact Group Accuracy<\/strong>, under which a target instance is counted<\/p>\n<p>as correct only when <strong>all of its valid attribute questions are answered<\/strong><\/p>\n<p>**\ncorrectly**.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Model<\/strong><\/th>\n<th align=\"right\"><strong>Exact Group Accuracy<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Gemini-2.5-Flash<\/td>\n<td align=\"right\">33.33%<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-8B-Thinking<\/td>\n<td align=\"right\">15.83%<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-241B-A28B<\/td>\n<td align=\"right\">11.75%<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-32B-Thinking<\/td>\n<td align=\"right\">9.78%<\/td>\n<\/tr>\n<tr>\n<td>Gemini-2.5-Pro<\/td>\n<td align=\"right\">9.39%<\/td>\n<\/tr>\n<tr>\n<td>Qwen2.5-VL-72B-Instruct<\/td>\n<td align=\"right\">6.94%<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-32B-Instruct<\/td>\n<td align=\"right\">6.14%<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-78B<\/td>\n<td align=\"right\">5.43%<\/td>\n<\/tr>\n<tr>\n<td>GLM-4.1V-9B-Thinking<\/td>\n<td align=\"right\">5.42%<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-38B<\/td>\n<td align=\"right\">5.17%<\/td>\n<\/tr>\n<tr>\n<td>Qwen2.5-VL-32B-Instruct<\/td>\n<td align=\"right\">4.60%<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td align=\"right\">3.92%<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-38B<\/td>\n<td align=\"right\">3.61%<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td align=\"right\">3.55%<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-14B<\/td>\n<td align=\"right\">3.41%<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-8B-Instruct<\/td>\n<td align=\"right\">3.13%<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-30B-A3B-Thinking<\/td>\n<td align=\"right\">2.70%<\/td>\n<\/tr>\n<tr>\n<td>Qwen2.5-VL-7B-Instruct<\/td>\n<td align=\"right\">2.34%<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-30B-A3B-Instruct<\/td>\n<td align=\"right\">2.08%<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-14B<\/td>\n<td align=\"right\">1.71%<\/td>\n<\/tr>\n<tr>\n<td>GLM-4.5V<\/td>\n<td align=\"right\">1.15%<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The strict metric is substantially lower than G_{\\mathrm{ACC}}, as expected:<\/p>\n<p>under Exact Group Accuracy, a single incorrect attribute makes the entire<\/p>\n<p>target group incorrect. We therefore view the two metrics as complementary.<\/p>\n<p>G_{\\mathrm{ACC}} measures the fraction of each target&#39;s attributes answered<\/p>\n<p>correctly while giving every target equal weight, whereas Exact Group Accuracy<\/p>\n<p>measures complete all-attribute success.<\/p>\n<h2 class=\"request\" id=\"r4-evaluate-hierarchical-counting-consistency\"><span class=\"request-meta\"><span class=\"request-num\">R4<\/span><\/span><span class=\"request-title\">Evaluate hierarchical counting consistency<\/span><\/h2>\n\n<h3>Hierarchical counting consistency<\/h3>\n<p>We thank the reviewer for suggesting this analysis. Our numerical-counting<\/p>\n<p>questions are organized hierarchically: for each parent query, the<\/p>\n<p>ground-truth parent count equals the sum of the counts of its localized<\/p>\n<p>child queries. We therefore evaluate whether model predictions preserve<\/p>\n<p>this same hierarchy.<\/p>\n<p>For each parent--children group g, we define the consistency error as<\/p>\n<p>[<\/p>\n<p>e<em>g =<\/em><\/p>\n<ul>\n<li>\\hat{y}^{(g)}*{\\mathrm{parent}}<\/li>\n<\/ul>\n<ul>\n<li>\\sum_{c \\in \\mathcal{C}(g)}\n \\hat{y}^{(g)}_c .\n ]<\/li>\n<\/ul>\n<p>We report <em>Exact Consistency<\/em>, the percentage of groups for which<\/p>\n<p>e_g=0; mean absolute error (MAE), \\frac{1}{G}\\sum_g |e_g|; and<\/p>\n<p><em>Signed Bias<\/em>, \\frac{1}{G}\\sum_g e_g. Negative bias indicates<\/p>\n<p>that the parent prediction is smaller than the sum of its child<\/p>\n<p>predictions, while positive bias indicates the converse. We evaluate only<\/p>\n<p>groups for which the parent and all child predictions are available and<\/p>\n<p>parseable; the maximum number of such groups is 53.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Model<\/strong><\/th>\n<th align=\"right\"><strong>Groups<\/strong><\/th>\n<th align=\"right\"><strong>Exact Cons. (%)<\/strong><\/th>\n<th align=\"right\"><strong>MAE<\/strong><\/th>\n<th align=\"right\"><strong>Bias<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>IVL3.5-241B-A28B<\/td>\n<td align=\"right\">33<\/td>\n<td align=\"right\">72.7<\/td>\n<td align=\"right\">1.00<\/td>\n<td align=\"right\">-1.00<\/td>\n<\/tr>\n<tr>\n<td>Q3-32B-Thinking<\/td>\n<td align=\"right\">20<\/td>\n<td align=\"right\">50.0<\/td>\n<td align=\"right\">0.75<\/td>\n<td align=\"right\">-0.35<\/td>\n<\/tr>\n<tr>\n<td>G3.1-Pro-Preview-Low<\/td>\n<td align=\"right\">53<\/td>\n<td align=\"right\">45.3<\/td>\n<td align=\"right\">1.55<\/td>\n<td align=\"right\">-0.19<\/td>\n<\/tr>\n<tr>\n<td>G3.5-Flash-Low<\/td>\n<td align=\"right\">53<\/td>\n<td align=\"right\">45.3<\/td>\n<td align=\"right\">1.34<\/td>\n<td align=\"right\">-0.36<\/td>\n<\/tr>\n<tr>\n<td>G3.5-Flash-High<\/td>\n<td align=\"right\">53<\/td>\n<td align=\"right\">43.4<\/td>\n<td align=\"right\">1.58<\/td>\n<td align=\"right\">-1.02<\/td>\n<\/tr>\n<tr>\n<td>Q3-8B-Thinking<\/td>\n<td align=\"right\">7<\/td>\n<td align=\"right\">42.9<\/td>\n<td align=\"right\">0.86<\/td>\n<td align=\"right\">-0.86<\/td>\n<\/tr>\n<tr>\n<td>GLM-4.1V-9B-Thinking<\/td>\n<td align=\"right\">8<\/td>\n<td align=\"right\">25.0<\/td>\n<td align=\"right\">2.00<\/td>\n<td align=\"right\">-0.75<\/td>\n<\/tr>\n<tr>\n<td>Q2.5-72B<\/td>\n<td align=\"right\">53<\/td>\n<td align=\"right\">22.6<\/td>\n<td align=\"right\">3.42<\/td>\n<td align=\"right\">-1.57<\/td>\n<\/tr>\n<tr>\n<td>IVL3-78B<\/td>\n<td align=\"right\">53<\/td>\n<td align=\"right\">20.8<\/td>\n<td align=\"right\">3.62<\/td>\n<td align=\"right\">-3.36<\/td>\n<\/tr>\n<tr>\n<td>GPT-5-medium<\/td>\n<td align=\"right\">52<\/td>\n<td align=\"right\">19.2<\/td>\n<td align=\"right\">2.37<\/td>\n<td align=\"right\">-0.90<\/td>\n<\/tr>\n<tr>\n<td>GLM-4.5V<\/td>\n<td align=\"right\">53<\/td>\n<td align=\"right\">18.9<\/td>\n<td align=\"right\">3.17<\/td>\n<td align=\"right\">-1.70<\/td>\n<\/tr>\n<tr>\n<td>Q3-32B-Instruct<\/td>\n<td align=\"right\">53<\/td>\n<td align=\"right\">18.9<\/td>\n<td align=\"right\">2.87<\/td>\n<td align=\"right\">-2.34<\/td>\n<\/tr>\n<tr>\n<td>G2.5-Pro<\/td>\n<td align=\"right\">53<\/td>\n<td align=\"right\">17.0<\/td>\n<td align=\"right\">2.74<\/td>\n<td align=\"right\">-1.45<\/td>\n<\/tr>\n<tr>\n<td>Q3-30B-A3B-Instruct<\/td>\n<td align=\"right\">53<\/td>\n<td align=\"right\">17.0<\/td>\n<td align=\"right\">4.04<\/td>\n<td align=\"right\">-3.55<\/td>\n<\/tr>\n<tr>\n<td>G3.1-Pro-Preview-High<\/td>\n<td align=\"right\">33<\/td>\n<td align=\"right\">15.2<\/td>\n<td align=\"right\">1.55<\/td>\n<td align=\"right\">-0.39<\/td>\n<\/tr>\n<tr>\n<td>Q2.5-32B<\/td>\n<td align=\"right\">53<\/td>\n<td align=\"right\">11.3<\/td>\n<td align=\"right\">3.53<\/td>\n<td align=\"right\">-2.70<\/td>\n<\/tr>\n<tr>\n<td>Q2.5-7B<\/td>\n<td align=\"right\">53<\/td>\n<td align=\"right\">11.3<\/td>\n<td align=\"right\">3.68<\/td>\n<td align=\"right\">-2.81<\/td>\n<\/tr>\n<tr>\n<td>Q3-8B-Instruct<\/td>\n<td align=\"right\">53<\/td>\n<td align=\"right\">11.3<\/td>\n<td align=\"right\">3.45<\/td>\n<td align=\"right\">-2.96<\/td>\n<\/tr>\n<tr>\n<td>G2.5-Flash<\/td>\n<td align=\"right\">49<\/td>\n<td align=\"right\">10.2<\/td>\n<td align=\"right\">4.84<\/td>\n<td align=\"right\">-2.76<\/td>\n<\/tr>\n<tr>\n<td>IVL3-8B<\/td>\n<td align=\"right\">41<\/td>\n<td align=\"right\">9.8<\/td>\n<td align=\"right\">6.20<\/td>\n<td align=\"right\">-6.20<\/td>\n<\/tr>\n<tr>\n<td>IVL3-14B<\/td>\n<td align=\"right\">33<\/td>\n<td align=\"right\">9.1<\/td>\n<td align=\"right\">5.55<\/td>\n<td align=\"right\">-4.15<\/td>\n<\/tr>\n<tr>\n<td>IVL3-38B<\/td>\n<td align=\"right\">52<\/td>\n<td align=\"right\">7.7<\/td>\n<td align=\"right\">3.71<\/td>\n<td align=\"right\">-3.25<\/td>\n<\/tr>\n<tr>\n<td>IVL3.5-38B<\/td>\n<td align=\"right\">53<\/td>\n<td align=\"right\">7.5<\/td>\n<td align=\"right\">4.42<\/td>\n<td align=\"right\">-4.00<\/td>\n<\/tr>\n<tr>\n<td>IVL3.5-14B<\/td>\n<td align=\"right\">53<\/td>\n<td align=\"right\">3.8<\/td>\n<td align=\"right\">4.72<\/td>\n<td align=\"right\">-4.42<\/td>\n<\/tr>\n<tr>\n<td>IVL3.5-8B<\/td>\n<td align=\"right\">53<\/td>\n<td align=\"right\">3.8<\/td>\n<td align=\"right\">3.98<\/td>\n<td align=\"right\">-3.79<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><em>Hierarchical consistency of numerical-counting predictions. Exact Cons. is the percentage of parent--children groups for which the predicted parent count equals the sum of the predicted child counts. MAE is the mean absolute parent--child-sum difference, and Bias is the mean signed difference (parent - child sum). These metrics measure internal consistency, not correctness against ground truth.<\/em><\/p>\n<p>The results show that hierarchical consistency varies substantially across<\/p>\n<p>models. IVL3.5-241B-A28B is the most internally consistent, with 72.7% of<\/p>\n<p>eligible parent--children groups satisfying the hierarchy exactly, followed<\/p>\n<p>by Q3-32B-Thinking at 50.0%. In contrast, most models are exactly<\/p>\n<p>consistent on fewer than one-fifth of their evaluated groups. The MAE<\/p>\n<p>similarly varies considerably, from below one count for Q3-32B-Thinking<\/p>\n<p>to more than four counts for several InternVL variants.<\/p>\n<p>The signed bias is negative for all evaluated models. Thus, when global<\/p>\n<p>and localized predictions disagree, the model generally predicts fewer<\/p>\n<p>objects in the parent query than are obtained by summing its own localized<\/p>\n<p>child predictions. This complements our GMRA--LMRA analysis: the latter<\/p>\n<p>compares accuracy of global and localized counting against ground truth,<\/p>\n<p>whereas this experiment directly tests whether the model&#39;s global and<\/p>\n<p>localized predictions are mutually consistent.<\/p>\n<p>Importantly, hierarchical consistency does not imply correctness. For<\/p>\n<p>example, a parent prediction of 5 and child predictions of 2 and 3<\/p>\n<p>are exactly consistent even if the ground-truth parent count is 10.<\/p>\n<p>Hence, we report this analysis as a measure of internal consistency<\/p>\n<p>alongside GMRA and LMRA, rather than as an additional accuracy metric.<\/p>\n<hr>\n<h2 class=\"request\" id=\"r5-add-uncertainty-estimates\"><span class=\"request-meta\"><span class=\"request-num\">R5<\/span><\/span><span class=\"request-title\">Add uncertainty estimates<\/span><\/h2>\n\n<h3>Uncertainty estimates for the main benchmark results.<\/h3>\n<p>Following the reviewer&#39;s suggestion, we additionally quantify uncertainty for\nthe main Attribute Binding (AB) and Numerical Counting (NC) results. We now\nreport confidence intervals alongside all pooled scores: IACC and\n<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span> for AB, and IMRA, LMRA, and GMRA for NC. The values in\nbrackets denote the corresponding 95% confidence intervals.<\/p>\n<p>For example, Gemini-3.5-Flash-Low obtains an AB IACC of\n54.72 [51.51, 58.99] and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span> of\n55.13 [51.85, 59.72], while its NC IMRA, LMRA, and GMRA are\n61.50 [56.7, 69.6], 59.77 [58.9, 76.9], and\n59.51 [52.4, 68.1], respectively.<\/p>\n<p>The pooled intervals for all evaluated models are reported below.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th align=\"right\">IACC (95% CI)<\/th>\n<th align=\"right\"><
