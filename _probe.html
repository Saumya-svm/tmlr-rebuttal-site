<!doctype html>

<title>MIMO-Bench Rebuttal</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #f4f6f7;
    --panel: #ffffff;
    --ink: #14181d;
    --muted: #5c6773;
    --faint: #8b95a1;
    --rule: #dde3e8;
    --rule-soft: #eaeef1;
    --accent: #1c5d78;
    --accent-wash: #e7eff3;
    --critical: #96322a;
    --critical-wash: #f7e9e7;
    --strengthening: #45624a;
    --strengthening-wash: #e8efe9;
    --serif: "Source Serif 4", Charter, Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    /* Prose stays at a readable measure; the column itself is wider so the
       result tables have room instead of scrolling inside a narrow strip. */
    --measure: 74ch;
    --column: 66rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0f1317;
      --panel: #151a1f;
      --ink: #dfe5ea;
      --muted: #98a4b0;
      --faint: #68737f;
      --rule: #262e36;
      --rule-soft: #1d242b;
      --accent: #74b8d4;
      --accent-wash: #17272f;
      --critical: #e0897c;
      --critical-wash: #2c1d1b;
      --strengthening: #92b899;
      --strengthening-wash: #1a241c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0f1317;
    --panel: #151a1f;
    --ink: #dfe5ea;
    --muted: #98a4b0;
    --faint: #68737f;
    --rule: #262e36;
    --rule-soft: #1d242b;
    --accent: #74b8d4;
    --accent-wash: #17272f;
    --critical: #e0897c;
    --critical-wash: #2c1d1b;
    --strengthening: #92b899;
    --strengthening-wash: #1a241c;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .layout { display: flex; align-items: flex-start; gap: 0; }

  /* ---------- reviewer rail ---------- */
  .rail {
    position: sticky;
    top: 0;
    flex: 0 0 20.5rem;
    height: 100vh;
    overflow-y: auto;
    padding: 2.25rem 1.5rem 3rem 2rem;
    background: var(--panel);
    border-right: 1px solid var(--rule);
    font-family: var(--sans);
  }
  .eyebrow {
    font-family: var(--sans);
    font-size: .68rem;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .rail-title {
    margin: .45rem 0 1.9rem;
    font-family: var(--serif);
    font-size: 1.22rem;
    font-weight: 600;
    line-height: 1.3;
    text-wrap: balance;
  }
  .rail ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .15rem; }

  .doc-link {
    display: grid;
    grid-template-columns: 1.9rem 1fr;
    gap: .3rem;
    padding: .5rem .6rem .5rem .55rem;
    border-radius: 5px;
    border-left: 2px solid transparent;
    color: var(--muted);
    text-decoration: none;
    font-size: .84rem;
    line-height: 1.38;
  }
  .doc-link:hover { background: var(--rule-soft); color: var(--ink); }
  .doc-link[aria-current="true"] {
    background: var(--accent-wash);
    border-left-color: var(--accent);
    color: var(--ink);
    font-weight: 600;
  }
  .doc-num { font-variant-numeric: tabular-nums; color: var(--faint); font-weight: 500; }

  .rail .requests {
    list-style: none;
    margin: .3rem 0 .9rem;
    padding: 0 0 0 2.45rem;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .rail .requests a {
    display: grid;
    grid-template-columns: 1.7rem 1fr;
    gap: .25rem;
    padding: .28rem 0 .28rem .65rem;
    border-left: 1px solid var(--rule);
    color: var(--muted);
    text-decoration: none;
    font-size: .765rem;
    line-height: 1.35;
  }
  .rail .requests a:hover { color: var(--accent); border-left-color: var(--accent); }
  .rail .requests .n { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--faint); }
  .rail .requests a:hover .n { color: var(--accent); }
  .rail .requests .dot {
    display: inline-block;
    width: .38rem; height: .38rem;
    border-radius: 50%;
    margin-left: .3rem;
    vertical-align: .05rem;
    background: var(--critical);
  }

  /* ---------- article ---------- */
  main { flex: 1 1 auto; min-width: 0; padding: 3.25rem 3.25rem 7rem; }
  article { max-width: var(--column); margin: 0 auto; }
  /* Text holds the measure; tables and rules run the full column width. */
  .doc-head > *,
  .body > p,
  .body > ul,
  .body > ol,
  .body > blockquote,
  .body > h2,
  .body > h3,
  .body > h4 { max-width: var(--measure); }
  .doc-head { margin-bottom: 2.4rem; padding-bottom: 1.3rem; border-bottom: 1px solid var(--rule); }
  .doc-head h1 {
    margin: .5rem 0 0;
    font-size: 1.9rem;
    font-weight: 600;
    line-height: 1.24;
    text-wrap: balance;
  }
  .doc-tally {
    margin-top: .85rem;
    font-family: var(--sans);
    font-size: .78rem;
    color: var(--muted);
  }

  /* Requested-change header: number and severity sit above the title. */
  .body .request {
    display: flex;
    flex-direction: column;
    gap: .4rem;
    margin: 3.1rem 0 1.05rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    scroll-margin-top: 1.25rem;
  }
  .body .request:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .request-meta { display: flex; align-items: center; gap: .55rem; }
  .request-num {
    font-family: var(--sans);
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .1em;
    color: var(--accent);
  }
  .chip {
    font-family: var(--sans);
    font-size: .64rem;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    padding: .17rem .45rem;
    border-radius: 3px;
  }
  .chip-critical { color: var(--critical); background: var(--critical-wash); }
  .chip-strengthening { color: var(--strengthening); background: var(--strengthening-wash); }
  .request-title { max-width: var(--measure); font-size: 1.3rem; font-weight: 600; line-height: 1.32; text-wrap: balance; }

  .body h2 {
    font-size: 1.3rem;
    font-weight: 600;
    line-height: 1.32;
    margin: 2.8rem 0 1rem;
    scroll-margin-top: 1.25rem;
  }
  .body h3 { font-size: 1.06rem; font-weight: 600; margin: 2rem 0 .55rem; }
  .body h4 {
    font-family: var(--sans);
    font-size: .84rem;
    font-weight: 600;
    letter-spacing: .01em;
    margin: 1.6rem 0 .45rem;
    color: var(--muted);
  }
  .body p { margin: 0 0 1.05rem; }
  .body ul, .body ol { margin: 0 0 1.1rem; padding-left: 1.3rem; }
  .body li { margin-bottom: .4rem; }
  .body li::marker { color: var(--faint); }
  .body strong { font-weight: 600; }
  .body hr { border: 0; border-top: 1px solid var(--rule); margin: 2.4rem 0; }
  .body blockquote {
    margin: 1.25rem 0;
    padding-left: 1.1rem;
    border-left: 2px solid var(--rule);
    color: var(--muted);
  }
  .body code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .84em;
    background: var(--rule-soft);
    padding: .1em .32em;
    border-radius: 3px;
  }
  .body pre {
    background: var(--rule-soft);
    padding: .95rem 1.1rem;
    border-radius: 6px;
    overflow-x: auto;
    font-size: .82rem;
    line-height: 1.55;
  }
  .body pre code { background: none; padding: 0; }
  .body math { font-size: 1.02em; }

  /* ---------- result tables ---------- */
  .table-scroll { overflow-x: auto; margin: 1.4rem 0 1.7rem; }
  .body table {
    border-collapse: collapse;
    min-width: 100%;
    font-family: var(--sans);
    font-size: .795rem;
    line-height: 1.4;
    font-variant-numeric: tabular-nums;
  }
  .body th, .body td {
    padding: .44rem .75rem;
    text-align: right;
    white-space: nowrap;
    border-bottom: 1px solid var(--rule-soft);
  }
  .body th:first-child, .body td:first-child,
  .body th:nth-child(2), .body td:nth-child(2) { text-align: left; }
  .body thead th {
    border-bottom: 1px solid var(--rule);
    font-size: .69rem;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--muted);
    vertical-align: bottom;
  }
  .body tbody tr:last-child td { border-bottom: 0; }
  .body table em { color: var(--muted); font-style: normal; }

  /* ---------- pager ---------- */
  .pager {
    display: flex;
    justify-content: space-between;
    gap: 1.5rem;
    margin-top: 4.5rem;
    padding-top: 1.4rem;
    border-top: 1px solid var(--rule);
    font-family: var(--sans);
  }
  .pager a { max-width: 46%; text-decoration: none; color: var(--ink); font-size: .87rem; line-height: 1.35; }
  .pager a:hover { color: var(--accent); }
  .pager .dir { display: block; font-size: .66rem; letter-spacing: .13em; text-transform: uppercase; color: var(--faint); margin-bottom: .2rem; }
  .pager .next { text-align: right; margin-left: auto; }

  @media (max-width: 960px) {
    .layout { display: block; }
    .rail {
      position: static;
      height: auto;
      width: 100%;
      padding: 1.5rem 1.25rem;
      border-right: 0;
      border-bottom: 1px solid var(--rule);
    }
    .rail .requests { display: none; }
    main { padding: 2rem 1.25rem 4rem; }
    article, .doc-head > *, .body > * , .request-title { max-width: 100%; }
    .doc-head h1 { font-size: 1.5rem; }
    .request-title { font-size: 1.15rem; }
  }
</style>

<script>
const DOCS = [{"id":"00","title":"TMLR Rebuttal — Review Index and Requested Changes","nav":"Review Index and Requested Changes","toc":[],"html":"<p>This index follows the reviewer order in <code>tmlr_review.html<\/code>. Each note is titled by its main requested changes while retaining the reviewer ID for traceability.<\/p>\n<h2>1. <a href=\"#/01\">Reviewer i2V6 — Metrics, Grounding, Positioning, Controls, and Uncertainty<\/a><\/h2>\n<p><strong>Critical requests<\/strong><\/p>\n<ul>\n<li>Correct or redefine <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span>.<\/li>\n<li>Better separate grounding from downstream visual reasoning.<\/li>\n<li>Strengthen positioning against modern referring-expression benchmarks, especially Ref-Adv.<\/li>\n<\/ul>\n<p><strong>Strengthening requests<\/strong><\/p>\n<ul>\n<li>Add controls for relevant-region extraction and graying.<\/li>\n<li>Report uncertainty for the counting split and smaller diagnostic analyses.<\/li>\n<li>Investigate the Gemini-3.x synthetic/real attribute-binding gap.<\/li>\n<\/ul>\n<h2>2. <a href=\"#/02\">Reviewer 8nar — Metrics, Synthetic Bias, Uncertainty, Human Baseline, and Zooming<\/a><\/h2>\n<ul>\n<li>Clarify whether group accuracy is a macro average or a strict joint criterion.<\/li>\n<li>Test or properly scope the synthetic self-preference claim for Gemini-3.5-Flash and Gemini-3.1-Pro-Preview.<\/li>\n<li>Report repeated runs or uncertainty intervals for Tables 2 and 4 and Figures 5 and 8.<\/li>\n<li>Report the number of parent queries per split.<\/li>\n<li>Explain how the answering filter shapes the human baseline and human–model gap.<\/li>\n<li>Extend the zoom study to at least one stronger model.<\/li>\n<\/ul>\n<h2>3. <a href=\"#/03\">Reviewer z6WX — Synthetic Gap, Region Extraction, Localization, and Related Work<\/a><\/h2>\n<ul>\n<li>Explain or appropriately scope the Gemini-3.x synthetic-AB anomaly and report count-conditioned sample frequencies/reliability.<\/li>\n<li>Separate localization quality from crop-resolution effects and test significance on the 800-sample subset.<\/li>\n<li>Explain why the localize-and-reason task was dropped and discuss it as a future direction.<\/li>\n<li>Connect the visual-prompting findings to internal grounding and visual-attention work in LVLMs.<\/li>\n<\/ul>\n<h2>4. <a href=\"#/04\">Reviewer MJZs — Benchmark Positioning, Grounding, Controls, and Dataset Statistics<\/a><\/h2>\n<ul>\n<li>Strengthen related work and benchmark positioning across REC, phrase grounding, referring segmentation, DOD, and REIR.<\/li>\n<li>Add quantitative evidence that existing benchmarks underrepresent dense same-category and relational reasoning settings.<\/li>\n<li>Distinguish grounding failures from attribute-binding failures using an explicit grounding evaluation.<\/li>\n<li>Add controls for visual prompting, graying, and region extraction, or weaken the corresponding causal claims.<\/li>\n<li>Report basic dataset statistics, including image counts and questions per image.<\/li>\n<\/ul>\n<h2>5. <a href=\"#/05\">Reviewer 2b3E — Grounding, Intervention Controls, Metrics, and Counting Consistency<\/a><\/h2>\n<ul>\n<li>Revise or strengthen the decomposition of localization, recognition, and attribute binding.<\/li>\n<li>Add proper controls for distractor reduction and relevant-region extraction.<\/li>\n<li>Correct the interpretation of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span> and add strict group exact match.<\/li>\n<li>Evaluate hierarchical counting consistency, exact match, MAE, and signed bias.<\/li>\n<li>Add clustered bootstrap uncertainty and paired significance analyses at appropriate grouping levels.<\/li>\n<li>Strengthen the synthetic-data analysis.<\/li>\n<\/ul>\n","counts":{"critical":0,"total":0}},{"id":"01","title":"Reviewer i2V6 — Metrics, Grounding, Benchmark Positioning, Controls, and Uncertainty","nav":"Reviewer i2V6","toc":[{"id":"r1-correct-or-redefine","num":"R1","tag":"Critical","kind":"critical","title":"Correct or redefine"},{"id":"r2-better-separate-grounding-from-downstream-visual-reasoning","num":"R2","tag":"Critical","kind":"critical","title":"Better separate grounding from downstream visual reasoning"},{"id":"r3-strengthen-positioning-against-modern-referring-expression-b","num":"R3","tag":"Critical","kind":"critical","title":"Strengthen positioning against modern referring-expression benchmarks"},{"id":"r4-add-controls-for-the-diagnostic-interventions","num":"R4","tag":"Strengthening","kind":"strengthening","title":"Add controls for the diagnostic interventions"},{"id":"r5-report-uncertainty-for-the-smaller-analyses","num":"R5","tag":"Strengthening","kind":"strengthening","title":"Report uncertainty for the smaller analyses"},{"id":"r6-investigate-the-large-syntheticreal-gap-for-gemini-3x","num":"R6","tag":"Strengthening","kind":"strengthening","title":"Investigate the large synthetic/real gap for Gemini-3.x"}],"html":"<p>We sincerely thank the reviewer for providing constructive feedback for our work. The feedback has allowed us to improve and tighten our work. We are encouraged that the reviewer finds the premise of the work useful for multimodal LLM research. Listed below is our response to the reviewer on the changes requested by them.  <\/p>\n<h2 class=\"request\" id=\"r1-correct-or-redefine\"><span class=\"request-meta\"><span class=\"request-num\">R1<\/span><span class=\"chip chip-critical\">Critical<\/span><\/span><span class=\"request-title\">Correct or redefine <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span><\/span><\/h2>\n\n<h3>Clarification of Group Accuracy (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span>).<\/h3>\n<p>We would like to clarify that <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span> was not intended to be an all-or-nothing criterion.\nAs explicitly defined in Eq. (1), for each target instance we first compute\nthe fraction of its valid attribute questions answered correctly, and then\naverage this quantity equally across target instances. Thus, an instance for\nwhich four out of five attributes are answered correctly contributes <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.8<\/mn><\/mrow><annotation encoding=\"application/x-tex\">0.8<\/annotation><\/semantics><\/math><\/span>,\nnot <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">0<\/annotation><\/semantics><\/math><\/span>.<\/p>\n<p><strong>Our use of the term &quot;jointly&quot; was intended to indicate that the valid<\/strong>\n<strong>attributes associated with the same target instance are evaluated together<\/strong>\n<strong>as a group, rather than pooling all attribute questions independently across<\/strong>\n<strong>the benchmark.<\/strong> This group-wise averaging also ensures that every target\ninstance receives equal weight regardless of the number of valid attributes\nassociated with it; consequently, an error has a larger effect on the score\nof an instance characterized by fewer attributes. <\/p>\n<p>We agree that the word &quot;jointly&quot; may be read as implying an all-attributes-\ncorrect criterion. We will revise this wording in the manuscript to make the intended interpretation explicit. The metric definition and reported results remain unchanged.<\/p>\n<h2 class=\"request\" id=\"r2-better-separate-grounding-from-downstream-visual-reasoning\"><span class=\"request-meta\"><span class=\"request-num\">R2<\/span><span class=\"chip chip-critical\">Critical<\/span><\/span><span class=\"request-title\">Better separate grounding from downstream visual reasoning<\/span><\/h2>\n\n\n\n<h3>Better separating RE grounding from downstream visual reasoning.<\/h3>\n<p>Thank you for this important suggestion. We agree that the original\nvisual-prompting experiment alone did not cleanly separate referring-expression\n(RE) grounding from downstream Attribute Binding (AB) performance due to additional errors that can arise from prompting artifacts. We have therefore added explicit RE-grounding evaluations and directly connected their outcomes to the corresponding AB answers.<\/p>\n<p><strong>Explicit RE grounding.<\/strong><\/p>\n<p>Unlike AB, for which MIMO-Bench defines a fixed multiple-choice output, there is\nno single neutral output format for localization. We therefore evaluate two\ncomplementary grounding interfaces on the full evaluation set.<\/p>\n<p>In <em>box-choice grounding<\/em>, the original RE is retained and four candidate\ninstances are marked; the model must select the candidate referred to by the RE.\nThis gives a simple discrete grounding decision, but necessarily modifies the\nimage through the candidate overlays. In <em>coordinate grounding<\/em>, the model\ninstead receives the original unmodified image and RE and predicts the target\ncoordinates. This avoids candidate overlays, but introduces an additional\nspatial-coordinate prediction requirement.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Model<\/strong><\/th>\n<th><strong>Grounding<\/strong><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi mathvariant=\"bold\">G<\/mi><mo>+<\/mo><\/msup><msup><mi mathvariant=\"bold\">A<\/mi><mo>+<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{G^+A^+}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi mathvariant=\"bold\">G<\/mi><mo>+<\/mo><\/msup><msup><mi mathvariant=\"bold\">A<\/mi><mo>−<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{G^+A^-}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi mathvariant=\"bold\">G<\/mi><mo>−<\/mo><\/msup><msup><mi mathvariant=\"bold\">A<\/mi><mo>+<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{G^-A^+}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi mathvariant=\"bold\">G<\/mi><mo>−<\/mo><\/msup><msup><mi mathvariant=\"bold\">A<\/mi><mo>−<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{G^-A^-}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><strong>G-Acc.<\/strong><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"bold\">P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi mathvariant=\"bold\">A<\/mi><mo>+<\/mo><\/msup><mo>∣<\/mo><msup><mi mathvariant=\"bold\">G<\/mi><mo>+<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{P(A^+\\mid G^+)}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"bold\">P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi mathvariant=\"bold\">A<\/mi><mo>+<\/mo><\/msup><mo>∣<\/mo><msup><mi mathvariant=\"bold\">G<\/mi><mo>−<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">\\mathbf{P(A^+\\mid G^-)}<\/annotation><\/semantics><\/math><\/span><\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"bold\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\boldsymbol{\\Delta}<\/annotation><\/semantics><\/math><\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Qwen3-VL-8B<\/td>\n<td>Box-choice<\/td>\n<td align=\"right\">36.9<\/td>\n<td align=\"right\">29.6<\/td>\n<td align=\"right\">15.6<\/td>\n<td align=\"right\">18.0<\/td>\n<td align=\"right\">66.5<\/td>\n<td align=\"right\">55.5<\/td>\n<td align=\"right\">46.4<\/td>\n<td align=\"right\">+9.1<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Coordinates<\/td>\n<td align=\"right\">15.9<\/td>\n<td align=\"right\">10.6<\/td>\n<td align=\"right\">32.4<\/td>\n<td align=\"right\">41.1<\/td>\n<td align=\"right\">26.5<\/td>\n<td align=\"right\">59.9<\/td>\n<td align=\"right\">44.1<\/td>\n<td align=\"right\">+15.8<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-14B<\/td>\n<td>Box-choice<\/td>\n<td align=\"right\">30.7<\/td>\n<td align=\"right\">18.9<\/td>\n<td align=\"right\">27.9<\/td>\n<td align=\"right\">22.5<\/td>\n<td align=\"right\">49.6<\/td>\n<td align=\"right\">61.9<\/td>\n<td align=\"right\">55.3<\/td>\n<td align=\"right\">+6.5<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Coordinates<\/td>\n<td align=\"right\">7.7<\/td>\n<td align=\"right\">6.1<\/td>\n<td align=\"right\">48.2<\/td>\n<td align=\"right\">38.0<\/td>\n<td align=\"right\">13.8<\/td>\n<td align=\"right\">55.9<\/td>\n<td align=\"right\">55.9<\/td>\n<td align=\"right\">0.0<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-14B<\/td>\n<td>Box-choice<\/td>\n<td align=\"right\">26.3<\/td>\n<td align=\"right\">28.0<\/td>\n<td align=\"right\">17.5<\/td>\n<td align=\"right\">28.3<\/td>\n<td align=\"right\">54.3<\/td>\n<td align=\"right\">48.4<\/td>\n<td align=\"right\">38.2<\/td>\n<td align=\"right\">+10.3<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Coordinates<\/td>\n<td align=\"right\">7.1<\/td>\n<td align=\"right\">8.4<\/td>\n<td align=\"right\">34.0<\/td>\n<td align=\"right\">50.6<\/td>\n<td align=\"right\">15.4<\/td>\n<td align=\"right\">45.6<\/td>\n<td align=\"right\">40.2<\/td>\n<td align=\"right\">+5.5<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td>Box-choice<\/td>\n<td align=\"right\">27.2<\/td>\n<td align=\"right\">22.1<\/td>\n<td align=\"right\">24.9<\/td>\n<td align=\"right\">25.8<\/td>\n<td align=\"right\">49.3<\/td>\n<td align=\"right\">55.2<\/td>\n<td align=\"right\">49.2<\/td>\n<td align=\"right\">+6.0<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Coordinates<\/td>\n<td align=\"right\">5.2<\/td>\n<td align=\"right\">4.6<\/td>\n<td align=\"right\">42.9<\/td>\n<td align=\"right\">47.3<\/td>\n<td align=\"right\">9.8<\/td>\n<td align=\"right\">52.9<\/td>\n<td align=\"right\">47.6<\/td>\n<td align=\"right\">+5.3<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td>Box-choice<\/td>\n<td align=\"right\">21.0<\/td>\n<td align=\"right\">29.4<\/td>\n<td align=\"right\">17.2<\/td>\n<td align=\"right\">32.4<\/td>\n<td align=\"right\">50.4<\/td>\n<td align=\"right\">41.6<\/td>\n<td align=\"right\">34.7<\/td>\n<td align=\"right\">+6.9<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Coordinates<\/td>\n<td align=\"right\">7.0<\/td>\n<td align=\"right\">11.0<\/td>\n<td align=\"right\">28.9<\/td>\n<td align=\"right\">53.0<\/td>\n<td align=\"right\">18.1<\/td>\n<td align=\"right\">38.9<\/td>\n<td align=\"right\">35.3<\/td>\n<td align=\"right\">+3.6<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><em>Explicit RE-grounding outcomes and their correspondence with\nAttribute Binding (AB) answers on matched examples.\nCells report the percentage of the evaluation set falling in each outcome. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>G<\/mi><mo>+<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">G^+<\/annotation><\/semantics><\/math><\/span>/<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>G<\/mi><mo>−<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">G^-<\/annotation><\/semantics><\/math><\/span> denote correct/incorrect grounding and\n<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>A<\/mi><mo>+<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">A^+<\/annotation><\/semantics><\/math><\/span>/<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>A<\/mi><mo>−<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">A^-<\/annotation><\/semantics><\/math><\/span> denote correct/incorrect AB answers.\nG-Acc. denotes grounding accuracy, and\n<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><mo>=<\/mo><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi>A<\/mi><mo>+<\/mo><\/msup><mi mathvariant=\"normal\">∣<\/mi><msup><mi>G<\/mi><mo>+<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi>A<\/mi><mo>+<\/mo><\/msup><mi mathvariant=\"normal\">∣<\/mi><msup><mi>G<\/mi><mo>−<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">\\Delta=P(A^+|G^+)-P(A^+|G^-)<\/annotation><\/semantics><\/math><\/span>.\nAll accuracies and conditional probabilities are percentages.\nChance accuracy for box-choice grounding is 25%.<\/em><\/p>\n<p>The box-choice results provide a clear behavioral separation. Grounding itself\nis far from solved (49.3--66.5%), and for every model AB accuracy is higher\nwhen the RE is grounded correctly:\n<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi>A<\/mi><mo>+<\/mo><\/msup><mi mathvariant=\"normal\">∣<\/mi><msup><mi>G<\/mi><mo>+<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi>A<\/mi><mo>+<\/mo><\/msup><mi mathvariant=\"normal\">∣<\/mi><msup><mi>G<\/mi><mo>−<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mo>+<\/mo><mn>6.0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">P(A^+|G^+)-P(A^+|G^-)=+6.0<\/annotation><\/semantics><\/math><\/span> to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>+<\/mo><mn>10.3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">+10.3<\/annotation><\/semantics><\/math><\/span> points. At the same time,\ncorrect grounding is not sufficient for a correct AB answer:\n<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi>A<\/mi><mo>+<\/mo><\/msup><mi mathvariant=\"normal\">∣<\/mi><msup><mi>G<\/mi><mo>+<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">P(A^+|G^+)<\/annotation><\/semantics><\/math><\/span> remains only 41.6--61.9%. Thus, we directly observe both\ngrounding failures and a large set of cases in which grounding succeeds but the\nqueried attribute is still answered incorrectly.<\/p>\n<p>The coordinate results also reveal an important limitation of attempting to\ninsert &quot;localization&quot; as a clean intermediate stage. Coordinate grounding is\nsubstantially weaker (9.8--26.5%) and its correspondence with AB accuracy is\nless consistent. We do not interpret this as evidence that the same models\nsuddenly possess much poorer underlying RE comprehension. Rather, coordinate\nprediction additionally requires the model to express its localization through\na precise spatial output, whereas box-choice constrains the answer space but\nalters the image. The large disparity between these two grounding interfaces\ntherefore shows that measured localization performance itself depends on how\nthe grounding decision is elicited.<\/p>\n<p>This ambiguity is also why we had originally refrained from introducing an\nexplicit localization stage into MIMO-Bench: unlike the AB output, there is no\nobvious localization interface that does not introduce an additional task\nrequirement or input modification. We agree, however, that this limitation and\nthe distinction between grounding and downstream reasoning should have been\nmade explicit. We now report both grounding formulations rather than relying on\nvisual prompting alone.<\/p>\n<p>Additionally the annotated data does have the bounding polygon coordinates for each and every target object. Hence, a developer who intends to benchmark their MLLM using MIMO-Bench can choose the preferred choice of intervention, either though overlaid bounding boxes on the image or through raw coordinates. <\/p>\n<p><strong>Revised interpretation of visual prompting.<\/strong><\/p>\n<p>Visual prompting now serves a separate purpose. It replaces the compositional\ntextual RE with a ground-truth visual indication of the target and measures AB\nperformance when the target is specified directly. Its substantial IACC gain\ntherefore shows that replacing RE-based target identification with direct visual\ntarget specification makes the task considerably easier. However, because the\nmarker itself changes the image and must be perceived and interpreted, we no\nlonger interpret this gain as a pure grounding-error estimate or the remaining\nerror as pure attribute binding. Residual errors can additionally arise from\nfine-grained recognition, component identification, interpretation of the\nvisual marker, or other target-conditioned visual reasoning failures.<\/p>\n<p>Accordingly, our revised conclusion is behavioral rather than an exact causal\npartition: RE grounding is itself challenging; successful grounding is\nconsistently associated with better AB performance; and substantial AB error\nremains even when grounding succeeds. Visual prompting provides complementary\nevidence that externally supplying the target alleviates a substantial part of\nthe difficulty.<\/p>\n<p>Finally, the benchmark already associates each RE with its ground-truth target\nannotation. We will release the corresponding ground-truth target localization\n(mask/bounding-box coordinates) with MIMO-Bench, enabling future work to\nevaluate alternative grounding formulations without reconstructing these\nannotations.<\/p>\n<h2 class=\"request\" id=\"r3-strengthen-positioning-against-modern-referring-expression-b\"><span class=\"request-meta\"><span class=\"request-num\">R3<\/span><span class=\"chip chip-critical\">Critical<\/span><\/span><span class=\"request-title\">Strengthen positioning against modern referring-expression benchmarks<\/span><\/h2>\n\n<h3>Positioning relative to Ref-Adv.<\/h3>\n<p>We thank the reviewer for pointing us to Ref-Adv, which is closely related in its study of same-category distractors and complex referring expressions. We have added it to the revised related work and comparison. Importantly, however, Ref-Adv and MIMO-Bench evaluate different capabilities and operate in substantially different scene regimes. Ref-Adv is a referring-expression comprehension (REC) benchmark: given an image and a referring expression, the model is evaluated on localization of a single target object. MIMO-Bench instead embeds reference resolution within downstream visual reasoning, requiring the model to identify the relevant instance or group and subsequently perform attribute binding or numerical counting. The density regimes are also substantially different. Ref-Adv contains at least two same-category distractors and reports 4.01 distractors per example on average, with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≥<\/mo><mn>7<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\geq7<\/annotation><\/semantics><\/math><\/span> forming its highest-distractor analysis bin. In contrast, dense multi-instance structure is a defining axis of MIMO-Bench: Fig. 2 of the main paper shows median per-category instance counts of 57 for persons, 53 for pots, 49 for plants, 45 for upper-body clothing, 43 for vases, and 40 for leaves; for several categories, even the first quartile contains more than 20 instances. MIMO-Bench further combines high-resolution real (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>∼<\/mo><mn>2500<\/mn><mo>×<\/mo><mn>1500<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\sim2500\\times1500<\/annotation><\/semantics><\/math><\/span>) and synthetic (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1024<\/mn><mo>×<\/mo><mn>1024<\/mn><\/mrow><annotation encoding=\"application/x-tex\">1024\\times1024<\/annotation><\/semantics><\/math><\/span>) scenes to enable such density. Thus, the overlap lies in the use of same-category distractors and compositional referring expressions, while MIMO-Bench targets a different question: whether MLLMs can perform downstream attribute reasoning and group-level counting when reference resolution must occur in substantially denser Multi-Instance Multi-Object scenes. We summarize these distinctions below.<\/p>\n<p><strong>Positioning MIMO-Bench relative to Ref-Adv.<\/strong><\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Benchmark<\/strong><\/th>\n<th><strong>Real/Syn.<\/strong><\/th>\n<th><strong>Comp. REs<\/strong><\/th>\n<th><strong>Primary Task<\/strong><\/th>\n<th><strong>Scene Regime<\/strong><\/th>\n<th><strong>Reference Role<\/strong><\/th>\n<th><strong>Output<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Ref-Adv<\/td>\n<td>✓/✗<\/td>\n<td>✓<\/td>\n<td>REC<\/td>\n<td>Hard distractors<\/td>\n<td>Final task<\/td>\n<td>Box<\/td>\n<\/tr>\n<tr>\n<td>MIMO-Bench<\/td>\n<td>✓/✓<\/td>\n<td>✓<\/td>\n<td>AB + NC<\/td>\n<td>Dense MIMO<\/td>\n<td>Intermediate<\/td>\n<td>Attribute / Count<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2 class=\"request\" id=\"r4-add-controls-for-the-diagnostic-interventions\"><span class=\"request-meta\"><span class=\"request-num\">R4<\/span><span class=\"chip chip-strengthening\">Strengthening<\/span><\/span><span class=\"request-title\">Add controls for the diagnostic interventions<\/span><\/h2>\n\n<h3>Relevant-region extraction: localization quality and cropping controls.<\/h3>\n<p><strong>R4: Localization quality and cropping controls for relevant-region extraction.<\/strong><\/p>\n<p>We thank the reviewer for suggesting that we directly evaluate the quality\nof the proposed regions and compare them against a non-model-driven cropping\nbaseline. We have performed this additional analysis.<\/p>\n<h3>Predicted-region statistics and localization quality.<\/h3>\n<p>Across all valid regions produced by the relevant-region extraction or manual zooming\nruns, the mean predicted crop is approximately <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>459<\/mn><mo>×<\/mo><mn>479<\/mn><\/mrow><annotation encoding=\"application/x-tex\">459\\times479<\/annotation><\/semantics><\/math><\/span> pixels\n(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>232,227<\/mn><\/mrow><annotation encoding=\"application/x-tex\">232{,}227<\/annotation><\/semantics><\/math><\/span> px<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mrow><\/mrow><mn>2<\/mn><\/msup><\/mrow><annotation encoding=\"application/x-tex\">^2<\/annotation><\/semantics><\/math><\/span>), corresponding to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12.43<\/mn><mi mathvariant=\"normal\">%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">12.43\\%<\/annotation><\/semantics><\/math><\/span> of the original image area.\nWe further compute the IoU of every proposed crop with the ground-truth\ntarget box and condition final-answer accuracy on this localization quality.<\/p>\n<h3>Comparison with a non-model-driven crop.<\/h3>\n<p>Our existing MIMO-Crop<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow><\/mrow><mn>512<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">_{512}<\/annotation><\/semantics><\/math><\/span> condition provides the corresponding\nexternally supplied cropping baseline. In MIMO-Crop, the crop is constructed\naround the annotated target independently of the evaluated MLLM, while\nretaining the visual context required by the referring expression. Its\n<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>512<\/mn><mo>×<\/mo><mn>512<\/mn><\/mrow><annotation encoding=\"application/x-tex\">512\\times512<\/annotation><\/semantics><\/math><\/span> spatial scale is also close to the mean size of the\nmodel-proposed regions.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th><strong>Model<\/strong><\/th>\n<th align=\"right\"><strong>Base<\/strong><\/th>\n<th align=\"right\"><strong>0--25<\/strong><\/th>\n<th align=\"right\"><strong>25--50<\/strong><\/th>\n<th align=\"right\"><strong>50--75<\/strong><\/th>\n<th align=\"right\"><strong>75--100<\/strong><\/th>\n<th align=\"right\"><strong>MIMO-Crop<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow><\/mrow><mn>512<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">_{512}<\/annotation><\/semantics><\/math><\/span><\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>InternVL3-14B<\/td>\n<td align=\"right\">37.2<\/td>\n<td align=\"right\">48.8<\/td>\n<td align=\"right\">51.6<\/td>\n<td align=\"right\">56.5<\/td>\n<td align=\"right\">52.0<\/td>\n<td align=\"right\">50.7<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td align=\"right\">35.9<\/td>\n<td align=\"right\">35.4<\/td>\n<td align=\"right\">44.9<\/td>\n<td align=\"right\">51.5<\/td>\n<td align=\"right\">51.0<\/td>\n<td align=\"right\">46.8<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td align=\"right\">40.5<\/td>\n<td align=\"right\">37.2<\/td>\n<td align=\"right\">42.7<\/td>\n<td align=\"right\">36.4<\/td>\n<td align=\"right\">45.8<\/td>\n<td align=\"right\">50.7<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-32B<\/td>\n<td align=\"right\">47.5<\/td>\n<td align=\"right\">41.2<\/td>\n<td align=\"right\">45.5<\/td>\n<td align=\"right\">49.0<\/td>\n<td align=\"right\">52.9<\/td>\n<td align=\"right\">48.9<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-8B<\/td>\n<td align=\"right\">40.3<\/td>\n<td align=\"right\">39.3<\/td>\n<td align=\"right\">45.5<\/td>\n<td align=\"right\">39.0<\/td>\n<td align=\"right\">50.8<\/td>\n<td align=\"right\">44.4<\/td>\n<\/tr>\n<tr>\n<td>Qwen2.5-VL-7B<\/td>\n<td align=\"right\">35.8<\/td>\n<td align=\"right\">29.7<\/td>\n<td align=\"right\">40.5<\/td>\n<td align=\"right\">28.6<\/td>\n<td align=\"right\">39.2<\/td>\n<td align=\"right\">47.6<\/td>\n<\/tr>\n<tr>\n<td><strong>Mean<\/strong><\/td>\n<td align=\"right\"><strong>39.5<\/strong><\/td>\n<td align=\"right\"><strong>38.6<\/strong><\/td>\n<td align=\"right\"><strong>45.1<\/strong><\/td>\n<td align=\"right\"><strong>43.5<\/strong><\/td>\n<td align=\"right\"><strong>48.6<\/strong><\/td>\n<td align=\"right\"><strong>48.2<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><em>Final-answer accuracy conditioned on the IoU of the predicted crop\nwith the ground-truth target box. MIMO-Crop<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow><\/mrow><mn>512<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">_{512}<\/annotation><\/semantics><\/math><\/span> is an externally\nconstructed, non-model-driven relevant crop.<\/em><\/p>\n<p>Two observations follow. First, very poorly localized predicted crops\n(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">0<\/annotation><\/semantics><\/math><\/span>--<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>25<\/mn><mi mathvariant=\"normal\">%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">25\\%<\/annotation><\/semantics><\/math><\/span> IoU) achieve <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>38.6<\/mn><mi mathvariant=\"normal\">%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">38.6\\%<\/annotation><\/semantics><\/math><\/span> mean accuracy, at or slightly below\nthe <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>39.5<\/mn><mi mathvariant=\"normal\">%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">39.5\\%<\/annotation><\/semantics><\/math><\/span> full-image baseline. These examples still receive the additional\ninference call and crop/re-query operation, suggesting that an additional\ncall or rescaling alone is insufficient to explain the gain.<\/p>\n<p>Second, highly overlapping model-selected crops (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>75<\/mn><\/mrow><annotation encoding=\"application/x-tex\">75<\/annotation><\/semantics><\/math><\/span>--<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100<\/mn><mi mathvariant=\"normal\">%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">100\\%<\/annotation><\/semantics><\/math><\/span> IoU) reach\n<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>48.6<\/mn><mi mathvariant=\"normal\">%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">48.6\\%<\/annotation><\/semantics><\/math><\/span>, closely matching the <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>48.2<\/mn><mi mathvariant=\"normal\">%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">48.2\\%<\/annotation><\/semantics><\/math><\/span> accuracy of MIMO-Crop<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow><\/mrow><mn>512<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">_{512}<\/annotation><\/semantics><\/math><\/span>.\nThus, when the model succeeds at selecting a target-relevant region, its\ndownstream performance approaches that obtained when a relevant crop is\nexternally provided.<\/p>\n<p>The relationship is not strictly monotonic across intermediate IoUs, which\nis expected because the useful region for a compositional referring\nexpression can extend beyond the target box itself and include referenced\nneighboring objects. We therefore interpret IoU as a simple localization\nquality proxy rather than a complete measure of crop usefulness.<\/p>\n<h3>Two-pass no-crop control.<\/h3>\n<p>We additionally test whether the additional inference call itself explains the gain. In this control the two-turn procedure is kept exactly as in relevant-region extraction: the first turn still asks the model, in text, for a plausible region containing the target, and the second turn passes the model its own predicted region together with the <strong>unmodified<\/strong> image rather than the crop. The region-proposal turn and the extra inference call are therefore held constant, and only the change of visual input is removed.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Qwen2.5-VL-7B<\/td>\n<td align=\"right\">+1.0<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-8B<\/td>\n<td align=\"right\">+1.5<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td align=\"right\">+2.0<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td align=\"right\">+1.1<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-14B<\/td>\n<td align=\"right\">-1.5<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-14B<\/td>\n<td align=\"right\">+3.5<\/td>\n<\/tr>\n<tr>\n<td><strong>Mean<\/strong><\/td>\n<td align=\"right\"><strong>+1.3<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The second inference call alone yields only a +1.3 point mean improvement, and\nno model gains more than +3.5 points. This provides\nan explicit control for the additional inference step and supports the\ninterpretation that the relevant-region gains are associated with changing the\nvisual input to a useful target-relevant region, rather than merely querying\nthe model twice.<\/p>\n<h3>Interpretation and scope.<\/h3>\n<p>We agree that the relevant-region experiment does not isolate localization,\nrescaling, distractor reduction, and additional inference as independent\ncausal factors. Its purpose is instead a deliberately simple proof-of-concept\ntest of whether allowing the model to adaptively narrow the visual input\nbefore answering can help in the MIMO setting.<\/p>\n<p>We would like to clarify, however, that we do not present the current method\nas a complete iterative visual-search system. The manuscript explicitly\nintroduces it as a &quot;small exploratory study&quot;, calls it\n<em>naive relevant-region extraction<\/em>, and describes the procedure as\n&quot;naive single-pass narrowing&quot;. Here, &quot;dynamic visual access&quot; refers only\nto the fact that the second visual input is determined by the model&#39;s first\ninference, in contrast to answering from a single fixed visual input.<\/p>\n<p>The new analysis strengthens this proof-of-concept interpretation:\npoorly localized regions perform approximately at the full-image baseline,\nwhereas highly overlapping regions approach the externally supplied\nMIMO-Crop<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow><\/mrow><mn>512<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">_{512}<\/annotation><\/semantics><\/math><\/span> condition. Thus, successful region selection is associated\nwith the observed benefit, while simply invoking the model a second time is\nnot sufficient.<\/p>\n<p>Together with MIMO-Crop, these results suggest a promising future direction:\nrather than operating only on a fixed full-resolution visual input, models\ncould be explicitly trained to predict useful regions and adapt visual\nresolution/search-space during reasoning, potentially extending this\none-step proof of concept to learned multi-step visual access.<\/p>\n<p>We will add the region-size statistics, IoU-conditioned analysis, and\nMIMO-Crop<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow><\/mrow><mn>512<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">_{512}<\/annotation><\/semantics><\/math><\/span> comparison to the revised manuscript, and clarify the\nproof-of-concept scope of the experiment.<\/p>\n<h3>Graying: controlling for the visual-highlighting effect.<\/h3>\n<!-- Regarding the graying experiment, we agree that we cannot extract a clean causal claim. We would like to provide a clarification for the same. Whenever we discuss about distractor reduction, it would be given that there would be other image related factors that would chnage, and we would like to claim the changes are intentional. The only clean distractor reduction could be done through inpainting similar object category distractors, where we inpaint the masks of instances of similar object category. Any other way to reduce distractors lead to entanglement with other factors. Graying keeps the same number of visual tokens, and does bring a visual highlight to the target region. Zooming does reduce the resolution and provide higher relative sixze ot the target object. This does disqualify these experiments from providing clean causal isolation to characterise distractor effect. However they are useful in their own right as they show distractor reduction, through different channels can be helpful. For example, the zooming experiment shows that augmenting models to find a relevant region, with the aim to reduce distractor, which it does eventually can be helpful. Reducing distractor empirically means to put more focus on the objects that were affected by distracvtos. Human menchanism does this by shifting their foveal attention and thus elving the distractors in the periphery making them less focused or more blurred. So zooming helps putting in more focus on the target object by distractor and resolution reduction at once. GFraying does it by reducing distractors and highlighting the visual region by corrupting visual tokens corresponding to distractors. So even though they do not give a clean causal isolation -->\n\n<h3>Clarification on graying and visual highlighting.<\/h3>\n<p>We agree with the reviewer that graying changes more than the number of\nvisible distractors, and therefore should not be described as a clean causal\nisolation of distractor count. We will revise the manuscript accordingly.<\/p>\n<p>Our intended use of this experiment is to study one way of reducing the\neffective influence of competing visual information in a natural image.\nThe image dimensions remain unchanged and, for a given model, the number of\nvisual tokens is unchanged before and after graying; what changes is the\nvisual information carried by tokens corresponding to regions outside the\nretained window. This suppresses information from distractor-containing\nregions while also increasing the relative salience of the retained region.<\/p>\n<p>More broadly, different mechanisms for reducing distractor burden naturally\nintroduce different coupled changes. Cropping, for example, reduces\ndistractors by narrowing the visual search space and simultaneously changes\nthe relative scale of the target. These changes are therefore not necessarily\nincidental confounds; in some cases they are part of how the effective\ndistractor burden is reduced.<\/p>\n<p>At a high level, this is analogous to selective visual attention in humans:\ntask-relevant regions receive preferential processing while competing\nperipheral information is de-emphasized, reducing its effective influence.\nWe use this only as a conceptual analogy and do not claim that the graying\noperation itself models human vision.<\/p>\n<p>We therefore do not attribute the observed performance change uniquely to\ndistractor count. Instead, we interpret the experiment as evidence that\nreducing effective visual competition through spatial focusing can be useful\nin the MIMO setting. A clean estimate of the causal effect of distractor\ncount itself would require a controlled setting in which distractor instances\nare independently manipulated while other scene properties are held fixed.\nWe will make this distinction explicit in the revised manuscript.<\/p>\n<h3>Alternative outside-region suppression: inpainting.<\/h3>\n<p>To test whether the graying result is specific to the use of a gray visual\nmask, we additionally replace the outside-region content using inpainting.\nUnder the stronger suppression setting, mean accuracy across the six evaluated\nmodels is <strong>42.9%<\/strong>, compared with <strong>42.4%<\/strong> under the corresponding\n1024 / little-suppression setting, a difference of <strong>+0.5 points<\/strong>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th align=\"right\">Strong inpainting<\/th>\n<th align=\"right\">1024 / little suppression<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Delta<\/annotation><\/semantics><\/math><\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Qwen2.5-VL-7B<\/td>\n<td align=\"right\">30.7<\/td>\n<td align=\"right\">30.4<\/td>\n<td align=\"right\">+0.3<\/td>\n<\/tr>\n<tr>\n<td>Qwen3-VL-8B<\/td>\n<td align=\"right\">39.2<\/td>\n<td align=\"right\">39.2<\/td>\n<td align=\"right\">0.0<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-8B<\/td>\n<td align=\"right\">40.8<\/td>\n<td align=\"right\">39.7<\/td>\n<td align=\"right\">+1.1<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-8B<\/td>\n<td align=\"right\">44.7<\/td>\n<td align=\"right\">44.0<\/td>\n<td align=\"right\">+0.7<\/td>\n<\/tr>\n<tr>\n<td>InternVL3-14B<\/td>\n<td align=\"right\">54.5<\/td>\n<td align=\"right\">52.7<\/td>\n<td align=\"right\">+1.8<\/td>\n<\/tr>\n<tr>\n<td>InternVL3.5-14B<\/td>\n<td align=\"right\">47.5<\/td>\n<td align=\"right\">48.2<\/td>\n<td align=\"right\">-0.7<\/td>\n<\/tr>\n<tr>\n<td><strong>Mean<\/strong><\/td>\n<td align=\"right\"><strong>42.9<\/strong><\/td>\n<td align=\"right\"><strong>42.4<\/strong><\/td>\n<td align=\"right\"><strong>+0.5<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The inpainting control therefore does not show a large independent gain from\noutside-region suppression, but it also indicates that the behavior is not\nspecific to replacing the surrounding image with grayscale pixels. More\nimportantly, we do not interpret either graying or inpainting as a clean\ncausal manipulation of distractor count. Both modify the visual input in\nadditional ways. We therefore interpret these interventions, together with\ncropping, as different operational forms of reducing the effective distractor\nburden through spatial focusing, rather than as estimates of the isolated\ncausal effect of distractor count.<\/p>\n<h2 class=\"request\" id=\"r5-report-uncertainty-for-the-smaller-analyses\"><span class=\"request-meta\"><span class=\"request-num\">R5<\/span><span class=\"chip chip-strengthening\">Strengthening<\/span><\/span><span class=\"request-title\">Report uncertainty for the smaller analyses<\/span><\/h2>\n\n<h3>Confidence intervals for the main benchmark results.<\/h3>\n<p>We first report confidence intervals alongside all pooled scores for both\ntasks: IACC and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span> for Attribute Binding, and IMRA, LMRA and\nGMRA for Numerical Counting. Values in brackets denote 95% confidence\nintervals.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th align=\"right\">IACC (95% CI)<\/th>\n<th align=\"right\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">G_{\\mathrm{ACC}}<\/annotation><\/semantics><\/math><\/span> (95% CI)<\/th>\n<th align=\"right\">IMRA (95% CI)<\/th>\n<th align=\"right\">LMRA (95% CI)<\/th>\n<th align=\"right\">GMRA (95% CI)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Gemini-3.5-Flash-Low<\/td>\n<td align=\"right\">54.72 [51.51, 58.99]<\/td>\n<td align=\
